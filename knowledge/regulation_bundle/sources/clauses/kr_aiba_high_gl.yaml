- id: KR-AIBA-HIGH-GL:PAGE-060-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.60 · 5-1   문서화 및 관리 방안
  text: "5-1   문서화 및 관리 방안\n\n5-1-1. 문서화 공통사항                                    \
    \     개발사업자           이용사업자\n\n 목표     인공지능 기본법 제34조제1항제5호 안전성·신뢰성 확보를 위한 조치의\
    \ 내용을 확인할 수 있는\n        안전신뢰문서를 작성하고 보관해야 함.\n 설명     개발 및 이용사업자는 안전성·신뢰성 확보를\
    \ 위해 사용하는 인공지능 관련 주요 정보를 서면 또는\n        전자문서의 형태로 문서화하며, 필요 시 정기적으로 점검·갱신하여 최신\
    \ 상태를 유지하기 위해 노력해야 함.\n       - 문서에는 문서 ID, 버전, 작성 담당자, 작성일을 기록하고 대상 인공지능의 전반적인\
    \ 내용과 작동 방식,\n        구성요소 등을 이해할 수 있도록 작성되어야 함.\n       - 문서간 추적성이 유지되고, 각 문서에서\
    \ 기술하는 내용의 일관성이 유지되어야 함.\n       - 문서화된 정보의 접근 및 보안이 체계적으로 관리되어야 함.\n       -\
    \ 개발사업자와 이용사업자가 반드시 개별적으로 문서화를 수행해야 하는 것은 아니며, 한 사업자가 다른\n        사업자에게 제공한 내용을\
    \ 일부 변경·추가하거나 함께 문서화 작업을 수행하는 것도 가능함.\n        개발 및 이용사업자는 이용자, 과학기술정보통신부장관 등이\
    \ 열람을 요청할 시, 안전신뢰문서를 열람할 수\n        있도록 제공해야 함.\n       - 관계기관, 이용자 등이 열람을 요청한\
    \ 문서에 영업비밀 등 이 포함된 경우, 관련 법령에 따라 해당 내용을\n        제외한 부분만 선별하여 제공할 수 있음.\n 참고 \
    \    韓 신뢰할 수 있는 인공지능 개발안내서\n       - 요구사항 04. 인공지능 시스템의 추적가능성 및 변경이력 확보\n   \
    \     美 NIST AI RMF\n       - Playbook 내 모든 function에 ‘Transparency and Documentation’\
    \ 항목으로써 별도로 기술\n        EU AI ACT\n       - 제11조: 규제 준수 입증을 위해 기술 문서 작성 및 최신화\
    \ 수행\n       - 제12조: 안전한 인공지능 활용을 위해 성능 제한, 위험 등 주요 정보를 이해하기 쉽게 제공\n       - 제18조:\
    \ 안전한 시스템 사용을 위해 목적, 성능, 위험 등 핵심 정보를 명확히 제공\n       - 부속서 IV: 인공지능 시스템의 목적, 구조,\
    \ 개발 과정, 데이터 등 핵심 요소를 기술 문서로 정리\n                                            \
    \                               사업자 구분\n자가점검    문서를 정기적으로 점검갱신하여 최신 상태를 유지하고\
    \ 있는가?                                개발 이용\n        문서 ID, 버전, 작성 담당자, 작성일이\
    \ 식별되는가?                                    개발 이용\n        문서에 대상 시스템이 식별되고 관련\
    \ 설명이 있는가?                                      개발 이용\n        문서간 추적성이 유지되고,\
    \ 각 문서에서 기술하는 내용의 일관성이 유지되고 있는가?                     개발 이용\n        문서화된 정보의\
    \ 접근 및 보안이 체계적으로 관리되고 있는가?                                 개발 이용\n\n\n\n\n   \
    \                                                                            \
    \     59"
