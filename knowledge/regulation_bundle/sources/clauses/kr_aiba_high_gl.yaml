  heading: PDF p.79 · 2. 자가점검 항목
  text: '2. 자가점검 항목


    과학기술정보통신부 및 한국정보통신기술협회에서 발간한 「신뢰할 수 있는 인공지능 개발안내서」 (이하 개발안내서)

    는 인공지능의 신뢰성을 점검하기 위한 69개의 검증항목을 제공하고 있다. 개발안내서의 검증항목은 인공지능의 신

    뢰성을 높이기 위해 사업자 또는 개발자가 자발적으로 고려 및 이행할 수 있는 내용들을 정의하였으므로, 사업자 책

    무의 자가점검 항목과는 성격상 차이가 있다.



    본 절에서는 개발안내서의 검증항목과 본 가이드라인의 자가점검 항목이 어떤 관계가 있는지 관련 정보를 제공하고

    자 한다. 우선 다음 표는 본 가이드라인에서 정의한 자가점검 항목에 가장 관련있는 개발안내서의 검증항목을 연결

    한 결과이다.





    78'
