- id: KR-AIBA-HIGH-GL:PAGE-101-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.101 · 4   이용자 보호
  text: "4   이용자 보호\n\n\n데이터 수집 및 관리 활동\n이용자 보호를 위한 데이터 관리 활동은 아래와 같다 (학습데이터 개요에 대한\
    \ 내용은 2절 참조).\n\n 데이터셋 ID      법적 준수 요구사항                             수집 목적\n\
    \ D2025001    개인정보보호법 준수        영상 분석 AI 모델 및 음성 인식 AI 모델 훈련\n D2025002    개인정보보호법\
    \ 준수        텍스트 분석 AI 모델 훈련\n\n\n                     데이터 유출 및 오용 방지를 위한 기술 적용\
    \ 설명\nD2025001 면접 영상 데이터셋\n (개인정보 비식별 조치) 면접 영상(.mp4) 및 음성(.wav) 데이터에 포함된 얼굴·음성\
    \ 등 개인 식별 가능 정보에 대해\n  「개인정보 비식별 조치 가이드라인 v1.0」(ID: REF-2026-003)에 따라 전처리 단계에서\
    \ 비식별 조치를 적용함.\n  얼굴 랜드마크 추정을 통해 얼굴 영역을 식별한 후, 원본 얼굴 이미지가 외부로 노출되지 않도록\n  블러링·픽셀화·마스킹을\
    \ 통해 처리하고, AI모델 학습에는 얼굴 원본 대신 시선·자세·행동 등 특징 벡터를 활용함.\n  음성 데이터는 화자 식별 가능성을 낮추기\
    \ 위해 원본 음성 대신 음성 특징값(Mel-spectrogram) 기반으로 AI\n  모델을 학습함.\n (서버 보안관리) 면접 영상·음성\
    \ 데이터의 유출 방지를 위해 저장·처리 서버의 보안 통제를 강화하여 운영하고 있음.\n  데이터 저장소는 저장 시 암호화(AES-256)\
    \ 및 전송 시 암호화(TLS)를 적용하고, 접근 권한은 업무 역할 기반으로\n  최소화하여 관리자 계정에는 다중인증(MFA)를 적용하고 있음.\
    \ 또한, 데이터 접근, 다운로드, 반출 행위는 보안\n  로그로 기록하여 추적할 수 있도록 관리하고 있음.\n\n\nD2025002 채용\
    \ 과정 텍스트 데이터셋\n (개인정보 비식별 조치) 채용 과정 텍스트(.json) 데이터셋에 포함될 수 있는 개인 식별 정보의 유출 및\
    \ 오용을\n  방지하기 위해, 전처리 단계에서 비식별 처리 기술을 적용함. 개인정보 탐지 규칙(정규표현식 기반 패턴 탐지)과\n  개체명\
    \ 인식(NER) 기반 탐지 모델을 결합하여 이름, 연락처, 이메일, 주소, 학교명 등의 개인 식별 가능 정보를 자동\n  식별하며, 탐지된\
    \ 항목은 마스킹(ex:[NAME], [PHONE]) 또는 삭제 처리함.\n (데이터 접근 로그 관리) 데이터셋에 대한 접근 이력의 추적성과\
    \ 사후 감사 가능성 확보를 위해 데이터 저장소 및 분석\n  환경에 대한 접근 로그 자동 기록 체계를 적용하고 있음. 데이터 열람, 다운로드,\
    \ 실행 등 주요 행위에 대해 사용자,\n  접근 시간, 요청 행위 유형, 대상 데이터 범위, 접속 환경(IP/단말 정보)를 로그로 남기며,\
    \ 로그는 위변조 방지를 위해\n  별도 보안 저장소에 분리 보관하고, 접근 권한을 제한하여 관리함.\n\n\n\n\n100"
