  text: "5        사람의 관리·감독\n\n\n사람의 개입 기준 및 방법\n인공지능이 의도한 목적에서 벗어난 방식으로 작동하거나 비정상적인\
    \ 결과를 도출하는 경우 등 사람의 개입이 필요\n한 상황에 대한 기준을 아래와 같이 정의한다.\n\n           개입 기준    \
    \             예시 시나리오                       개입 방법\n                          \
    \                           동작 기준이 되는 민감도나 임계값\n인공지능 추론 결과가 설정된 안전        이미지를\
    \ 분석하여 대상일 확률을\n                                                     을 사람이 상황에\
    \ 맞게 수동으로 변\n임계값 미만                    85%로 제시 (임계값 95%)\n                   \
    \                                  경\n                                       \
    \              사람이 해답을 작성하고, 이 수정된\n인공지능이 모르겠다고 명시적으로         \"현재 데이터로는 판단이 불가능합\n\
    \                                                     데이터를 AI 모델의 재학습에 활용\n표현\
    \                        니다\" 라는 답변을 생성함\n                                   \
    \                  하여 정확도를 향상함\n                                             \
    \        사람이 중간 결과나 최종 결과를 확\n재정적 손실 위험이 큼              10억원 이상의 금융거래 진행 전\n \
    \                                                    인하고 승인\n\n\n\n\n정기적 점검\n\
    인공지능에 발생할 수 있는 문제를 예방하기 위한 정기적인 점검 계획 및 방안을 아래와 같이 정의한다.\n\n     점검명      주기 \
    \           목적                참조문서                    기록문서\n 모델 드리프트         \
