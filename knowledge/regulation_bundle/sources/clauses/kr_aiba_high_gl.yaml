- id: KR-AIBA-HIGH-GL:PAGE-043-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.43 · 3-1   인공지능 개발 단계
  text: "3-1   인공지능 개발 단계\n\n3-1-1. 데이터 수집 및 관리                                  \
    \  개발사업자         이용사업자\n\n     목표     데이터 수집 시 이용자 보호를 위해 적법한 절차대로 데이터를 수집 및\
    \ 관리하고, 이 과정에서 데이터 유출\n            및 오용 방지를 위한 기술을 적용해야 함.\n     설명     개발 및\
    \ 이용사업자는 데이터 수집 및 관리 과정에서, 데이터의 수집 목적, 처리 방식 등을 문서화하고\n            체계적으로 관리하여,\
    \ 데이터 활용의 적법성과 신뢰성을 확보하기 위해 노력해야 함.\n            이용사업자는 개발사업자가 제공한 데이터 수집 기준\
    \ 및 관련 사항을 면밀히 검토하고, 필요 시 이를\n            반영한 자체적인 데이터 관리 체계를 수립하고 이행하기 위해 노력해야\
    \ 함.\n           - 관련 보안인증의 도입을 고려할 수 있으며, ISMS-P (정보보호 및 개인정보보호 관리체계 인증), CSAP\n\
    \            (클라우드 서비스 보안인증) 등이 있음.\n\n     참고     美 NIST AI RMF\n          \
    \ - GOVERN 6.2: 제3자로부터 얻은 데이터에 대한 위험 평가 및 관리 프로세스 수립\n           - MEASURE 2.10:\
    \ 개인의 권리 보호를 위해 프라이버시 관련 위험을 식별하고 문서화 수행\n            EU AI ACT\n           -\
    \ 제10조: 학습데이터의 품질 확보를 위한 적정성, 공정성, 대표성 기반의 데이터셋 구축\n           - 제26조제6항: 고위험\
    \ 인공지능의 추적성 및 책임성 확보를 위해 목적에 맞는 시스템 로그를 최소\n            6개월간 보관\n           -\
    \ 전문(recital) 10: 데이터 수집처리 시 개인정보보호를 위해 관련 법규 준수 및 데이터 주체의 권리 보장 정의\n       \
    \                                                                사업자 구분\n 자가점검\
    \       데이터의 보유 기간 설정, 파기 절차 및 방법 등 데이터 관리 계획을 수립하고 준수하고          개발 이용\n   \
    \         있는가?\n            개인정보 데이터 수집 시, 정보 주체에게 명확히 고지하고 적법한 동의 절차를 거쳤는가?\
    \          개발 이용\n            데이터 유출, 오용, 손실 방지를 위해 암호화,         접근   권한   관리\
    \   등 적절한     이용\n            기술적·관리적·물리적 보안 방안을 적용하고 있는가?\n\n      사례       NAVER\
    \ AI 스피커 프라이버시 정책\n\n\n\n\n42"
