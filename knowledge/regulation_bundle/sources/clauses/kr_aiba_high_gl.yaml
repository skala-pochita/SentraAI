- id: KR-AIBA-HIGH-GL:PAGE-033-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.33 · 2-2   학습용데이터 정보의 관리
  text: "2-2   학습용데이터 정보의 관리\n\n2-2-1. 학습용데이터 개요                                 \
    \                개발사업자\n\n     목표     인공지능에 사용되는 학습용데이터의 일반적 내용과 함께 형식, 수량, 크기,\
    \ 수집 및 전처리 방식 등의\n            정보를 정의하여 관리해야 함.\n           - 학습용데이터 개요는 개발사업자가\
    \ 내부적으로 관리하기 위한 정보이며, 이용사업자 및 이용자에게\n             제공할 내용은 개발사업자가 결정할 수 있음.\n \
    \    설명     개발사업자는 인공지능 모델의 학습 및 운영 과정에서 학습용데이터로 사용되는 자료의 형식, 크기, 수량\n      \
    \      등 기술적 사양의 내용을 정의해야 함.\n           - 운영 중 이용사업자의 요구사항에 따라 학습용데이터 사양 변경이\
    \ 필요할 경우, 시스템 성능 및 오작동\n             가능성 등에 미치는 영향을 평가해야 함.\n            개발사업자는\
    \ 인공지능 학습 목적에 적합한 수집 범위와 기준을 정의해야 함,\n           - 기술적으로 가능한 범위에서 수집 목적, 데이터 수집\
    \ 방법, 구축 시점 등을 포함한 데이터 수집 프로세스를\n            마련하여 개요에 포함.\n            개발사업자는\
    \ 학습용데이터 전처리 작업의 기준, 절차 및 품질 점검 결과를 문서화하기 위해 노력해야 함.\n           - 데이터 라벨링, 증강,\
    \ 정제 등 전처리 작업을 이해할 수 있도록 전처리 전과 후의 주요 특성과 전처리 목적\n            등을 문서화할 수 있음.\n\
    \     참고     韓 신뢰할 수 있는 인공지능 개발안내서\n           - 요구사항 05. 데이터의 활용을 위한 상세 정보 제공\n\
    \           - 세부요구사항 05-1. 데이터의 명확한 이해와 활용을 지원하는 상세한 정보를 제공하는가?\n           -\
    \ 세부요구사항 05-2. 데이터의 출처는 기록 및 관리되고 있는가?\n            美 NIST AI RMF\n         \
    \  - GOVERN 6.1: 지적재산권 및 기타 권리 침해 위험 관련 정책·절차 정의 및 모니터링 수행\n           - MAP 2.3:\
    \ 인공지능 시스템의 실험 설계, 데이터 수집 및 선택, 개념 타당성 관련 요소 식별 및 문서화\n            EU AI ACT\n\
    \           - 제10조제1항: 인공지능 학습의 신뢰성 확보를 위해 품질 기준을 충족하는 학습데이터 활용\n           -\
    \ 제10조제2항제a호: 시스템 목적에 부합하는 학습데이터 선택\n           - 제10조제2항제b호: 데이터 수집 목적절차출처를\
    \ 포함해 학습데이터를 체계적으로 관리\n           - 제10조제2항제c호: 데이터 품질 및 목적 적합성 확보를 위해 전처리 작업을\
    \ 포함한 데이터 관리 수행\n           - 제13조제3항제b호의6: 인공지능 시스템의 적절한 활용을 위해 입력 및 학습용데이터 사양\
    \ 제공\n                                                                     사업자\
    \ 구분\n 자가점검       학습용데이터의 형식, 크기, 차원, 수량 등 기술적인 사양이 정의되어 있는가?              개발\n\
    \            학습용데이터 형식 또는 구조 변경 시, 해당 변경이 시스템에 미치는 영향을 평가하고           개발\n  \
    \          있는가?\n            인공지능 학습 목적에 적합한 수집 범위와 기준을 정의하였는가?             \
    \          개발\n            데이터 수집 프로세스를 마련하였는가?                             \
    \        개발\n            전처리 기준, 절차, 도구 및 품질 점검 결과를 문서화 하였는가?               \
    \      개발\n            전처리 전과 후의 주요 특성을 명확히 기술하고 있는가?                       \
    \    개발\n\n\n\n\n32"
