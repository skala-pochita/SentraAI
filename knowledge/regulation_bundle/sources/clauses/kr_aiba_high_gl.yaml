- id: KR-AIBA-HIGH-GL:PAGE-041-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.41 · 3.3 이용자 보호방안의 수립·운영
  text: "3.3 이용자 보호방안의 수립·운영\n\n관련 기술고시 조문\n제6조(이용자 보호방안의 수립ㆍ운영) ① 사업자는 고영향 인공지능 개발\
    \ 과정에서 이용자 보호 방안을 수립하는 경\n우 다음 각 호의 사항을 포함하여야 한다.\n 1. 안전하고 적법한 데이터 수집 및 관리\n\
    \ 2. 적대적 공격 등에 대응하기 위한 안전한 설계 및 개발\n 3. 위험에 대한 지속적인 시험 및 평가 수행\n② 사업자는 고영향 인공지능\
    \ 운영 과정에서 이용자 보호 방안을 수립하는 경우 다음 각 호의 사항을 포함하여야 한다.\n 1. 위험을 지속적으로 탐지하기 위한 모니터링\
    \ 및 대응방안 수립\n 2. 이용자 의견 수렴 및 지속적인 개선 체계의 마련\n 3. 이용자의 권리를 보장하고 피해 발생 시 이를 보상할\
    \ 수 있는 방안 수립\n\n\n\n타 법령의 유사 조치사항\n        법령               조항               \
    \               내용\n 클라우드컴퓨팅 발전\n                   제26조(이용자 보호 등을 위   클라우드컴퓨팅법은\
    \ 이용자 보호의 범위를 이용자의 정보\n  및 이용자 보호에\n                   한 정보 공개)           에 중점을\
    \ 두는 반면, 인공지능 기본법은 이용자의 생명·\n    관한 법률\n                   제27조(이용자 정보의 보호)  \
    \ 신체·재산 등 더 넓은 범위에 중점을 둔다.\n (클라우드컴퓨팅법)\n\n\n주요 내용\n본 절의 사업자 책무사항 주요 내용을 주제별로\
    \ 분류하면 아래와 같다.\n\n      책무사항             주제                                소주제\n\
    \                                      3-1-1. 데이터 수집 및 관리\n              3-1.\
    \ 인공지능 개발 단계         3-1-2. 안전한 설계 및 개발\n     3. 이용자\n                       \
    \               3-1-3. 시험 및 평가\n     보호방안의\n                                 \
    \     3-2-1. 모니터링 및 대응\n     수립·운영    3-2. 인공지능 운영 (제품·서비스\n                 \
    \                     3-2-2. 피드백 수렴 및 적용\n              제공) 단계\n             \
    \                         3-2-3. 이용자 권리 보호\n\n\n그리고 인공지능 이용자를 영향을 직접 받는 지위에 있는\
    \ 이용자(이하 ‘A영역’)와, 직접 영향을 받지 않는 이용자(이\n하 ‘B영역’)로 구분하여 아래와 같이 접근한다.\n\n       이용자\
    \ 구분                                 설명\n     인공지능 이용에 따라\n                  \
    \  법상 실제 의미에 해당하는 영역. 이용사업자가 제공하는 인공지능이 이용자에게 직접\n      직접 영향을 받는\n          \
    \          영향을 끼치는 대부분의 경우에 해당함.\n      이용자(A영역)\n\n\n\n\n40"
