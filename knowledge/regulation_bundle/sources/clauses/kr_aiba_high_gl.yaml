- id: KR-AIBA-HIGH-GL:PAGE-034-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.34 · 양식       학습용데이터 개요 내용(예시)
  text: "양식       학습용데이터 개요 내용(예시)\n부록1 안전신뢰문서 양식에 제공된 학습용데이터 관련 내용은 학습용데이터 정보를 사업자가\
    \ 관리하기 위해서 고\n려할 수 있는 사항들을 나열하였으며, 각 항목의 의미는 다음과 같다.\n\n\n[ 일반 내용 ]\n 학습데이터 사용\
    \ 제품·서비스: 학습데이터가 활용될 제품·서비스의 명칭을 기재.\n 제품·서비스 제공사: 학습데이터를 활용하는 제품·서비스의 주체인 회사\
    \ 또는 기관의 공식 명칭을 기재.\n 연락처: 제품·서비스와 관련하여 문의할 수 있는 담당 부서 또는 인력의 연락처(전화번호, 이메일 주소\
    \ 등)를 기재.\n 제품·서비스 요약: 학습데이터를 활용하는 제품·서비스가 어떤 목적으로 제공되는지 간락히 기재.\n\n\n[ 학습 데이터\
    \ 공통 내용 ]\n 데이터 이름: 학습데이터의 이름을 기재하며, 내부 관리 및 제3자 라이선스를 고려하여 자유롭게 작성 가능. (예:\n\
    \ 스마트 물류창고 이미지 데이터셋)\n 데이터 형식: 데이터 파일의 확장자를 기재. (예: jpg, png, json, csv 등)\n\
     가장 최근의 업데이트 시기: 학습데이터셋의 가장 최근 업데이트 날짜를 기재.\n 데이터 수량: 학습데이터의 총 수량(개수)을 기재. (예:\
    \ png파일 150,000장)\n 데이터 크기: 학습데이터의 전체 용량을 기재.\n 수집 목적: 학습데이터를 수집한 목적을 기재. (예:\
    \ 물류창고 재고 관리 AI를 위한 상품 이미지 및 메타데이터 확보)\n 수집 방법: 데이터를 수집한 방법에 따라 해당하는 항목에 선택하며,\
    \ 여러 유형을 포함하는 경우 복수 선택이 가능.\n 데이터 전처리 방법: 수집된 원본 데이터를 모델 학습에 활용할 수 있도록 가공한 전처리\
    \ 과정을 간략히 기재. (예:\n 이미지 크기 정규화, 데이터 증강 등)\n 데이터 요약: 데이터셋이 어떤 종류의 정보로 구성되어 있는지\
    \ 요약하여 기재. (예: 물류창고 상품의 종류, 수량, 위치\n 등에 대한 이미지-메타데이터 쌍)\n 데이터 유형 (모달리티): 데이터의\
    \ 유형(텍스트, 이미지, 오디오, 비디오, 기타 등)을 선택하며, 여러 유형을 포함하는\n 경우 복수 선택이 가능.\n 데이터 분포: 데이터\
    \ 내 클래스(분류 항목)별 분포를 백분율이나 수량으로 기재. (예: 양품 70%, 불량 30%(표면 흠집\n 15%, 이물질 10%, 파손\
    \ 5%, 변형 5%) 등)\n\n\n[ 학습 합성 데이터 ]\n 합성데이터 요약: 학습데이터에 인공지능 등이 합성한 데이터가 포함된 경우에만\
    \ 작성하며, 합성 데이터를 생성한\n 이유, 어떤 모델이나 상용 제품·서비스를 이용하였는지 간략히 기재. (예: 실제 불량 데이터 부족 문제를\
    \ 해결하기 위해\n AI 모델을 활용해 불량 이미지를 추가 생성함.)\n\n\n\n\n                            \
    \                                           33"
