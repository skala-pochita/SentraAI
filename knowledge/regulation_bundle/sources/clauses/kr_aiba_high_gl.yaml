- id: KR-AIBA-HIGH-GL:PAGE-038-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: 'PDF p.38 · 답변예시: <Med-AI 학습용데이터 개요 보고서>'
  text: "답변예시: <Med-AI 학습용데이터 개요 보고서>\n 접수번호: EX-2025-MM-DD-002\n 안녕하세요, □□□님. Med-AI의\
    \ 학습 데이터 구성에 대해 문의해 주셔서 감사합니다.\n 학습용데이터 구성: Med-AI는 익명화된 국내외 흉부 X-ray 이미지 및 환자\
    \ 진료 기록 수십만건을 기반으로\n 학습되었습니다. 저희는 데이터의 다양성 확보를 위해 국내 여러 의료기관 및 연구소와의 협업을 통해 데이터를\n\
    \ 수집하고 있습니다.\n 잠재적 편향성: 저희는 데이터 편향성을 최소화하기 위해 노력하고 있으나, 특정 인구 집단 또는 특정 질병에 대한\n\
    \ 데이터가 상대적으로 다양하지 않을 수 있습니다. 이에 따라 AI 진단 결과는 이러한 점을 참고하여 해석될 수 있도록\n 조언합니다. 저희는\
    \ 이러한 편향성을 지속적으로 모니터링하고 있으며, 주기적인 모델 업데이트 및 학습용데이터\n 수집을 통해 개선하고 있습니다.\n\n\n\n\
    \n                                                                37"
