- id: KR-AIBA-HIGH-GL:PAGE-052-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.52 · 사례       이용자 보호를 위한 이용 정책 마련
  text: "사례       이용자 보호를 위한 이용 정책 마련\n엔트로픽(Anthropic)의 이용 정책은 '사용 정책(Usage Policy)',\
    \ '소비자 서비스 약관(Consumer Terms of\nService)', 그리고 '개인정보 보호정책(Privacy Policy)'으로\
    \ 구성되어 있으며, AI 모델의 안전하고 책임감 있는 사용을\n보장하는 데 중점을 두고 있음\n 사용 정책(Usage Policy): AI\
    \ 사용자가 금지된 활동에 Claude를 사용하지 않도록 규정\n- 불법 및 유해 활동: 불법 행위, 사기, 악성코드 생성, 해킹, 스팸,\
    \ 테러리즘 등\n- 아동 착취: 아동 성적 착취물을 생성하거나 유포하는 행위\n- 혐오 표현: 인종, 민족, 종교, 성별, 성적 지향 등에\
    \ 대한 혐오를 조장하는 콘텐츠\n- 폭력 조장: 폭력적 행위, 자해, 고문 등을 묘사하거나 조장하는 콘텐츠\n- 기만적인 사용: 딥페이크,\
    \ 허위 정보, 선거 조작 등 사람을 속이거나 혼란을 주는 행위\n- 개인정보 침해: 민감한 개인정보를 무단으로 수집하거나 유출하는 행위\n\
     소비자 서비스 약관(Consumer Terms of Service): 클로드(Claude) 개인 사용자(Free, Pro, Max)와 엔트로픽\n\
    \ 간의 계약 관계 명시\n- 서비스 제공 및 구독: 무료 플랜부터 유료 구독 서비스까지 각 서비스에 대한 제공 조건과 결제 방식을 규정\n\
    - 지적 재산권: 사용자가 생성한 콘텐츠에 대한 소유권을 인정하지만, 엔트로픽이 서비스를 개선하기 위해 해당\n 콘텐츠를 사용할 수 있음을\
    \ 명시\n- 책임 제한: 서비스가 '있는 그대로' 제공되며, 특정 목적에 대한 보증이나 책임은 제한된다고 명시\n- 모델 학습 데이터 선택권:\
    \ 사용자가 자신의 대화 데이터가 AI 모델 학습에 사용되는 것에 대해 동의하거나\n  거부할 수 있는 선택권을 부여\n 개인정보 보호정책(Privacy\
    \ Policy): 엔트로픽이 이용자의 개인정보를 어떻게 수집, 사용, 보호하는지에 대해 설명\n- 수집하는 정보: 클로드 사용 시 입력하는\
    \ 콘텐츠, 사용자 계정 정보, 이용 기록 등의 데이터를 수집\n- 정보 사용 목적: 수집된 데이터는 클로드의 기능을 제공하고, 서비스를 개선하며,\
    \ 안전성 문제를 해결하고,\n  정책 위반을 방지하는 데 사용\n- 데이터 보관 및 권리: 모델 학습에 사용되기로 동의한 데이터는 최대 5년간\
    \ 보관될 수 있으나, 이용자는\n  언제든지 자신의 데이터를 삭제하거나 설정을 변경할 수 있음\n- 개인정보 공유: 법적 의무가 있거나,\
    \ 서비스 제공을 위해 신뢰할 수 있는 제3자에게 최소한의 정보를 공유할 수\n 있음을 명시\n\n\n\n\n                \
    \                                                                51"
