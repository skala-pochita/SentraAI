- id: KR-AIBA-HIGH-GL:PAGE-005-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.5 · 1.2 가이드라인 적용 방법
  text: "1.2 가이드라인 적용 방법\n\n본 절에서는 국내외 주요 기준과의 연계성을 토대로 이해관계자별 적용 방식과 활용 방안을 제시한다.\
    \ 고영향 인공\n지능의 사회적 파급력을 고려하여, 다양한 이해관계자가 각자의 역할에 따라 이를 효과적으로 적용할 수 있도록 구\n성하였으며,\
    \ 기술적·정책적 지원 체계를 포함하여 실질적인 이행 가능성을 제고하고자 한다.\n\n\n이를 위해 우선 본 가이드라인의 제정 과정에서 국내외\
    \ 주요 인공지능 관련 정책 및 표준 문서를 심층적으로 분석하\n고, 그 핵심 원칙과 내용을 본 가이드라인에 반영하였다. 특히, 한국정보통신기술협회(TTA)의\
    \ 신뢰할 수 있는 인공지능\n개발 안내서, 미국 국립표준기술연구소(NIST)의 인공지능 위험 관리 프레임워크(AI Risk Management\
    \ Framework,\nAI RMF), 유럽연합(EU)의 인공지능 법(AI Act)은 아래와 같은 이유로 주요 참조 문서로써 활용하였다.\n\
    \n\n1. 국내 환경 및 기술적 특성 고려: TTA 신뢰할 수 있는 인공지능 개발 안내서\nTTA 신뢰할 수 있는 인공지능 개발 안내서는\
    \ 국내 환경과 기술적 특성을 고려하여 신뢰할 수 있는 인공지능 개발\n및 활용을 위한 실무적인 지침을 제공한다. 이는 국내 사업자들이 인공지능을\
    \ 개발하고 운영하는 과정에서 직면하는\n특수한 상황과 요구사항을 반영하는 데 매우 중요하다.\n\n\n 실무적이고 구체적인 지침: TTA\
    \ 안내서는 인공지능 개발의 전 단계에 걸쳐 고려해야 할 기술적 요구사항을 구체적으로\n    제시한다. 예를 들어, 데이터 수집 및 처리,\
    \ 인공지능 모델 개발, 시스템 구현, 운영 및 모니터링 단계별로 신뢰성 확보를\n    위한 체크리스트나 권장 사항을 포함하고 있다. 이러한\
    \ 실무적인 내용은 본 가이드라인이 추상적인 원칙 나열에 그치지\n    않고, 사업자들이 실제 업무에 적용할 수 있는 실질적인 방안을 제시하는\
    \ 데 크게 기여한다.\n 국내 기술 및 산업 환경 반영: TTA는 국내 ICT 표준화를 선도하는 기관으로서, 국내 인공지능 기술 수준,\
    \ 산업 구조,\n    그리고 규제 환경을 가장 잘 이해하고 있다. TTA 안내서를 참조함으로써 본 가이드라인은 국내 사업자들의 현실적인\n\
    \    역량과 상황을 고려한 책임 기준을 제시할 수 있다. 이는 사업자들의 수용성을 높이고, 가이드라인의 실효성을 확보하는\n    데 필수적이다.\n\
     국내 인공지능 윤리 원칙과의 연계: TTA 안내서는 대한민국 정부가 제시한 '인공지능 윤리 기준'을 기반으로 하고 있으며,\n    이를\
    \ 기술 개발 및 적용의 관점에서 구체화한 문서이다. 본 가이드라인이 TTA 안내서를 참조함으로써, 정부의 인공지능\n    정책 방향과 일관성을\
    \ 유지하고, 국내 사회가 지향하는 인공지능 윤리 가치를 사업자책무에 효과적으로 반영할 수\n    있습다. 이는 인공지능이 사회적 신뢰를\
    \ 얻고 지속적으로 발전하는 데 필요한 국내적 합의를 형성하는 데 기여할 것이다.\n\n\n2. 포괄성과 범용성: NIST AI RMF의 위험\
    \ 관리 접근 방식\nNIST AI RMF는 인공지능 시스템의 전 수명주기에 걸쳐 발생하는 잠재적 위험을 식별, 평가, 완화 및 관리하기 위\n\
    한 포괄적인 프레임워크를 제공한다. 이 프레임워크는 특정 기술이나 산업에 국한되지 않고, 모든 유형의 인공지능\n시스템에 적용될 수 있는 범용성을\
    \ 지니고 있다.\n\n\n 위험 기반 접근의 체계화: NIST AI RMF는 인공지능의 위험을 분류하고, 위험 수준에 따른 차등적인 관리\
    \ 방안을\n    제시함으로써, 사업자들이 인공지능 시스템의 특성과 잠재적 영향에 따라 합리적이고 효율적인 위험 관리를 수행할 수\n  \
    \  있도록 돕는다. 이는 본 가이드라인이 사업자들에게 실질적인 지침을 제공하고, 불필요한 규제 부담을 최소화하면서도\n    책임 있는 인공지능\
    \ 개발 및 활용을 유도하는 데 필수적인 요소이다.\n 다양한 이해관계자의 참여 유도: NIST AI RMF는 인공지능 위험 관리가 기술\
    \ 개발자, 사용자, 규제 기관 등 다양한\n    이해관계자의 협력을 통해 이루어져야 함을 강조한다. 이는 본 가이드라인이 제시하는 사업자책무가\
    \ 단순히 기술적\n    측면에 머무르지 않고, 사회적 맥락에서의 인공지능 윤리와 신뢰성을 확보하는 데 기여할 수 있도록 한다. 투명성,\
    \ 설명\n    가능성, 공정성 등 핵심적인 인공지능 윤리 원칙들이 위험 관리의 관점에서 구체적으로 적용될 수 있는 토대를 제공한다."
