  text: "인공지능 시스템이 의사결정을 수행하며 사람이 개입하지 않음.\n      Human-out-of-the-loop\n        \
    \                       예) 항공사 예비 부품 예측, 구매 상품 추천\n                          \
    \     인공지능 시스템이 의사결정을 수행하나 사람이 해당 결과를 모니터링하고\n      Human-over-the-loop\n    \
    \                           최종 결정에 개입. 예) 내비게이션\n\n\n54"
