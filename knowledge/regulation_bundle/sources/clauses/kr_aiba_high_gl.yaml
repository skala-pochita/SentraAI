  heading: PDF p.61 · 사례   ‘영업비밀’ 관련 판례 (대법원 2009. 7. 9. 선고 2006도7916 판결)
  text: '사례   ‘영업비밀’ 관련 판례 (대법원 2009. 7. 9. 선고 2006도7916 판결)

    ‘영업비밀’이란 공연히 알려져 있지 아니하고 독립된 경제적 가치를 가지는 것으로서 상당한 노력에 의하여 비밀로

    유지된 생산방법, 판매방법 그 밖에 영업활동에 유용한 기술상 또는 경영상의 정보를 말하는 것인바, 여기서 ‘공연히

    알려져 있지 아니하다’는 것은 그 정보가 간행물 등의 매체에 실리는 등 불특정 다수인에게 알려져 있지 않기 때문에

    보유자를 통하지 아니하고는 그 정보를 통상 입수할 수 없는 것을 말하고, ‘독립된 경제적 가치를 가진다’는 것은 그

    정보의 보유자가 그 정보의 사용을 통해 경쟁자에 대하여 경쟁상의 이익을 얻을 수 있거나 또는 그 정보의 취득이나

    개발을 위해 상당한 비용이나 노력이 필요하다는 것을 말하며, ‘상당한 노력에 의하여 비밀로 유지된다’는 것은 그

    정보가 비밀이라고 인식될 수 있는 표시를 하거나 고지를 하고, 그 정보에 접근할 수 있는 대상자나 접근 방법을

    제한하거나 그 정보에 접근한 자에게 비밀준수의무를 부과하는 등 객관적으로 그 정보가 비밀로 유지·관리되고 있다는

    사실이 인식 가능한 상태인 것을 말한다.





    60'
