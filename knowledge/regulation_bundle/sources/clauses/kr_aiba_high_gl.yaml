- id: KR-AIBA-HIGH-GL:PAGE-016-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.16 · 2.2 관련 시행령
  text: "2.2 관련 시행령\n\n인공지능 기본법 시행령은 인공지능사업자가 인공지능 기본법상 고영향 인공지능사업자의 책무를 이행하여 인공지능\n\
    이용사업자에게 인공지능시스템을 제공하는 경우 중복규제를 피하기 위하여 인공지능이용사업자에게 일부 책무를 면\n제하고 있다.\n\n\n다만,\
    \ 책무의 면제는 인공지능이용사업자가 ‘인공지능시스템의 중대한 기능 변경을 초래하지 않은 경우’에만 적용되\n도록 규정한다. 여기서 ‘중대한\
    \ 기능 변경’이란 인공지능개발사업자가 제공한 인공지능과 동일성이 인정되지 않을 수\n준으로 성능, 안전성(위험성), 용도(목적), 이용 분야와\
    \ 맥락, 신뢰성의 변화 등을 종합적으로 고려하여 이루어진다.\n\n\n범용 인공지능모델을 자신의 시스템에 통합하는 등 고영향 인공지능시스템을\
    \ 만들어 제공하는 인공지능사업자는 기\n존 인공지능의 이용 목적·용도·기능 등을 중대하게 변경한 경우에 해당하므로 고영향 인공지능개발사업자의\
    \ 지위를\n갖게 된다.\n\n\n\n개발사업자와 이용사업자의 책무\n제27조(고영향 인공지능과 관련한 사업자의 책무) ① 인공지능사업자는\
    \ 법 제34조제1항 각 호의 조치 중에서 다음\n각 호에 해당하는 내용을 인공지능사업자의 사무소ㆍ사업장 또는 인터넷 홈페이지 등에 게시해야\
    \ 한다. 다만, 「부정\n경쟁방지 및 영업비밀보호에 관한 법률」 제2조제2호에 따른 영업비밀에 해당하는 사항은 제외할 수 있다.\n 1.\
    \ 위험관리정책 및 조직체계 등 법 제34조제1항제1호에 따른 위험관리방안의 주요 내용\n 2. 법 제34조제1항제2호에 따른 설명 방안의\
    \ 주요 내용\n 3. 법 제34조제1항제3호에 따른 이용자 보호 방안\n 4. 법 제34조제1항제4호에 따른 해당 고영향 인공지능을 관리ㆍ감독하는\
    \ 사람의 성명 및 연락처\n② 인공지능사업자는 법 제34조제1항 각 호의 조치를 이행하고 그 근거를 문서로 5년간 보관(전자적 방법을 통한\n\
    보관을 포함한다)해야 한다.\n③ 법 제34조제1항제1호부터 제3호까지의 조치를 모두 또는 일부 이행한 인공지능사업자로부터 인공지능시스템을\n\
    제공받은 인공지능이용사업자가 해당 인공지능시스템의 본래 목적이나 용도를 현저하게 변경하는 등 중대한 기능 변\n경을 하지 않은 경우에는 법\
    \ 제34조제1항제1호부터 제3호까지의 조치를 모두 또는 일부 이행한 것으로 본다.\n④ 인공지능이용사업자는 인공지능개발사업자에게 법 제34조제1항에\
    \ 따른 책무를 이행하기 위하여 필요한 자료의\n제공을 요청할 수 있고, 인공지능개발사업자는 이에 협력하도록 노력해야 한다.\n⑤ 법 제34조제3항에\
    \ 따라 인공지능사업자가 같은 조 제1항에 따른 조치를 이행한 것으로 보는 경우는 별표 1과\n같다.\n\n\n\n\n           \
    \                                                     15"
