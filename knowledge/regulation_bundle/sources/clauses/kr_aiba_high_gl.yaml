- id: KR-AIBA-HIGH-GL:PAGE-051-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.51 · 3-2-3. 이용자 권리 보호                                                     이용사업자
  text: "3-2-3. 이용자 권리 보호                                                     이용사업자\n\
    \n     목표     이용자 권리 보호를 위한 체계 및 보호 정책을 수립하고 이를 이용자에게 안내해야 함.\n     설명     이용사업자는\
    \ 이용자에게 개인정보 활용 내역 등을 사전에 명확히 고지하고, 필요한 경우 이용 중단, 이의\n            제기, 설명 요구 권리를\
    \ 부여해야 함.\n            이용사업자는 안전한 사용을 위한 정책을 마련하여 이용자가 오남용하지 않도록 안내하고, 계약 조건을\n\
    \            명확히 규정하여 이용자의 권리 관계나 책임 소지에 대해 인지할 수 있도록 노력해야 함.\n            이용사업자는\
    \ 운영 지침에 피해 발생 시의 보상 체계 등을 포함하여 이용자의 권리 보장이 이루어질 수\n            있는 체계를 도입하기 위해\
    \ 노력해야 함.\n     참고     美 NIST AI RMF\n           - MEASURE 3.3: 이해관계자의 의견 반영을\
    \ 위해 피드백 프로세스 구축 및 인공지능 시스템 평가 지표에 통합\n           - MANAGE 4.1: 이용자 입력 및 피드백과\
    \ 사고 대응폐기복구까지 포함한 시스템 모니터링 계획 구현\n           - MANAGE 4.3: 사고 대응 및 복구를 위해 이해관계자에\
    \ 사고 정보 공유 및 대응 절차 이행\n            EU AI ACT\n           - 제86조: 영향받는 자에게 인공지능\
    \ 결정에 대한 이해를 위한 설명 제공\n           - 전문(recital) 171: 영향받는 자의 권리 보장을 위해 인공지능의 결정에\
    \ 대한 설명 제공\n                                                                 \
    \     사업자 구분\n 자가점검       이용자의 권리 보호를 위한 정보를 충분히 고지했는가?                     \
    \         이용\n            이용자가 안전한 사용을 할 수 있도록 정책을 마련하고 안내하였는가?             \
    \         이용\n            이용자가 권리를 행사할 수 있는 절차를 마련하고 안내하였는가?                \
    \         이용\n\n      사례       이용자 보호를 위한 이용자 안내 및 장애 대응 체계 마련\n네이버 대화형 인공지능 서비스\
    \ CLOVA X는 이용 시 발생할 수 있는 부적절한 응답 가능성을 사전에 고지하고, 오류\n발생 시 신고 및 문의 가능한 채널을 안내하였다.\n\
    \n\n\n\n50"
