- id: KR-AIBA-HIGH-GL:PAGE-012-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.12 · 용어                                 설명
  text: "용어                                 설명\n                    국내에 주소 또는 영업소가\
    \ 없는 인공지능사업자로서 이용자 수, 매출액 등이 대\n                    통령령으로 정하는 기준에 해당하는 자로 안전관리의무\
    \ 이행 결과의 제출(인공지\n    국내대리인\n                    능 기본법 제32조제2항), 고영향 인공지능 해당 확인\
    \ 요청(인공지능 기본법 제33\n (domestic agent)\n                    조제1항), 고영향 인공지능 사업자\
    \ 책무 이행(인공지능 기본법 제34조제1항) 지원\n                    등을 수행하는 자.\n      이용자      \
    \     인공지능 제품 또는 인공지능 서비스를 제공받는 자 (인공지능 기본법 제2조제8\n      (user)        호).\n \
    \  영향받는 자           인공지능제품 또는 인공지능서비스에 의하여 자신의 생명, 신체의 안전 및 기본권\n(impacted person)\
    \   에 중대한 영향을 받는 자 (인공지능 기본법 제2조제9호).\n                    인공지능시스템 또는 이를 요소로 포함하는\
    \ 제품으로서, 인공지능시스템에 접속하\n                    여 필요로 하는 기능을 수행하는 것을 포함.\n        \
    \             인공지능 또는 인공지능 기술을 물리적·논리적·기능적으로 운용가능한 제품으로,\n   인공지능제품\n       \
    \              하드웨어 및 소프트웨어를 포함.\n   (AI product)\n                     인공지능\
    \ 또는 인공지능기술을 활용한 제품(네트워크를 통해 인공지능에 직접\n                     연결하여 인공지능을 사용활 수 있도록\
    \ 하거나, 인공지능기술을 활용할 수 있는 전용\n                     단말기, 자율주행자동차 등)\n           \
    \         인공지능, 인공지능시스템 또는 인공지능제품을 활용할 수 있도록 제공하는 서비\n  인공지능서비스           스로 정보\
    \ 분석, 예측, 추천, 창작 등의 기능을 제공하는 것.\n   (AI service)      인공지능제품을 활용한 서비스 또는 PC,\
    \ 스마트폰 등 정보통신기기를 통해\n                     인공지능기술을 이용할 수 있도록 제공되는 서비스.\n 인공지능 수명주기\n\
    \                    인공지능의 개발, 배포, 운영 및 폐기에 이르기까지의 전 과정.\n  (AI lifecycle)\n \
    \      위험           인공지능 수명주기 전반에 걸쳐 사람의 생명ㆍ신체의 안전 또는 기본권이 침해될\n      (risk) \
    \       가능성과 그 잠재적 피해의 심각성.\n     위험관리           위험을 식별, 분석, 평가하고 이를 허용 가능한 수준으로\
    \ 처리하기 위한 체계적이\n(risk management)   고 지속적인 관리 활동.\n\n\n\n\n                  \
    \                                               11"
