- id: KR-AIBA-HIGH-GL:PAGE-008-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: 'PDF p.8 ·  제10조: (제1항) 인공지능 학습의 신뢰성 확보를 위해 품질 기준을 충족하는 학습데이터 활용'
  text: " 제10조: (제1항) 인공지능 학습의 신뢰성 확보를 위해 품질 기준을 충족하는 학습데이터 활용\n             (제2항제a호)\
    \ 시스템 목적에 부합하는 학습데이터 선택\n             (제2항제b호) 데이터 수집·목적·출처를 포함해 학습데이터를 체계적으로\
    \ 관리\n             (제2항제c호) 데이터 품질 및 목적 적합성 확보를 위해 전처리 작업을 포함한 데이터 관리 수행\n  EU\
    \    제13조: (제1항) 고위험 인공지능 시스템 배포자는 이용자가 시스템 출력을 해석하고 활용할 수 있도록\n            \
    \ 설계 및 개발\n             (제3항제b호의6) 인공지능 시스템의 적절한 활용을 위해 입력 및 학습용데이터 사양 제공\n  \
    \           (제3항제b호의7) 인공지능 출력 결과의 올바른 해석과 활용을 위해 이용자에게 필요한 정보 제공\n        제50조:\
    \ 인공지능에 의해 생성된 콘텐츠 및 상호작용 대상을 명확히 고지\n\n\n제3호. 이용자 보호 방안의 수립·운영\n\n참조문서      \
    \                             설명\n        03: 인공지능 시스템의 신뢰성 테스트 계획 수립\n     \
    \   03-1: 인공지능 시스템의 특성을 고려한 테스트 환경을 설계하였는가?\n        06-2: 데이터 공격에 대한 방어 수단을\
    \ 강구하였는가?\n        10: 인공지능 모델 공격에 대한 방어 대책 수립\n  韓     10-1: 모델 공격이 가능한 상황을\
    \ 파악하였는가?\n        10-2: 모델 공격에 대한 방어 수단을 강구하였는가?\n        13: 인공지능 시스템의 안전\
    \ 모드 구현 및 문제발생 알림 절차 수립\n        13-1: 인공지능 시스템의 안전 모드 구현 및 문제발생 알림 절차 수립\n \
    \       13-2: 인공지능 시스템에서 문제가 발생할 경우, 시스템은 이를 운영자에게 전달하는 기능을 수행하는가?\n       \
    \ GOVERN 1.5: 위험관리 프로세스가 효과적으로 작동하도록 모니터링 주기 및 조직의 역할 정의\n        GOVERN 4.3:\
    \ 인공지능 테스트 및 사고 대응 강화를 위해 정보 공유를 포함한 조직적 수행 기준 정의\n        GOVERN 5: 인공지능 시스템의\
    \ 사회적 책임을 위해 외부 피드백 수집·검토·반영하는 절차 마련\n        GOVERN 6.2: 제3자로부터 얻은 데이터에 대한 위험\
    \ 평가 및 관리 프로세스 수립\n        MAP 5.2: 이용자 피드백 반영을 위해 정기적 참여 체계 및 절차와 인력 마련\n  \
    \      MEASURE 1.2: 이용자 의견을 반영한 인공지능 측정 지표의 적정성 및 통제 수단 효과성을 정기적\n        평가갱신\n\
    \        MEASURE 2.10: 개인의 권리 보호를 위해 프라이버시 관련 위험을 식별하고 문서화 수행\n  美\n       \
    \ MEASURE 3.3: 이해관계자의 의견 반영을 위해 피드백 프로세스 구축 및 인공지능 시스템 평가 지표에 통합\n        MANAGE\
    \ 2.3: 인공지능 시스템의 오작동 위험에 대응하기 위한 위험 식별 및 문서화 수행\n        MANAGE 2.4: 목적 외 결과에\
    \ 대한 대응을 위해 인공지능 시스템 대체, 해제 또는 비활성화 메커니즘 마련\n        MANAGE 4: 인공지능 위험 대응 및 개선을\
    \ 위해 모니터링, 사고 대응 등 지속적 개선 활동\n        수립·이행·문서화\n        MANAGE 4.1: 이용자 입력 및\
    \ 피드백과 사고 대응폐기복구까지 포함한 시스템 모니터링 계획 구현\n        MANAGE 4.2: 지속적 성능 개선을 위해 이해관계자와의\
    \ 협의를 포함한 개선 활동을 업데이트에 통합\n        MANAGE 4.3: 사고 대응 및 복구를 위해 이해관계자에 사고 정보 공유\
    \ 및 대응 절차 이행\n\n\n\n\n                                                       \
    \                   7"
