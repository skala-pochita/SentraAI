  heading: PDF p.70 · 3      인공지능 설명방안
  text: "3      인공지능 설명방안\n\n\n투명성 및 설명가능성 확보 노력\n투명성 및 설명가능성 확보를 위한 인공지능 시스템 정보는\
    \ 아래와 같다.\n\n               1) 모든 추론 단계는 감사 추적(Audit Trail) 시스템에 기록\n        \
    \       2) Edge 장치에서 추론을 수행하고, 중앙 시스템에는 요약된 결과만 전송하는 분산형\n   시스템 구조\n        \
    \       아키텍처\n               ※ 시스템 구조도 등 첨부 가능\n\n               1) 예측 결과와 함께\
    \ 예측의 불확실성(Uncertainty) 수치(예: 신뢰 구간)를 함께 제시.\n 추론 방식 및 결과    2) 실시간 처리를 위해 최소\
    \ 지연 시간(Low Latency)에 초점을 맞춘 추론 방식 채택. 결\n               과는 단순 객체 탐지 또는 분류\n\n\
    \n               - 시스템 명세서 v1.0\n      관련 문서\n               ※ 시스템 명세, 구성요소, 추론\
    \ 방식 등을 포함한 문서화 자료\n\n\n투명성 및 설명가능성 확보를 위한 인공지능 모델 정보는 아래와 같다.\n※ 대상 제품·서비스를 구성하는\
    \ 모델이 여러 개인 경우, 아래 표를 복사하여 작성\n\n  인공지능 모델명            불 량 탐 지 Vision AI 모델  \
    \           버전       v1.0\n       목적                                  부품 양/불 탐지\n\
    \      모델 유형                                객체 검출 모델\n               1) 경량화된 Transformer\
    \ 변형 모델 사용\n      알고리즘     2) 모바일/엣지 장치에 최적화된 매우 경량화된 합성곱 신경망(CNN) 기반 모델. 지식\n\
    \               증류(Knowledge Distillation) 기법 활용\n               1) SHAP 기법을 모든\
    \ 결정에 적용하며, 설명 보고서 자동 생성.\n  설명가능성 확보     2) 영상 처리 결과에 대해 모델이 주목한 영역을 히트맵 형태의\
    \ Grad-CAM 등으로 시\n       방안      각화하여 현장 사용자에게 제공.\n               3) 인공지능 시스템\
    \ 출력 결과 해석을 위한 시스템 설명서 제공\n               - 시스템 설명서 v1.0\n      관련 문서    - 모델\
    \ 명세서 v1.0\n               ※ 모델 알고리즘 구조 및 명세, 설명가능성 확보 방안 등을 포함한 문서화 자료\n\n\n\n\
    \n                                                                         69"
