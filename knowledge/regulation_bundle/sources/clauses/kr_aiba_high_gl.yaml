    \    - 데이터 추출: 해당 진단 건의 AI 분석 데이터(원본 이미지, AI 분석 로그 등)을 추출\n   설명 절차       하고 보안\
    \ 서버에 저장\n              - 내부 검토: AI 개발팀과 협의하여 AI가 해당 진단 결과를 도출한 주요 근거 확인\n   \
    \           - 설명보고서 작성: AI의 판단 근거 및 기술적 한계를 명확히 담아 작성\n\n\n\n\n              \
