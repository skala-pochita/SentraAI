  heading: PDF p.11 · 학생평가
  text: "학생평가\n                                 인공지능산업과 관련된 사업을 하는 자로서 다음 각 목의 어느\
    \ 하나에 해당하는\n                                 법인, 단체, 개인 및 국가기관 등을 말함 (인공지능 기본법\
    \ 제2조제7호).\n         인공지능사업자\n                                  인공지능개발사업자 (AI\
    \ developer): 인공지능을 개발하여 제공하는 자.\n     (AI business operator)\n              \
    \                    인공지능이용사업자 (AI-using business operator): 인공지능 개발사업자가\n  \
    \                                제공한 인공지능을 이용하여 인공지능 제품 또는 인공지능 서비스를 제공하는 자.\n\
    \n\n\n\n10"
