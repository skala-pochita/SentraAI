- id: KR-AIBA-HIGH-GL:PAGE-006-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.6 · 유연하게 적용될 수 있도록 설계되었다. 이러한 접근 방식은 본 가이드라인이 사업자들에게 규제 준수만을
  text: "유연하게 적용될 수 있도록 설계되었다. 이러한 접근 방식은 본 가이드라인이 사업자들에게 규제 준수만을\n 강요하기보다는, 자율적인\
    \ 혁신을 저해하지 않으면서도 책임 의식을 내재화할 수 있도록 독려하는 데 적합하다. 즉,\n 변화하는 인공지능 기술 환경에 능동적으로 대응할\
    \ 수 있는 유연한 프레임워크의 필요성을 반영한다.\n\n\n3. 위험 기반의 선제적 규제: EU AI Act의 규제 프레임워크\nEU AI\
    \ Act는 세계 최초의 인공지능 관련 포괄적인 법안으로, 인공지능 시스템을 위험 수준에 따라 분류하고 각 위험\n수준에 상응하는 규제 요건을\
    \ 선제적으로 부과하는 방식의 프레임워크를 제시한다.\n\n\n 위험 기반 규제의 선도적 모델: EU AI Act는 고위험 인공지능 시스템에\
    \ 대한 시장 출시 전 적합성 평가, 품질 관리\n 시스템 구축, 인간 감독, 투명성 및 기록 유지 의무 등의 요건을 부과함으로써, 인공지능\
    \ 시스템에 대한 선제적인 규제\n 방안을 제시한다. 이는 본 가이드라인상 인공지능 시스템의 선제적 위험 관리 프레임워크를 수립하는데 중요한\
    \ 통찰을\n 제공한다.\n 글로벌 표준화 동향 반영: EU AI Act는 전 세계적으로 인공지능 규제 논의를 선도하고 있으며 많은 국가들이\
    \ 이를\n 참고하고 있다. 본 가이드라인도 EU AI Act를 참조하여, 국내 인공지능 사업자들이 미래에 직면할 수 있는 글로벌 규제\n\
    \ 환경에 선제적으로 대비하고, 국제적인 경쟁력을 확보하는데 기여할 수 있도록 하고 있다.\n\n\n종합적으로, 본 가이드라인은 TTA 신뢰할\
    \ 수 있는 인공지능 개발 안내서의 국내 실무적 지침, NIST AI RMF의 포괄적인\n위험 관리 접근 방식, EU AI Act의 선제적\
    \ 규제 프레임워크를 상호 보완적으로 활용하여 제정되었다. 이러한 다각적인\n참조를 통해 본 가이드라인은 글로벌 인공지능 거버넌스 동향을 반영함과\
    \ 동시에 국내 환경의 특수성을 고려하여,\n인공지능 기술의 건전한 발전과 국민의 안전 및 권리 보호라는 두 가지 중요한 목표를 동시에 달성하고자\
    \ 한다.\n\n\n\n관련 문서 매칭\n본 가이드라인 제작에 참조한 주요 세 문서의 매칭 결과는 아래와 같다.\n\n\n제1호. 위험관리방안의\
    \ 수립·운영\n\n 참조문서                                    설명\n          01: 인공지능 시스템의\
    \ 위험 관리 계획 및 수행\n          01-1: 인공지능 시스템 수명주기에 걸쳐 나타날 수 있는 위험요소를 분석하였는가?\n \
    \         01-2: 위험 요소를 제거 및 방지하거나 영향을 완화하기 위한 방안을 마련하였는가?\n          02: 인공지능\
    \ 거버넌스 체계 구성\n  韓\n          02-1: 인공지능 거버넌스에 대한 지침 및 규정을 수립하였는가?\n         \
    \ 02-2: 인공지능 거버넌스를 위한 조직을 구성하고 인력 구성에 대해 검토하였는가?\n          15: 서비스 제공 범위 및 상호작용\
    \ 대상에 대한 설명 제공\n          15-1: 인공지능 서비스의 올바른 사용을 유도하기 위한 설명을 제공하는가?\n\n\n\n\n\
    \                                                                     5"
