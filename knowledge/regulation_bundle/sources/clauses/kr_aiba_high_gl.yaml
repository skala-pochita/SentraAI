- id: KR-AIBA-HIGH-GL:PAGE-028-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.28 · 1-2-3. 유관 조직과의 협력                                개발사업자       이용사업자
  text: "1-2-3. 유관 조직과의 협력                                개발사업자       이용사업자\n\n 목표\
    \      위험관리 담당 조직 또는 인력은 해당 위험 분야에 대한 전문성을 갖춘 조직 및 직원과 긴밀하게 협력해야 함.\n 설명    \
    \  개발 및 이용사업자는 관련 전문성을 가진 유관 조직(예: 법무, 윤리, 보안, 개인정보, 고객응대 부서\n           등)와의\
    \ 지속적 협력 체계를 구축하고 정기적으로 점검해야 함.\n         개발사업자는 학습 데이터 구성, 알고리즘 선택, 모델 설계 시\
    \ 유관 조직과 사전 협의를 위한 공통 검토\n           프로세스를 마련해야 함.\n         이용사업자는 인공지능 운영 과정에서\
    \ 발생할 수 있는 위험 징후를 감지·보고할 수 있는 체계 마련하고,\n           문제 발생 시 유관 조직과의 즉각적인 협력 프로토콜을\
    \ 마련하여 대응해야 함.\n 참고      韓 신뢰할 수 있는 인공지능 개발안내서\n        - 요구사항 02. 인공지능 거버넌스\
    \ 체계 구성\n         美 NIST AI RMF\n        - GOVERN 4.2: 설계·개발·배포·평가 단계에서 인공지능\
    \ 위험 및 잠재적 영향을 문서화 및 의사소통 수행\n                                               \
    \                사업자 구분\n자가점검     위험관리 담당 조직 또는 인력은 법무, 감사, 개인정보 보호 등 전문성을 갖춘\
    \ 유관 조직과   개발 이용\n           인공지능 위험관리 협업 체계를 구축하고 있는가?\n\n   사례        고객상담 자동화\
    \ 인공지능 도입 프로젝트\nA기업은 고객상담을 자동화하기 위한 생성형 인공지능 챗봇을 개발하고 있음. 이에 따라 인공지능으로 인한\n법적·윤리적·보안\
    \ 위험을 통합적으로 관리하기 위해 ‘AI 위험관리 전담조직(AI Governance TF)’를 구성하고, 사내\n유관 부서와 다음과 같은\
    \ 방식으로 협력함.\n\n\n1. 법무팀과의 협력\n 역할: 챗봇 응답이 법적 문제(허위 정보, 명예훼손 등)를 유발할 가능성 평가.\n\
     협력 방식:\n- 인공지능 응답에서 허위 광고, 의료법 위반, 지식재산권 침해 등 법적 리스크 사전 검토.\n- 고위험 콘텐츠에 대한 법적\
    \ 검수 체크리스트 제공.\n\n\n2. 윤리팀과의 협력\n 역할: 인공지능의 편향, 차별, 부적절 응답 가능성 판단.\n 협력 방식:\n\
    - 성별, 인종, 장애 관련 차별적 표현 필터링 기준 마련.\n- 챗봇 교육 데이터에 대한 윤리 기준 검토 및 승인 절차 구축.\n\n\n\
    3. 정보보안팀과의 협력\n 역할: 인공지능 시스템 및 학습 인프라의 보안 위협 분석.\n 협력 방식:\n- 모델 API 접근 통제, 입력값\
    \ 통한 공격(fuzzing) 테스트 시행.\n- 인공지능 시스템 내 로그 저장 및 암호화 기준 수립.\n\n\n4. 개인정보보호팀과의 협력\n\
     역할: 사용자 입력 및 응답에 포함될 수 있는 개인정보 보호 검토.\n\n\n\n                              \
    \                                           27"
