- id: KR-AIBA-HIGH-GL:PAGE-027-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.27 · 1-2-2. 정보의 제공                                          개발사업자    이용사업자
  text: "1-2-2. 정보의 제공                                          개발사업자    이용사업자\n\n\
    \     목표     개발사업자는 이용사업자 및 이용자에게, 이용사업자는 이용자에게 인공지능 위험과 관련된 충분한\n          \
    \  정보를 제공하기 위해 노력해야 함.\n     설명     개발사업자는 고영향 인공지능을 개발하거나 이를 고도화하여 제공하는 책임 주체로서,\
    \ 인공지능의 주요\n            기능과 작동 원리, 사용 데이터의 특성, 자동화된 결정 방식과 한계 등에 대한 정보를 이용사업자에게\n\
    \            충분히 제공하기 위해 노력해야 함.\n           - 인공지능 사용 시 발생할 수 있는 윤리적 문제 및 예기치\
    \ 않은 오작동 가능성과 그에 대한 대응 절차에\n             대해서 가능한한 충분한 정보를 제공할 필요가 있으며, 사용자 매뉴얼,\
    \ FAQ, 동영상 자료 등 다양한\n             형식의 자료를 마련하여 제공하고, 이를 주기적으로 최신화하기 위해 노력해야 함.\n\
    \           - 또한, 개선 이력이나 보안 업데이트 등의 중요 정보를 지속적으로 공유하여 이용자가 인공지능을 안전하게\n     \
    \       사용할 수 있도록 지원해야 함.\n            이용사업자는 개발사업자로부터 제공받은 인공지능을 자사의 제품·서비스에\
    \ 활용하는 주체로서, 해당\n            인공지능이 이용자에게 미치는 영향에 대한 정보를 이용자에게 제공하기 위해 노력해야 함.\n\
    \           - 우선 제품·서비스 내 인공지능 활용 사실을 고지하고, 인공지능이 수행하는 역할, 자동화 여부, 인간의\n     \
    \       개입 범위 및 결정이 이용자의 권리에 미치는 영향을 가능한 충분히 설명해야 함.\n           - 또한 이용자가 자신의\
    \ 정보 처리 방식, 이의 제기 절차, 문제 발생 시 신고나 상담 방법에 대해 알 수\n            있도록 이용약관, 공지사항, 홈페이지,\
    \ 사용 설명서 등을 통해 정보를 투명하게 제공할 수 있음.\n     참고     韓 신뢰할 수 있는 인공지능 개발안내서\n      \
    \     - 요구사항 15. 서비스 제공 범위 및 상호작용 대상에 대한 설명 제공\n           - 요구사항 15-1. 인공지능 서비스의\
    \ 올바른 사용을 유도하기 위한 설명을 제공하는가?\n            美 NIST AI RMF\n           - GOVERN\
    \ 2.2: 인공지능 위험 관리 및 효과성을 위해 인공지능 시스템에 적용되는 법률, 정책, 규정 등의\n            정보 제공\n\
    \            EU AI ACT\n           - 제9조제5항제c호: 고위험 인공지능 시스템 운영 중 위험 감소를 위해 적절한\
    \ 정보 제공\n           - 제13조제2항: 고위험 인공지능 시스템의 안전한 사용을 위해 이용자에게 사용 지침 제공\n     \
    \                                                             사업자 구분\n 자가점검  \
    \     인공지능 위험 정보를 충분히 제공하고 있는가?                            개발 이용\n          \
    \  정보 제공에 사용되는 자료의 형식 및 방법은 적절한가?                       개발 이용\n\n      사례   \
    \    인공지능 정보 제공 방법\n인공지능에 대해 충분한 정보를 제공하기 위한 방법은 아래와 같이 다양한 형식으로 제공될 수 있음.\n\n\
    \n          정보제공 대상                                 예시\n           이용자       \
    \        튜토리얼 영상, 경고 문구, 사용 가이드\n      이용사업자(기업고객)            워크숍, API 문서, 활용\
    \ 가이드북, 책임 사용 가이드\n      개발사업자(내부직원)            문제 발생 대응 매뉴얼\n\n\n\n\n26"
