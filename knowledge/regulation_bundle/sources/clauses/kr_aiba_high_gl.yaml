- id: KR-AIBA-HIGH-GL:PAGE-058-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.58 · 4-2-2. 교육 및 훈련                                        개발사업자     이용사업자
  text: "4-2-2. 교육 및 훈련                                        개발사업자     이용사업자\n\n\
    \ 목표      인공지능의 범위 및 수행능력에 대한 이해도를 향상시키기 위한 교육 및 훈련 방안을 제공해야 함.\n 설명      개발사업자는\
    \ 이용사업자에게 인공지능 운영에 필요한 지식을 제공하거나, 절차에 대한 교육 및 훈련을\n         제공하여 원활한 운영이 가능하도록\
    \ 해야 함.\n        - 인공지능 운영 과정에서 발생할 수 있는 대표적인 오류 유형 (예: 입력 오류, 출력 오류, 데이터 편향,\n\
    \         시스템 중단 등)과 그에 대한 대응 방안에 대해 체계적으로 안내하기 위해 노력해야 함.\n         이용사업자는 이용자에게\
    \ 인공지능 시스템의 한계 및 오류 가능성에 대한 교육 및 훈련을 제공하여 원활한\n         이용이 가능하도록 노력해야 함.\n 참고\
    \      韓 신뢰할 수 있는 인공지능 개발안내서\n        - 요구사항 13. 인공지능 시스템의 안전 모드 구현 및 문제발생 알림\
    \ 절차 수립\n         美 NIST AI RMF\n        - GOVERN 4.3: 인공지능 테스트 및 사고 대응 정보 공유\n\
    \        - MEASURE 3.3: 이용자 피드백 전달 프로세스 구축 및 인공지능 시스템 평가 지표 마련\n        - MEASURE\
    \ 4.1: 인공지능 위험 측정 방법을 외부관계자와 협의 및 문서화 수행\n         EU AI ACT\n        - 제4조:\
    \ 책임 있는 인공지능 활용을 위해 이해관계자에게 인공지능 리터러시 교육 운영\n                                \
    \                                 사업자 구분\n자가점검     이용사업자에게 인공지능 운영에 필요한 지식 또는\
    \ 절차에 대한 교육 및 훈련이 제공되고          개발\n         있는가?\n         이용자에게 인공지능의 능력과 한계에\
    \ 대한 지식, 교육, 훈련 등이 제공되고 있는가?           이용\n\n   사례       제네시스 랩(Genesis Lab) -\
    \ 뷰인터(Viewinter) HR\n\n\n제네시스 랩은 인공지능 기반 영상 면접 평가\n시스템인 뷰인터HR의 사용성 향상 및 시스템\n\
    신뢰도 강화를 위해, 주요 이용자층인 응시자(개인\n이용자)와 고객사(기업 인사담당자)를 대상으로\n정기적인 이용자 설문조사 및 인터뷰를 실시함.\n\
    \n\n\n\n                                                                     \
    \     57"
