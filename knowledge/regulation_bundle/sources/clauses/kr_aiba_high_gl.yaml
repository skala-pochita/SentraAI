- id: KR-AIBA-HIGH-GL:PAGE-020-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.20 · 1-1     위험관리정책 수립 및 이행
  text: "1-1     위험관리정책 수립 및 이행\n\n1-1-1. 위험관리 계획의 수립                            \
    \           개발사업자   이용사업자\n\n 목표      고영향 인공지능에 대한 위험관리 계획을 수립해야 함.\n 설명    \
    \  개발 및 이용사업자는 고영향 인공지능의 설계·개발·운영 과정에서 발생 가능한 법적, 사회적 위험을\n          관리하기 위한\
    \ 계획을 수립해야 함.\n        - 수립되는 위험관리 계획은 인공지능 전 수명주기에 걸쳐 발생할 수 있는 위험을 식별, 분석, 평가하고,\n\
    \          그에 따른 적절한 처리 절차를 포함하는 방향으로 작성.\n        - 위험관리를 위해 고영향 인공지능 영향평가 절차(인공지능\
    \ 기본법 제35조제1항)를 효과적으로 활용할 수\n          있으며, 사업자에게 부과된 다양한 법적 책무 또한 수명주기별 위험관리\
    \ 절차에 통합하여 이행함으로써\n          효율성을 높일 수 있음.\n        - 이용사업자는 운영 과정의 위험을 지속적으로\
    \ 관리하기 위한 계획을 수립해야 함. 다만, 개발사업자가\n          위험을 직접 관리·운영하는 경우, 이용사업자는 개발사업자와의\
    \ 협력에 따라 개발사업자의 위험관리계획\n          중 이용사업자의 책임 범위와 관련된 사항을 자신의 위험관리계획의 일부 또는 전부로\
    \ 준용할 수 있음.\n 참고      韓 신뢰할 수 있는 인공지능 개발안내서\n        - 요구사항 01. 인공지능 시스템에 대한\
    \ 위험관리 계획 및 수행\n         美 NIST AI RMF\n        - GOVERN 1.3: 조직의 위험 감내(tolerance)\
    \ 수준 설정을 위해 위험관리 활동 수준을 결정하는 절차 정의\n         EU AI ACT\n        - 제9조제1항: 지속적인\
    \ 인공지능 위험관리 시스템 구축·운영 및 문서화\n                                                \
    \                   사업자 구분\n자가점검     조직은 인공지능 위험관리 계획을 수립하고 책임을 명시하고 있는가?   \
    \                  개발 이용\n         수립된 위험관리 계획이 위험 식별, 분석, 평가, 처리 절차를 포함하는가?\
    \                개발 이용\n         위험관리 시 영향 평가 절차를 고려하고 있는가?                 \
    \              개발 이용\n         위험관리가 지속적으로 이행되고 있는가?                        \
    \              이용\n\n   사례        Responsible Scaling Policies (RSPs)\nMETR의 'Responsible\
    \ Scaling Policies (RSPs)'는 인공지능 개발자가\n현재의 보호 조치로 안전하게 관리할 수 있는 인공지능 능력 수준을 명확히\n\
    정의하고, 보호 조치가 개선되기 전까지는 인공지능의 배포나 능력 확장을\n중단해야 하는 조건을 명시하는 정책으로, 그림에서 오른쪽으로 갈수록\n\
    인공지능의 위험한 능력이 증가하고, 위쪽으로 갈수록 보호 조치가\n강화되는 구조를 가짐.\n 안전 영역 (safe region): 인공지능이\
    \ 높은 위험을 초래할 수 있는\n 능력을 갖추고 있더라도 충분한 보호 조치가 적용된 상태를 의미.\n 위험 영역 (risky region):\
    \ 위험한 능력을 가진 인공지능에 충분한 보호\n 조치가 마련되지 않은 상태를 의미.\nRSP는 인공지능 능력의 확장이 보호 조치의 수준과\
    \ 조화를 이루는지를\n지속적으로 검토하고, 위험 관리와 관련된 기준을 설정함으로써 인공지능의 안전성을 확보하기 위한 실질적인\n가이드라인을\
    \ 제공함.\n\n\n\n\n                                                             \
    \               19"
