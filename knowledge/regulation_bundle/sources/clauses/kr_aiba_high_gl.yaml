- id: KR-AIBA-HIGH-GL:PAGE-017-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.17 · 고영향 인공지능사업자
  text: "고영향 인공지능사업자\n3장\n   책무 조치사항\n\n3.1 위험관리방안의 수립·운영\n\n관련 기술고시 조문\n제4조(위험관리방안의\
    \ 수립ㆍ운영) ① 인공지능개발사업자 및 인공지능이용사업자(이하 “사업자”라 한다)는 고영향 인\n공지능의 위험관리를 위하여 다음 각 호의\
    \ 사항이 포함된 위험관리방안을 수립ㆍ운영하여야 한다.\n 1. 위험관리정책 수립 및 이행\n 2. 위험관리 조직체계 수립 및 운영\n② 사업자는\
    \ 제1항의 위험관리방안을 인공지능 수명주기의 모든 과정에서 준수하여야 한다.\n③ 사업자는 최신의 위험관리방안을 주기적으로 점검ㆍ갱신하고\
    \ 그 변경내역을 관리하여야 한다.\n\n\n\n타 법령의 유사 조치사항\n     법령          조항                \
    \          내용\n                          지능정보화 기본법 제60조는 지능정보기술 및 지능정보서비스의 안\n\
    \                          전성 확보를 위한 최소한의 보호조치를 명시하고 있다. 이는 고영향\n            \
    \  제60조(안전성    인공지능이 야기할 수 있는 광범위한 위험을 관리하고 안전성을 확\n지능정보화 기본법\n              \
    \ 보호조치)      보해야 한다는 인공지능 사업자 책무의 기본 전제와 동일하다. 단,\n                          지능정보화\
    \ 기본법은 안전성 보호조치를 권고할 수 있다고 명시하\n                          여 강제성이 상대적으로 낮다.\n \
    \                         인공지능 역시 소프트웨어를 통해 구현되므로, 소프트웨어의 기본적\n              \
    \            인 안전 원칙이 인공지능의 안전성 확보에도 적용될 수 있다. 단,\n                          소프트웨어\
    \ 진흥법은 일반적인 소프트웨어의 안정성 및 보안 취약\n            제30조(소프트웨어안   점 등 기술적 결함으로 인한 위험에\
    \ 중점을 두지만, 인공지능 기본\n소프트웨어 진흥법\n               전 확보)      법은 알고리즘의 비결정성, 인과관계의\
    \ 불분명성, 자율적 학습 및\n                          진화 등으로 인해 예측 불가능한 결과를 고려한다. 이러한 인공지능\n\
    \                          고유의 비기술적, 사회적, 윤리적 위험에 대한 고려는 소프트웨어\n             \
    \             진흥법에서는 찾아보기 어렵다.\n\n\n\n\n16"
