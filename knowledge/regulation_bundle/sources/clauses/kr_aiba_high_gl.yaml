- id: KR-AIBA-HIGH-GL:PAGE-025-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.25 · 1-2   위험관리 조직체계 수립 및 운영
  text: "1-2   위험관리 조직체계 수립 및 운영\n\n1-2-1. 위험관리 조직체계 구성                          \
    \         개발사업자        이용사업자\n\n     목표     위험을 관리하는 담당 조직을 구성하거나 조직 내 위험관리를\
    \ 담당하는 인력을 지정해야 함.\n           ※ 사업자의 규모 및 역량을 고려하여 담당 조직을 구성할 수도 있고, 겸임 인력을 지정할\
    \ 수 있음.\n     설명     개발 및 이용사업자는 인공지능 위험관리를 담당하는 조직을 구성하거나 인력을 지정하여 위험관리\n  \
    \          업무를 수행하고 이에 대한 책임을 명시하기 위해 노력해야 함.\n           - 위험관리 조직 또는 인력은 기술,\
    \ 법률, 윤리 등 다양한 분야의 전문가 또는 담당자로 구성하도록 노력해야\n            하며, 이들의 책임과 권한을 정의해야 함.\n\
    \           - 이 조직 또는 인력은 인공지능 기획·개발 업무와 분리되어야 하며, 이해상충 방지를 위한 조직적·기능적\n     \
    \       독립성이 최대한 확보되어야 함.\n     참고     韓 신뢰할 수 있는 인공지능 개발안내서\n           - 요구사항\
    \ 02. 인공지능 거버넌스 체계 구성\n           - 세부요구사항 02-1. 인공지능 거버넌스에 대한 지침 및 규정을 수립하였는가?\n\
    \           - 세부요구사항 02-2. 인공지능 거버넌스를 위한 조직을 구성하고 인력 구성에 대해 검토하였는가?\n        \
    \    美 NIST AI RMF\n           - GOVERN 1.3: 조직의 위험 감내(tolerance) 수준 설정을 위해 위험관리\
    \ 활동 수준을 결정하는 절차 정의\n           - GOVERN 4.2: 설계·개발·배포·평가 단계에서 인공지능의 위험 및 잠재적\
    \ 영향을 문서화 및 의사소통 수행\n            EU AI ACT\n           - 제9조제1항: 지속적인 인공지능 위험관리\
    \ 시스템 구축·운영 및 문서화\n                                                          \
    \            사업자 구분\n 자가점검       인공지능 위험관리를 위한 조직 또는 담당이 지정되어 있는가?          \
    \              개발 이용\n            위험관리 조직 또는 인력은 기술, 법률, 윤리 등 다양한 분야의 전문가 또는\
    \ 담당자로          개발 이용\n            구성되어 있는가?\n            위험관리 조직 또는 인력의 책임과\
    \ 권한이 명확히 정의되어 있는가?                     개발 이용\n            위험관리 조직 또는 인력이 독립성과\
    \ 자율성을 보장받고 있는가?                       개발 이용\n\n\n\n\n24"
