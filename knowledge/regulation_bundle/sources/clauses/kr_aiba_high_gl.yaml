- id: KR-AIBA-HIGH-GL:PAGE-030-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.30 · 3.2 기술적으로 가능한 범위에서의 인공지능이 도출한 최종결과,
  text: "3.2 기술적으로 가능한 범위에서의 인공지능이 도출한 최종결과,\n인공지능의 최종결과 도출에 활용된 주요 기준, 인공지능의 개발·\n\
    활용에 사용된 학습용 데이터의 개요 등에 대한 설명 방안의 수립·시행\n\n관련 기술고시 조문\n제5조(설명방안의 수립ㆍ시행) ① 사업자는\
    \ 고영향 인공지능이 도출한 최종결과 및 기준에 대한 근거를 마련하기 위\n해 인공지능의 투명성 및 설명가능성을 확보하여야 한다.\n② 사업자는\
    \ 학습용데이터에 관한 정보를 체계적으로 관리하기 위해 학습용데이터의 개요를 정의하고 관리하여야 한다.\n③ 사업자는 제1항 및 제2항과 관련하여\
    \ 이용자에게 설명 제공이 필요한 사항을 자율적으로 정하여 설명방안을 수\n립하고 시행하여야 한다.\n④ 인공지능이용사업자는 제3항에 따른\
    \ 설명방안의 내용 중 담당부서, 설명절차 등 이용자에게 제공이 필요하다고\n판단하는 설명방안의 주요 내용을 홈페이지에 게시하거나 서면(전자문서를\
    \ 포함한다. 이하 같다)을 교부하는 등의 방\n법으로 제공하여 이용자가 쉽게 설명을 받을 수 있도록 하여야 한다.\n\n\n\n타 법령의\
    \ 유사 조치사항\n    법령             조항                            내용\n             \
    \                     인공지능 학습데이터에 개인정보가 포함될 수 있으므로 개인\n                      \
    \            정보보호법이 인공지능의 설명가능성 및 투명성 확보에 적용\n                               \
    \   될 수 있다. 단, 개인정보보호법은 개인정보 처리에 대한 정\n             제4조(정보주체의 권리)\n          \
    \                        보주체의 통제권 보장에 방향성을 두고 있지만, 인공지능 기\n                  \
    \                본법은 인공지능의 최종 결과와 활용된 기준 및 학습데이터의\n                          \
    \        특성을 이용자에게 명확히 설명하는 데 중점을 두고 있다.\n                                  개인정보보호법\
    \ 제37조의2는 개인정보 처리 시 완전히 자동\n                                  화된 결정이 정보주체의 권리나\
    \ 의무에 중대한 영향을 줄 경\n 개인정보보호법\n                                  우, 정보주체가 이에 대한\
    \ 거부와 설명을 요구할 수 있는 권\n                                  리를 명시한다. 이는 인공지능 기본법에서\
    \ 사업자가 인공지능\n             제37조의2(자동화된    결정에   의 최종 결과 및 주요 기준 등에 대해 설명방안을 수립하고\n\
    \             대한 정보주체의 권리 등)       이용자에게 제공하도록 하는 점과 유사하다. 다만, 개인정보\n        \
    \                          보호법은 정보주체가 자동화된 결정을 직접적으로 거부하거나\n                 \
    \                 인적 개입을 요구하는 실질적인 권리 보장에 방향성을 두고\n                          \
    \        있지만, 인공지능 기본법은 인공지능 사업자가 이용자에게 결\n                                  과와\
    \ 기준, 데이터 개요 등을 설명할 의무를 부과한다.\n                                  자동화 시스템이 도출한\
    \ 결과 및 주요 기준, 활용된 데이터에\n 신용정보의 이용    제36조의2(자동화평가    결과   대한 설명 가능성과 투명성을 보장하여\
    \ 정보주체의 알 권리와\n 및 보호에 관한    에 대한 설명 및 이의제기       권리보호를 실현하고자 한다. 다만 신용정보법은 개인신용평\n\
    \ 법률(신용정보법)   등)                   가와 같은 신용정보 분야에 국한하지만 인공지능 기본법은 신\n        \
    \                          용정보를 포함한 다양한 고영향 인공지능을 대상으로 한다.\n\n\n\n\n         \
    \                                                           29"
