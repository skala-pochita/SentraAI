- id: KR-AIBA-HIGH-GL:PAGE-062-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.62 · 부록
  text: "부록\n\n\n1. 안전신뢰문서 양식 [작성용]\n\n양식 제작 배경\n본 부록은 인공지능 기본법 제34조제1항제5호에 따른 고영향\
    \ 인공지능 사업자의 책무 이행을 지원하기 위해 마련된\n‘안전성·신뢰성 확보를 위한 조치의 내용을 확인할 수 있는 문서’ (안전신뢰문서)의\
    \ 표준 양식이다. 인공지능 기본법은\n고영향 인공지능을 제공하는 사업자가 위험관리방안, 설명방안, 이용자 보호방안, 사람의 관리·감독 등\
    \ 핵심 안전성·신뢰성\n확보 조치를 이행하고 그 근거를 문서로 작성하여 5년간 보관하도록 의무화하고 있다.\n\n\n본 양식은 사업자들이\
    \ 법적 의무 사항을 명확히 이해하고 이행하는 데 실질적인 도움을 제공하고, 준수의 편의성을 높이기\n위해 제작되었다. 특히, 법 제34조제1항에서\
    \ 규정하는 네 가지 핵심 책무(위험관리방안, 설명 방안, 이용자 보호 방안,\n사람의 관리·감독)의 모든 조치사항을 포괄적으로 통합하여,\
    \ 복잡한 법적 요구사항을 하나의 체계적인 문서 형태로 정리할\n수 있도록 구성되었다.\n\n\n사업자가 자율적인 이행을 보다 쉽게 시작할\
    \ 수 있도록, 각 책무 조치사항에는 구체적인 이행 방안과 예시를 포함하였다.\n이는 가이드라인이 추상적인 원칙 나열에 그치지 않고, 사업자가\
    \ 실제 업무에 적용할 수 있는 실무적인 지침을\n제시함으로써 법·제도의 실효성을 강화하는 데 기여하기 위함이다. 따라서, 본 양식을 활용하여\
    \ 실제 작성될\n안전신뢰문서의 주요 내용은 법 제34조제1항 각 호의 조치를 확인할 수 있도록 작성되는 것이 바람직하다.\n\n\n다만,\
    \ 이 양식은 법적 의무 이행을 위한 최소한의 틀을 제시하는 도구이며, 본 양식의 작성 및 활용 자체가 법적 강제사항은\n아니다. 특히 인공지능\
    \ 기본법 및 하위법령 등에서 별도로 규정하지 않는 한, 본 가이드는 사업자의 자율성을 존중하여\n동등성 진술(equivalence statement)을\
    \ 허용하는 방향으로 안내한다. 이에 따라 사업자가 책무사항을 이미 준비한 경우,\n관련 문서를 다시 작성하는 대신 해당 증거 자료를 참조하는\
    \ 것으로 갈음할 수 있다. 작성 예시 중 사내 기준이나 기존\n문서가 더 적합한 경우를 위해 대표적인 문서명을 예시에 포함한 것 역시 이러한\
    \ 취지이다.\n\n\n마지막으로, 고도의 정밀한 관리가 필요한 위험 요소(예: 실시간 모니터링, 사고 대응 및 복구)에 대해서는 본 양식을\
    \ 넘어,\n사내의 구체적인 기술 시스템이나 독립적인 내부 거버넌스 체계를 통해 관리 기준을 더욱 강화할 것을 권고한다. 고영향\n인공지능의\
    \ 위험과 기술은 끊임없이 변화하므로, 사업자는 최신의 기술 및 관리 방법이 적용될 수 있도록 안전신뢰문서와\n위험관리방안을 주기적으로 점검하고\
    \ 갱신할 필요가 있다. 이를 위해 사업자는 법적 규제 이상의 자율적인 노력을 통해\n혁신을 저해하지 않으면서도 인공지능의 안전성을 실질적으로\
    \ 확보하기 위해 노력해야 한다.\n\n\n\n\n                                                 \
    \                       61"
