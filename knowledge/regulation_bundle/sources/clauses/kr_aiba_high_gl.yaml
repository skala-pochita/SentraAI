- id: KR-AIBA-HIGH-GL:PAGE-055-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.55 · 4-1      인공지능 개발 단계
  text: "4-1      인공지능 개발 단계\n\n4-1-1. 사람의 개입 기준                                 \
    \             개발사업자            이용사업자\n\n     목표       사람이 인공지능 동작에 개입할 수 있는 기준(예:\
    \ 의도한 목적과 다른 성능 또는 결과)을 정의해야 함.\n     설명       개발사업자는 인공지능이 제품·서비스 목적에서 벗어난 방식으로\
    \ 작동하거나 비정상적인 결과를 도출하는\n               경우, 사람이 이를 식별하고 개입할 수 있도록 설계해야 함.\n   \
    \          - 인공지능이 특정 조건이나 임계값을 초과할 경우, 자동으로 경고를 발생시키고 사람의 검토 및 승인을\n        \
    \       유도하는 제어 절차를 포함할 수 있음.\n             - LLM과 같이 범용적이고 광범위한 인공지능의 경우, '사람\
    \ 및 사회에 유해한 정도' 와 같이 넓은 범위에서\n               개입 기준을 정의하고, 제품·서비스 범위에 따라 세부사항 (예:\
    \ 혐오발언/차별, 불법정보 제공, 악의적\n               허위정보 등) 을 정할 수 있음.\n              이용사업자는\
    \ 비정상적 행동이나 예외 상황 발생 시 이를 분석하고, 필요시 시스템 동작을 일시\n               중지하거나 수정할 수 있는\
    \ 권한과 도구를 갖춰야 함.\n             - 이상 징후나 편향 발생이 감지된 경우, 사람이 해당 문제를 진단하고 조치할 수 있도록\
    \ 로그, 데이터 흐름,\n               추론 과정 등의 정보를 준비할 수 있음.\n     참고       韓 신뢰할 수 있는\
    \ 인공지능 개발안내서\n             - 요구사항 13. 인공지능 시스템의 안전 모드 구현 및 문제발생 알림 절차 수립\n   \
    \           美 NIST AI RMF\n             - GOVERN 1.7: 안전한 인공지능 시스템 폐기를 위해 관련\
    \ 절차를 수립·이행\n             - MAP 3.5: 거버넌스 정책에 따른 감독 프로세스 정의, 평가, 문서화 수행\n    \
    \         - MANAGE 2.4: 목적 외 결과에 대한 대응을 위해 인공지능 시스템 대체, 해제 또는 비활성화 메커니즘 마련\n \
    \             EU AI ACT\n             - 제14조제1항: 시스템 이용 중 사람이 통제할 수 있는 방안을 고려하여\
    \ 인공지능 시스템을 설계개발\n                                                          \
    \                        사업자 구분\n 자가점검         이상 상태 발생 시, 인공지능이 자동으로 경고를 발생시키고\
    \ 사람의 검토를 요청하는                         개발\n               절차를 포함하고 있는가?\n    \
    \          인공지능을 일시 정지, 재시작 또는 특정 기능을 비활성화할 수 있는 제어 권한을 가지고                 \
    \     이용\n               있는가?\n              인공지능의 이상 행동을 분석하기 위한 도구(예: 실시간 로그\
    \ 조회, 추론 이력 확인,                       이용\n               입력-출력 비교 등)를 갖추고 있는가?\n\
    \n      사례          인공지능 의사결정에 대한 사람의 개입 정의\nISO/IEC 24028:2020의 9.4 Controllability와\
    \ WEF(World Economic Forum) Companion to the Model AI\nGovernance Framework에서는\
    \ 도출된 위험의 심각도 및 발생빈도를 기반으로 인공지능의 의사결정에 대한 사람의\n개입 정도를 아래와 같이 분류(Guiding questions\
    \ 3.2)함.\n\n                구분                                    설명 및 정의\n  \
    \                             인공지능 시스템이 의사결정을 수행하지 않으며 사람이 수행하는 의사결정에\n      \
    \    Human-in-the-loop\n                               보조적인 용도로 사용. 예) 의료 진단/처방,\
    \ 상품 입찰"
  condition: high_impact_ai
  assessable: true
  evidence_scope: finding
