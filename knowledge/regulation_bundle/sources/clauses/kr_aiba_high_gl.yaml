  heading: 'PDF p.106 ·  규정: AI 신뢰성 관리'
  text: " 규정: AI 신뢰성 관리\n                                         규정 v1.0\n     \
    \                                    (ID: REG-2026-003)\n                    \
    \                                            점검 대장: 데이터 관리\n                \
    \      학습/운영 데이터 내 개인     규정: 개인정보 관리\n개인정보 비식별                             \
    \                           대장의 ‘개인정보처리\n             반기 1회    식별정보 잔존 여부 확인 \
    \     규정 v1.0\n  처리 점검                                                       \
    \  점검’시트\n                      및 준수 조치            (ID: REG-2026-002)\n      \
    \                                                          (ID: RM-REF-0005)\n\
    \                                         점검 절차: 개인정보\n                     \
    \                    비식별조치 가이드라인 v1.0\n                                      \
    \   (ID: REF-2026-003)\n\n\n\n\n교육 및 훈련\n개발사업자는 이용사업자에게, 이용사업자는 이용자에게 인공지능 운영에\
    \ 필요한 지식, 절차, 대표적인 오류 유형 및\n대응 방안에 대한 체계적인 교육 및 훈련을 제공한다.\n\n  교육 및 훈련명      \
    \     대상    수행일/주기                         내용\n                고객사 운영\n      \
    \                              시스템 사용 방법, 평가 흐름, 결과 리포트 해석 방법 및\n시스템 기본 운영 교육\
    \     담당자       도입시 1회\n                                                     운영\
    \ 절차 안내\n                (HR/채용팀)\n\n                 고객사\n                  \
    \                  입력 오류, 결과 오류, 시스템 중단 등 대표 오류 유형과\n오류·장애 대응 교육     운영담당자   \
    \   분기별 1회\n                                                    대응 매뉴얼 안내\n  \
    \              (서비스운영)\n\n                고객사 운영\n                 담당자,      \
    \            개인정보 처리 범위, 보관기간, 접근권한 관리, 데이터\n개인정보·보안 준수 교육               연 1회\n\
    \                고객사 보안                          반출 금지 등 준수사항 교육\n           \
    \      담당자\n\n  이의제기·재검토      고객사 운영              지원자 이의제기 접수, 설명 제공, 재검토 수행 및\
    \ 기록\n                            연 1회\n   절차 교육         담당자                 \
    \                관리 절차 안내\n\n\n\n\n                                          \
    \                                          105"
