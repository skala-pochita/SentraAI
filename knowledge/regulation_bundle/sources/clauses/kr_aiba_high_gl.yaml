- id: KR-AIBA-HIGH-GL:PAGE-031-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.31 · 주요 내용
  text: "주요 내용\n본 절의 사업자 책무사항 주요 내용을 주제별로 분류하면 아래와 같다.\n\n             책무사항      \
    \            주제                       소주제\n\n      2. 기술적으로 가능한        2-1. 인공지능이\
    \ 도출한 최종결과\n                                                 2-1-1. 투명성 및 설명가능성\
    \ 확보\n 범위에서의 인공지능이 도출한          및 기준에 대한 근거 마련\n 최종결과, 인공지능의 최종결과\n          \
    \                2-2. 학습용데이터 정보의 관리     2-2-1. 학습용데이터 개요\n     도출에 활용된 주요 기준,\n\
    \ 인공지능의 개발·활용에 사용된                                2-3-1. 설명 방안의 주요 내용 수립\n   \
    \  학습용 데이터의 개요 등에       2-3. 설명 방안의 수립 및 시행\n     대한 설명 방안의 수립·시행            \
    \                 2-3-2. 설명 방안의 시행\n\n\n\n오픈소스 모델 고려사항\n오픈소스 모델을 활용하는 사업자는 직접\
    \ 모델을 개발하는 사업자와 아래와 같은 차이가 있다.\n\n 소주제 번호                  직접 개발             \
    \              오픈소스 모델\n                                              오픈소스 모델은\
    \ 원천 기술에 대한 완벽한 통제\n                                              가 어려우므로, 활용한\
    \ 기반 모델의 명칭과 버\n              모델의 학습 구조, 알고리즘 아키텍처, 추론 방      전을 명확히 기록할 필요가 있음.\
    \ 오픈소스 모\n     2-1-1\n              식 전체를 상세히 설계하고 문서화할 수 있음.       델을 그대로 쓰지\
    \ 않고 조정했다면, 해당 수정\n                                              내역을 문서에 반영하여\
    \ 최신 상태를 유지하는\n                                              것이 바람직함.\n      \
    \        데이터 수집 범위, 전처리 기준, 품질 점검 결      학습한 데이터의 상세 내역을 알 수 없는 경우,\n     2-2-1\
    \    과를 처음부터 끝까지 직접 정의하고 기록할 수       '공개된 데이터' 또는 '제3자 라이선스' 등 수집\n          \
    \    있음.                             경로를 유형별로 기록하는 것이 바람직함.\n                \
    \                              직접 통제하지 않은 모델의 특성상 발생할 수\n              결과 도출에\
    \ 영향을 미친 주요 특성(feature)을\n                                              있는 기술적\
    \ 제약(예: 한국어 이해도 부족, 최신\n     2-3-1    알고 있으므로, 이를 근거로 설명 방안을 만들\n            \
    \                                  데이터 미반영)을 더 구체적으로 이용자에게 안\n              수\
    \ 있음.\n                                              내할 필요가 있음.\n            \
    \                                  모델 원저작자가 모델을 업데이트할 경우, 이에\n              모델\
    \ 업데이트 주기에 맞춰 설명 자료를 동기화\n     2-3-2                                    따라 변화된\
    \ 동작 방식이나 주의사항을 설명 자\n              하기 용이함.\n                                \
    \              료에 반영할 필요가 있음.\n\n\n\n\n30"
