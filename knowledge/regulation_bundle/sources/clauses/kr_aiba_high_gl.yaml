- id: KR-AIBA-HIGH-GL:PAGE-026-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.26 · 사례         해외 주요기업 인공지능 위험관리 조직 운영
  text: "사례         해외 주요기업 인공지능 위험관리 조직 운영\n1. OpenAI – Preparedness Team\n 위치:\
    \ 연구·안전 부문 산하\n 조직 역할:\n- 모델 배포 전 리스크(안보, 악용 가능성 등) 검증\n- 안전 실험 및 ‘레드팀(red-teaming)’\
    \ 운영\n- 모델 개선 시 위험 평가 프로세스 통합\n 운영 방식: CEO 및 보드에 직접 보고 → 최고 의사결정 레벨과 긴밀히 연결\n\
    \n\n2. Google DeepMind – AI Safety & Alignment Team\n 위치: DeepMind 연구 부문 내 독립적\
    \ Safety 조직\n 조직 역할:\n- 대규모 언어모델과 강화학습 모델의 안전성 테스트\n- 윤리·책임성 관련 부서(Ethics & Society)와\
    \ 협력\n 운영 방식:\n- 독립적 검증팀 → 연구팀과 분리하여 \"개발자=검증자\"가 되지 않도록 구조화\n- 정기적으로 외부 자문위원단(ethics\
    \ board)과 협업\n\n\n3. Microsoft – Responsible AI Office\n 위치: Chief Responsible\
    \ AI Officer 직속\n 조직 역할:\n- 사내 모든 AI 프로젝트의 리스크 리뷰·승인\n- “Responsible AI Standard”\
    \ 준수 여부 심사\n- 기술팀, 법무팀, PR팀 등과 교차 기능 조직 운영\n 운영 방식:\n- AETHER Committee, Office\
    \ of Responsible AI, Responsible AI Strategy in Engineering → 3중 구조\n- 각 제품·서비스팀이\
    \ AI 기능을 배포하기 전 RAIO의 심사를 거쳐야 함\n\n\n4. IBM – AI Ethics Board & GRC 조직\n 위치:\
    \ CIO 산하 GRC(Governance, Risk, Compliance) 부문과 연계\n 조직 역할:\n- AI Ethics Board:\
    \ 제품·서비스 출시 전 윤리·법적 위험 심사\n- GRC 팀: watsonx.governance와 같은 툴을 활용해 리스크 관리 자동화\n\
     운영 방식:\n- 다학제적 구성 (법무, 엔지니어, 정책, HR)\n- 모든 AI 프로젝트는 반드시 Ethics Board를 거쳐야 승인\
    \ 가능\n\n\n\n\n                                                               \
    \                                25"
