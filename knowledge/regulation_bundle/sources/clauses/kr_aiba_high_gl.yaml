- id: KR-AIBA-HIGH-GL:PAGE-011-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.11 · 1.3 주요 용어의 개념
  text: "1.3 주요 용어의 개념\n\n본 가이드라인의 일관된 이해와 적용을 위하여, 사용되는 핵심 용어의 정의를 다음과 같이 제시한다. 각\
    \ 용어는 국\n내외 인공지능 관련 기준 및 법령을 참조하여 선정 및 정의되었다.\n\n              용어            \
    \                              설명\n            인공지능                 학습, 추론, 지각,\
    \ 판단, 언어의 이해 등 인간이 가진 지적 능력을 전자적 방법으\n (artificial intelligence, AI)   로 구현한 것\
    \ (인공지능 기본법 제2조제1호).\n                                 다양한 수준의 자율성과 적응성을 가지고 주어진\
    \ 목표를 위하여 실제 및 가상환경\n                                 에 영향을 미치는 예측, 추천, 결정 등의\
    \ 결과물을 추론하는 인공지능 기반 시스\n                                 템 (인공지능 기본법 제2조제2호).\n\
    \                                  ‘고영향 인공지능’은 고영향 분야의 인공지능시스템을 의미.\n       \
    \                           목표: 인공지능시스템의 목표는 명시적, 암묵적 목표를 모두 포함. 즉, 개발자가 직접\n\
    \                                  입력, 지시한 명시적 목표는 물론, 상황에 따른 규칙이나 학습데이터로 형성된\n\
    \                                  암묵적 목표를 말함.\n                             \
    \     자율성: 시스템이 사람의 직접적인 개입 없이도 독립적으로 데이터를 학습하고 외부\n         인공지능시스템\n      \
    \                            환경을 판단하며 운영될 수 있는 것을 말함.\n          (AI system)\n\
    \                                  적응성: 초기 개발 후에도 지속적으로 발전할 수 있는 기계학습 기반 시스템의\n\
    \                                  특성으로, 배포 전후에 입력되는 데이터와 직접 상호작용하여 스스로 행동 방식을\n\
    \                                  수정할 수 있음을 의미. 입력되는 데이터는 입력하는 자(개발자, 이용자) 또는\n\
    \                                  입력방법을 불문함.\n                              \
    \    결과물: 시스템의 산출물로서, 과거와 현재의 데이터를 기반으로 미래상황 등을\n                           \
    \       추측하는 예측, 사용자의 선호도나 행동 패턴을 분석해 선택지를 제안하는 추천,\n                        \
    \          가장 높은 자율성을 가지고 시스템이 독립적으로 판단하여 실행하는 결정 등이 이에\n                    \
    \              해당함.\n          인공지능기술                 인공지능을 구현하기 위하여 필요한 하드웨어·소프트웨어\
    \ 기술 또는 그 활용 기술\n        (AI technology)          을 말함 (인공지능 기본법 제2조제3호).\n  \
    \                               사람의 생명, 신체의 안전 및 기본권에 중대한 영향을 미치거나 위험을 초래할 우\n\
    \                                 려가 있는 인공지능시스템 (인공지능 기본법 제2조제4호).\n         \
    \                         ① 에너지의 공급, ② 먹는물의 생산 공정, ③ 보건의료 제공·이용 체계 및 ④\n    \
    \    고영향 인공지능\n                                  의료기기, ⑤ 원자력시설의 안전한 관리·운영, ⑥ 범죄\
    \ 수사·체포 목적 생체인식정보\n       (high-impact AI)\n                                 \
    \ 분석·활용, ⑦ 채용 및 대출 심사, ⑧ 교통 수단·시설·체계의 주요한 작동·운영, ⑨\n                         \
    \         공공서비스 제공에 필요한 국가기관등의 의사결정, ⑩ 유아·초·중등교육에서의"
