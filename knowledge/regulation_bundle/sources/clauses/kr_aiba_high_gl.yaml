    \ 가능한 범위에서의 인공지능이 도출한 최종결과, 인공지능의 최종결과 도출에 활용된 주요 기준,\n인공지능의 개발·활용에 사용된 학습용 데이터의\
    \ 개요 등에 대한 설명 방안의 수립·시행\n\n    참조문서                                   설명\n   \
    \         05. 데이터의 활용을 위한 상세 정보 제공\n            05-1. 데이터의 명확한 이해와 활용을 지원하는\
    \ 상세한 정보를 제공하는가?\n     韓      05-2. 데이터의 출처는 기록 및 관리되고 있는가?\n            11:\
