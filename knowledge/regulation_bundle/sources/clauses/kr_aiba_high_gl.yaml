  heading: 'PDF p.29 ·  협력 방식:'
  text: ' 협력 방식:

    - 챗봇 대화 중 개인정보(이름, 연락처 등) 자동 마스킹 기능 도입.

    - 사용자 입력 데이터를 학습에 활용할 경우 별도 동의 절차 마련.



    5. 고객응대팀(CS팀)과의 협력

     역할: 사용자 불만 및 인공지능 오작동 사례 수집, 개선 피드백 제공.

     협력 방식:

    - 실제 상담 중 인공지능 오답 사례 수집 및 위험관리 전담조직에 리포트.

    - 고객 응답 기준이 충족되지 않는 경우 수작업 전환 프로세스 정의.



    6, 통합적 협업 결과

