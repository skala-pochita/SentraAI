- id: KR-AIBA-HIGH-GL:PAGE-044-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.44 · 3-1-2. 안전한 설계 및 개발                                            개발사업자
  text: "3-1-2. 안전한 설계 및 개발                                            개발사업자\n\n 목표\
    \     이용자 보호를 위해 인공지능을 안전하게 설계 및 개발해야 함.\n 설명     개발사업자는 인공지능의 안전성 확보를 위해 노력해야\
    \ 함.\n       - 안전성: 인공지능이 판단·예측한 결과로 시스템이 동작하거나 기능이 수행됐을 때 사람과 환경에 위험을\n     \
    \   줄 가능성이 완화 또는 제거된 상태 (출처: 신뢰할 수 있는 인공지능 개발안내서)\n       - 시스템 오류 혹은 오작동 발생 시\
    \ 안전하게 정지하거나 최소한의 기능만 유지할 수 있도록 기술적 조치를\n        마련할 수 있음.\n       - 위험 대응력을 향상시키기\
    \ 위해 ‘오류탐지’, ‘비상정지’ 기능 등을 포함할 수 있으며, 관련 내용은 4-1-2\n        ‘사람의 개입 방법’ 참고.\n \
    \       개발사업자는 인공지능의 견고성 확보를 위해 노력해야 함.\n       - 견고성: 인공지능이 외부의 간섭이나 극한적인 운영\
    \ 환경 등에서도 사용자가 의도한 수준의 성능 및\n         기능을 유지하는 상태 (출처: 신뢰할 수 있는 인공지능 개발안내서)\n\
    \       - 의도치 않은 입력으로 인한 오작동을 방지하기 위해 입력값 유효성 검증 등의 기술적 조치를 마련할 수 있음.\n      \
    \ - 악의적인 공격, 비정상 데이터 입력 등의 예측 불가능한 상황에 대응할 수 있도록 적대적 공격에 대한 방어\n        능력을 강화하기\
    \ 위해 노력해야 함.\n 참고     韓 신뢰할 수 있는 인공지능 개발안내서\n       - 세부요구사항 06-2. 데이터 공격에 대한\
    \ 방어 수단을 강구하였는가?\n       - 요구사항 10. 인공지능 모델 공격에 대한 방어 대책 수립\n       - 세부요구사항 10-1.\
    \ 모델 공격이 가능한 상황을 파악하였는가?\n       - 세부요구사항 10-2. 모델 공격에 대한 방어 수단을 강구하였는가?\n   \
    \     美 NIST AI RMF\n       - MANAGE 2.4: 목적 외 결과에 대한 대응을 위해 인공지능 시스템 대체, 해제\
    \ 또는 비활성화 메커니즘 마련\n        EU AI ACT\n       - 제13조: 인공지능 시스템의 의도된 목적, 성능, 위험\
    \ 등을 포함한 명확한 사용 지침 제공\n       - 제15조: 정확도 및 견고성을 위해 측정 방법 및 복원력 확보 방안 정의\n   \
    \    - 전문(recital) 27: 인공지능 시스템은 안전성, 투명성, 다양성 등을 고려하여 설계\n                  \
    \                                             사업자 구분\n자가점검    개발 단계에서 오류탐지 및\
    \ 비상정지 등 사람의 개입이 가능하도록 기술적 조치를              개발\n        마련하였는가?\n        인공지능\
    \ 모델 자체의 취약점, 학습 데이터 오염, 시스템 접근 등과 관련된 잠재적 보안         개발\n        위협 요소를 점검하고\
    \ 대응책을 마련하였는가?\n\n\n\n\n                                                     \
    \                   43"
