- id: KR-AIBA-HIGH-GL:PAGE-003-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.3 · 추진배경
  text: "추진배경\n\n\n2024년 12월 26일, 대한민국 국회는 '인공지능 발전과 신뢰 기반 조성 등에 관한 기본법'(이하 '인공지능\
    \ 기본법')을\n제정하였다. 이 법은 2026년 1월부터 시행될 예정이며, 인공지능(AI) 기술의 발전과 함께 국민의 안전과 기본권 보\n\
    호를 위한 법적 기반을 마련하고자 한다.\n\n\n이 중 인공지능 기본법 제34조(고영향 인공지능과 관련한 사업자의 책무)는 고영향 인공지능을\
    \ 제공하거나 이를 이\n용한 제품·서비스를 제공하는 사업자에게 다음과 같은 책무를 부과하고 있다:\n\n\n1. 위험관리방안의 수립·운영\n\
    2. 기술적으로 가능한 범위에서의 인공지능이 도출한 최종결과, 인공지능의 최종결과 도출에 활용된 주요 기준, 인공\n    지능의 개발·활용에\
    \ 사용된 학습용 데이터의 개요 등에 대한 설명 방안의 수립·시행\n3. 이용자 보호 방안의 수립·운영\n4. 고영향 인공지능에 대한 사람의\
    \ 관리·감독\n5. 안전성·신뢰성 확보를 위한 조치의 내용을 확인할 수 있는 문서의 작성과 보관\n6. 그 밖에 고영향 인공지능의 안전성·신뢰성\
    \ 확보를 위하여 위원회에서 심의·의결된 사항\n\n\n이러한 조치는 고영향 인공지능이 사람의 생명, 신체의 안전 및 기본권에 중대한 영향을\
    \ 미칠 수 있다는 점을 고려\n하여, 사업자가 자율적으로 위험을 관리하고, 이용자를 보호하며, 인공지능의 운영에 대한 책임을 명확히 하기\
    \ 위한\n것이다.\n\n\n과학기술정보통신부는 인공지능 기본법의 시행을 위한 하위법령 정비단을 출범시켰으며, 고영향 인공지능 사업자의\n\
    책무를 구체화하고 안내하기 위해 본 가이드라인을 마련하였고, 그 구성은 아래와 같다.\n\n\n(제1장 인공지능사업자 책무 이행 목적) 가이드라인의\
    \ 목적, 적용 방법, 주요 용어에 대한 설명.\n(제2장 인공지능사업자 책무 관련 조항) ‘인공지능 발전과 신뢰 기반 조성 등에 관한 기본법’\
    \ 제34조 책무를 정의하\n는 법조문에 대한 설명.\n(제3장 인공지능사업자 책무 조치사항) 사업자 책무 조치사항을 주제별로 나누어 설명.\n\
    \n\n본 가이드라인은 사업자들이 법적 의무를 명확히 이해하고 이행할 수 있도록 지원하며, 인공지능 기술의 안전성과\n신뢰성을 확보하는 데\
    \ 기여할 것으로 기대된다. 특히, 본 가이드라인에 포함된 기준과 예시는 사업자들이 자사의 고\n영향 인공지능에 대해 적절한 조치를 취하는\
    \ 데 도움이 될 것이다. 이를 통해, 인공지능 기술의 발전과 함께 국민의\n안전과 권리를 보호하는 균형 잡힌 정책이 실현될 것으로 전망된다.\n\
    \n\n\n\n2"
  condition: high_impact_ai
  assessable: true
  evidence_scope: finding
