- id: KR-AIBA-HIGH-GL:PAGE-019-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.19 · 오픈소스 모델 고려사항
  text: "오픈소스 모델 고려사항\n오픈소스 모델을 활용하는 사업자는 직접 모델을 개발하는 사업자와 아래와 같은 차이가 있다.\n\n 소주제\
    \ 번호                  직접 개발                           오픈소스 모델\n             인공지능\
    \ 수명주기 전 과정의 위험관리 로드맵         불확실한 모델에 대한 검증 및 보완 중심의 계\n     1-1-1   을 자체 수립할\
    \ 수 있으므로, 통제 중심의 계획       획이 바람직함. 필요시, 다른 모델로 신속히 전\n             수립이 가능함.  \
    \                       환할 수 있는 계획도 수립할 수 있음.\n             인공지능의 구조적 결함 등 모든\
    \ 내부 요인을         공지된 취약점 확인이 우선. 모델 카드나 커뮤\n     1-1-2\n             직접 전수 조사할\
    \ 수 있음.                  니티에 보고된 알려진 탈옥 패턴 등을 식별.\n                          \
    \                    블랙박스/그레이박스 테스트 위주. 내부 로직을\n             내부 파라미터 및 가중치 변화에\
    \ 따른 위험도를\n     1-1-3                                    100% 알기 어려우므로, 입출력 위주의\
    \ 평가\n             정밀 분석 가능.\n                                              (Red\
    \ Teaming)에 집중할 필요가 있음.\n             인공지능 모델 재학습 (Retraining)이나 가중치   필터링 시스템,\
    \ 프롬프트 엔지니어링, 파인튜닝\n     1-1-4\n             수정을 통한 근본적 해결 가능.               \
    \ 등으로 보완.\n                                              오픈소스 커뮤니티의 보안 패치 및 신규\
    \ 버전\n     1-1-5   자체 성과 지표를 바탕으로 정책 고도화.           업데이트 동향을 상시 모니터링하여 정책에 반\n\
    \                                              영하는 것이 바람직함.\n                \
    \                              모델 내부를 수정하기보다 '운영 및 관제'에 특\n             독립적인 검증팀을\
    \ 두어 개발자와 검증자를 분         화된 조직이 중요. 외부 모델의 업데이트나 라\n     1-2-1\n             리하는\
    \ 것이 이상적임.                     이선스 변경에 대응할 법무/기술 검토 인력이\n                    \
    \                          필요.\n             인공지능의 의사결정 로직을 직접 소유하고 있\n      \
    \                                        모델 원저작자가 공개한 모델 카드 및 기술 문\n     1-2-2\
    \   으므로 위험관련 정보 전달 내용을 구체적으로\n                                              서에\
    \ 의존하여 정보를 제공.\n             수립할 수 있음.\n                                     \
    \         법무팀은 오픈소스 라이선스 위반 여부를, 정보\n     1-2-3   사내 부서 간 협력이 핵심.            \
    \      보안팀은 외부 모델 도입에 따른 보안 취약점을\n                                           \
    \   중점적으로 검토하는 것이 바람직함.\n\n\n\n\n18"
