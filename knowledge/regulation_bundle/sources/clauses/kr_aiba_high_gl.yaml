  heading: PDF p.105 · 5        사람의 관리·감독
  text: "5        사람의 관리·감독\n\n\n사람의 개입 기준 및 방법\n인공지능이 의도한 목적에서 벗어난 방식으로 작동하거나 비정상적인\
    \ 결과를 도출하는 경우 등 사람의 개입이 필요\n한 상황에 대한 기준을 아래와 같이 정의한다.\n\n               개입 기준\
    \                예시 시나리오                        개입 방법\n\nAI 결과 신뢰도(confidence)가\
    \       채용 결과 신뢰도 0.62로 산출         결과 제공 시 “신뢰도 낮음” 알림을\n설정된 임계값 미만          \
    \         (임계값 0.80)                 제공하고, 신뢰도 점수 표출\n\n\nAI 도출 결과에 대한 근거 문장 \
    \          “평가 근거를 생성할 수 없음” 또는       근거 문장 미제공 처리 및 운영 담\n찾지 못함             \
    \           근거 문장 하이라이트 실패             당자에게 오류 메시지 표출\n\n특정 집단에 대한 결과 편차가 기준 \
    \         성별, 연령 등 특정 집단의 합격         해당 집단 결과를 일괄 재검토하고,\n초과                 \
    \          추천 비율 차이가 기준을 초과           공정성 점검 후 모델/기준 재조정\n\n\n정기적 점검\n인공지능에 발생할\
    \ 수 있는 문제를 예방하기 위한 정기적인 점검 계획 및 방안을 아래와 같이 정의한다.\n\n      점검명         주기     \
    \      목적               참조문서                   기록문서\n                        \
    \                    규정: AI 신뢰성 관리\n                         성별, 연령, 인종 등 집단\
    \    규정 v1.0               점검 대장: 공정성/편향성\n 공정성/편향성\n                  월 1회 \
    \  별 결과 편차 확인 및 편     (ID: REG-2026-003)    관리 대장 내 ‘점검대장’시트\n          평가\n \
    \                        향 위험 예방            공정성/편향성 관리 대장        (ID: RM-REF-0002)\n\
    \                                            (ID: RM-REF-0002)\n             \
    \                               규정: AI 신뢰성 관리\n                             \
    \               규정 v1.0\n                                                    \
    \              점검대장: 시스템\n 오류·장애 대응         분기별    오류 발생 시 경고·알림      (ID: REG-2026-003)\n\
    \                                                                  운영·모니터링 대장\n\
    \          점검       1회    기능의 정상 동작 확인       점검 절차: AI 시스템\n                \
    \                                                  (ID: RM-REF-0006)\n       \
    \                                     운영 절차서 v1.0\n                          \
    \                  (ID: SOP-2026-001)\n                                      \
    \      규정: AI 신뢰성 관리\n                                            규정 v1.0\n \
    \                        데이터 유출 및 오용 방지를                          로그 저장위치:\n\
    \  접근권한 및                                    (ID: REG-2026-003)\n            \
    \      월 1회   위한 접근 통제 및 로그                            (서버명: tf-korea_01)\n  \
    \    로그 점검                                 점검 절차: AI 시스템"
