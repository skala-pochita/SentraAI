- id: KR-AIBA-HIGH-GL:PAGE-015-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.15 · 2장 고영향 인공지능사업자 책무 관련 조항
  text: "2장 고영향 인공지능사업자 책무 관련 조항\n\n\n2.1 관련 법조항\n\n고영향 인공지능사업자(고영향 인공지능 또는 이를 이용한\
    \ 제품·서비스를 제공하는 인공지능사업자)는 인공지능 기본\n법에 따라 다음과 같은 책무를 부담한다.\n\n\n\n고지 의무\n제31조(인공지능\
    \ 투명성 확보 의무) ① 인공지능사업자는 고영향 인공지능이나 생성형 인공지능을 이용한 제품 또는\n서비스를 제공하려는 경우 제품 또는 서비스가\
    \ 해당 인공지능에 기반하여 운용된다는 사실을 이용자에게 사전에 고\n지하여야 한다.\n\n\n\n안전성·신뢰성 확보 조치\n제34조(고영향\
    \ 인공지능과 관련한 사업자의 책무) ① 인공지능사업자는 고영향 인공지능 또는 이를 이용한 제품·서\n비스를 제공하는 경우 고영향 인공지능의\
    \ 안전성·신뢰성을 확보하기 위하여 다음 각 호의 내용을 포함하는 조치를\n대통령령으로 정하는 바에 따라 이행하여야 한다.\n 1. 위험관리방안의\
    \ 수립·운영\n 2. 기술적으로 가능한 범위 내에서의 인공지능이 도출한 최종결과, 인공지능의 최종결과 도출에 활용된 주요 기\n 준, 인공지능의\
    \ 개발·활용에 사용된 학습용데이터의 개요 등에 대한 설명 방안의 수립·시행\n 3. 이용자 보호 방안의 수립·운영\n 4. 고영향 인공지능에\
    \ 대한 사람의 관리·감독\n 5. 안전성·신뢰성 확보를 위한 조치의 내용을 확인할 수 있는 문서의 작성과 보관\n 6. 그 밖에 고영향 인공지능의\
    \ 안전성·신뢰성 확보를 위하여 위원회에서 심의·의결된 사항\n② 과학기술정보통신부장관은 제1항 각 호에 따른 조치의 구체적인 사항을 정하여\
    \ 고시하고, 인공지능사업자에게 이\n를 준수하도록 권고할 수 있다.\n③ 인공지능사업자가 다른 법령에 따라 제1항 각 호에 준하는 조치를\
    \ 대통령령으로 정하는 바에 따라 이행한 경우\n에는 제1항에 따른 조치를 이행한 것으로 본다.\n\n\n\n\n14"
