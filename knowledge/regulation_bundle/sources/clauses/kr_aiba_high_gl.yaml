- id: KR-AIBA-HIGH-GL:PAGE-045-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.45 · 사례            인공지능 모델 공격 방어를 위한 모델 최적화 방안
  text: "사례            인공지능 모델 공격 방어를 위한 모델 최적화 방안\n\n     방어 대책                 \
    \                  설명 및 기법 예시                                  데이터 유형\n\n    \
    \                복잡한 신경망의 지식을 간단한 신경망으로 전이시키는 방법. 원본 모델의 확률\n     Defensive  \
    \                                                                          이미지\n\
    \                    분포를 얻어 증류(distillation) 모델을 훈련하면, 증류 모델은 원본 모델의 특성을\n   \
    \  Distillation                                                              \
    \           오디오\n                    보전하게 됨. 작업 수행 시 증류 모델을 활용하면 적대적 공격에 대응 가능.\n\
    \n      Gradient  대부분의 적대적 공격은 모델 추론 과정에서의 경사(gradient)를 보고 공격이 이\n Regularization\
    \ 루어지므로 모델의 경사가 출력으로 노출되는 것을 방지하는 것에 중점을 둠.\n                    - Gradient Regularization:\
    \ 모델의 경사를 일관된 형태로 유지(예: Bit Plane\n                      Feature Consistency (BPFC)\
    \ regularizer, Second-Order Adversarial\n      Gradient                      \
    \                                                      이미지\n                 \
    \     Regularizer (SOAR))\n      Masking                                     \
    \                                        오디오\n                    - Gradient masking:\
    \ 출력에 노이즈를 추가하거나, 학습 중에 특정 부분을 제\n                                           \
    \                                               텍스트\n                      거함으로써\
    \ 모델의 경사를 외부로부터 감춤(예: S2SNet)\n\n                    학습 모델의 불확실성을 다루기 위한 확률적인\
    \ 요소를 도입하는 네트워크. 이를\n     Stochastic\n                    통해 모델의 결정을 불확실하게 만들어\
    \ 적대적 사례에 대한 저항성을 향상 (예:\n      Network\n                    defensive dropout,\
    \ Random Self-Ensemble (RSE)).\n\n\n\n\n44"
