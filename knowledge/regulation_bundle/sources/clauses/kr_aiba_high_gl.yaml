  heading: PDF p.69 · 위험관리 활동
  text: "위험관리 활동\n주요 위험원에 대한 위험관리 할동은 아래와 같다.\n※ 본 표는 주요 위험원에 대한 위험관리 활동의 요약을 작성하는\
    \ 표이며, 상세 사항은 별도의 기록문서로 관리해야 함.\n\n      구분                             설명   \
    \                            기록문서\n             진단 보조의 안전성 (False Negative): AI가\
    \ 질병을 잘못 '없다'고  위험관리계획서:\n 주요 위험원\n             판단하여 환자에게 치명적인 오진이 발생할 위험.  \
    \                    (ID: XXX-XX-XXXX)\n             - 위험의 심각도\n             ※\
    \ 손실 금액, 생명/신체 안전 등을 고려하여 기업 내부적으로 결과 심각성\n               을 정의해야 함.\n        \
    \          결과               조건1            조건2\n              심각성(OR조건)      \
    \   (손실 금액(원))     (생명/신체 안전)\n                  5\n                  4\n    \
    \              3\n                  2\n                  1\n\n             - 위험의\
    \ 발생 가능성\n             ※ 실제 빈도, 동종/유사 제품·서비스 빈도를 고려하여 기업 내부적으로 발\n           \
    \    생 가능성을 정의해야 함.\n                 발생                조건1            조건2\n \
    \                                                                위험관리계획서:\n 위험도\
    \ 정의       가능성(OR조건)          (실제 빈도)     (동종/유사 제 ·\n                       \
    \                              품서비스 빈도)\n                  5                 \
    \                             (ID: XXX-XX-XXXX)\n                  4\n       \
    \           3\n                  2\n                  1\n\n             - 위험도(점수)\n\
    \             ※ 결과 심각성과 발생 가능성을 분석한 후, 이를 아래 표에 대입하여 위험\n               도를 정함.\n\
    \                    점수(score)                  위험도\n               (결과심각성 + 발생가능성)\n\
    \                     score >= 9               치명적 위험\n                     score\
    \ = 8                높은 위험\n                     score = 7                  위험\n\
    \                  5 <= score <= 6             낮은 위험\n                     score\
    \ <= 4              매우 낮은 위험\n     위험 식별   학습 데이터의 희귀 질병 사례 부족 여부 확인. 데이터에 대한\
    \ 모델  위험관리대장:\n     활동 예    의 불확실성 수준 식별 등                          (ID: XXX-XX-XXXX)\n\
    \ 위험 분석 및     감도(Sensitivity/Recall)를 핵심 지표로 설정하고, 인간 전문가 수준  위험관리대장:\n 평가 활동\
    \ 예     대비 성능 열위 여부 및 불확실성 임계치 평가 등                      (ID: XXX-XX-XXXX)\n \
    \    위험 처리   예측 불확실성이 높은 경우 AI 진단 결과 제공 거부 (Fallback) 처  위험관리대장:\n     활동 예 \
    \   리. 주기적인 임상 데이터 기반 모델 재검증 등                   (ID: XXX-XX-XXXX)\n\n\n\n\n68"
