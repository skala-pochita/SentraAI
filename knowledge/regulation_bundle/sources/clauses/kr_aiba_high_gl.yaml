- id: KR-AIBA-HIGH-GL:PAGE-022-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.22 · 1-1-3. 위험 분석 및 평가                                개발사업자       이용사업자
  text: "1-1-3. 위험 분석 및 평가                                개발사업자       이용사업자\n\n 목표\
    \      식별된 위험으로 인해 발생가능한 결과를 분석 및 평가해야 함.\n 설명      개발 및 이용사업자는 인공지능이 활용되는 영역의\
    \ 특성 및 활용 방법, 인공지능의 유형(생성형 또는\n         판별형) 등을 고려하여 위험의 심각도와 발생빈도를 분석 및 평가할 수\
    \ 있는 적절한 기준을 마련해야 함.\n        - 인공지능의 직접적인 혜택이나 피해를 받을 수 있는 이해관계자 집단을 식별하고, 그\
    \ 집단 간 편익과\n          위험의 불균형 가능성을 분석해야 하며, 조직, 개인, 커뮤니티, 집단, 사회 전반에 대한 결과를 포괄적으로\n\
    \          고려할 수 있음.\n         개발사업자는 소프트웨어 및 하드웨어 결함 외에 인공지능 특성에서 나타날 수 있는 위험\
    \ 요소(환각, 설명\n         미제공, 데이터 중독 등)를 분석 및 평가하기 위해 노력해야 함.\n         이용사업자는 인공지능의\
    \ 본래 활용 목적뿐만 아니라 장애, 오남용 등으로 인해 발생할 수 있는 위험을\n         분석 및 평가하기 위해 노력해야 함.\n\
    \ 참고      韓 신뢰할 수 있는 인공지능 개발안내서\n        - 요구사항 01. 인공지능 시스템에 대한 위험관리 계획 및 수행\n\
    \        - 세부요구사항 01-1. 인공지능 시스템 수명주기에 걸쳐 나타날 수 있는 위험 요소를 분석하였는가?\n         美\
    \ NIST AI RMF\n        - GOVERN 4.2: 설계·개발·배포·평가 단계에서 인공지능의 위험 및 잠재적 영향을 문서화 및\
    \ 의사소통 수행\n         EU AI ACT\n        - 제9조제2항제b호: 인공지능 시스템의 잠재적 위험 추정평가\n\
    \        - 제9조제2항제c호: 인공지능 시스템의 잠재적 위험 식별을 위해 모니터링 데이터 기반 위험 평가\n            \
    \                                                    사업자 구분\n자가점검     식별된 위험의\
    \ 심각도와 발생 빈도를 분석 및 평가하고 있는가?                    개발 이용\n         식별된 위험과 관련된 이해관계자에\
    \ 대해 정량적 또는 정성적 분석을 수행하기 위해          개발 이용\n         노력하고 있는가?\n         인공지능\
    \ 특성에서 나타날 수 있는 위험 요소(환각, 설명 미제공, 데이터 중독 등)를 분석      개발\n         및 평가하기 위해 노력하고\
    \ 있는가?\n         장애 및 오남용 등으로 발생할 수 있는 위험을 분석 및 평가하기 위해 노력하고 있는가?        이용\n\
    \n   사례       범용인공지능(GPAI) 3D 위험 매트릭스\n2024년   한국정보통신기술협회(TTA)에서        출판한  \
    \  ‘범용\n인공지능(GPAI) 위험 관리 프레임워크’에서는 범용인공지능과\n관련한 직관적인 위험 평가도구로써 3D 위험 매트릭스를\n제안함.\
    \ 각 축의 점수는 1~3점으로 부여되며 총 위험 점수는 이\n세 가지 점수를 곱한 값으로 계산됨.\n 정렬 원칙 기반 점수 (principle-based\
    \ score): 인공지능이\n 설정된 목표와 일치하게 작동하는지, 인간의 권리와 자율성을\n 존중하는지, 그리고 사회적 가치를 적절히 반영하는지를\
    \ 평가.\n 위험 발현 기간 기반 점수 (time-based score): 위험이 단기,\n 중기, 장기적으로 발생하는지에 따라 평가.\n\
     영향 범위 기반 점수 (scope-based score): 위험이 개인이나\n 소규모 그룹에만 영향을 주는 위험인지, 특정 지역이나\n\
    \ 집단까지 미치는 위험인지, 또는 전 세계에 광범위하게 미치는\n 위험인지를 기준으로 평가.\n\n\n                   \
    \                                                       21"
