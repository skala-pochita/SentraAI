    이용자 보호를 위한 권리 보장 활동은 아래와 같다.\n\n     활동 내용                       설명          \
    \          기록문서\n개인정보 활용      AI 학습 및 운영에 사용되는 개인정보의 활용 내역, 목적, 기간, 범\n     내역\
    \ 사전   위 등을 제품·서비스 이용 시작 전 사전에 명확히 고지하고, 필요한\n  명확 고지      경우 상세 동의를 받음\n 설명 요구\
