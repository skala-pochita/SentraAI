- id: KR-AIBA-HIGH-GL:PAGE-096-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.96 · 3      인공지능 설명방안
  text: "3      인공지능 설명방안\n\n\n투명성 및 설명가능성 확보 노력\n투명성 및 설명가능성 확보를 위한 인공지능 시스템 정보는\
    \ 아래와 같다.\n\n              1) 이력서·자기소개서 및 면접 영상 업로드 → 이력서·자기소개서 적합성 판단 → 영상\n\
    \                전처리(얼굴 검출/정렬) → 시선처리·자세 이상 추정(부정행위 방지) → 면접 발화 텍\n          \
    \      스트 분석 → 최종 지표 산출 → 채용 최종 의사결정 수행(합/불)\n   시스템 구조\n              2) 주요 처리\
    \ 단계 및 결과는 감사 추적(Audit Trail) 시스템에 기록\n              3) 운영 환경은 클라우드 기반 SaaS로 제공되며,\
    \ 고객사별 테넌트(Tenant) 분리 및 접근\n                통제 적용\n              1) 이력서·자기소개서를\
    \ 검토하여 지원자의 적합성 판단\n              2) 면접 영상의 프레임 단위 특징을 시간축으로 통합하여 참고 지표를 산출\n\
    \              3) AI 도출 결과와 함께 품질 점수 및 예측의 불확실성(Uncertainty) 수치(예: 신뢰 구간)\n 추론\
    \ 방식 및 결과     를 함께 제시.\n              4) AI 도출 결과로써 합격 여부가 제공되며, 참고 지표로 점수·등급\
    \ 제공\n              5) 결과 해석 가이드 및 금지 사용례를 제품 내 문서 형태로 제공(채용 AI 시스템 사용\n     \
    \           가이드 v1.3)\n               채용 AI 시스템 개요서 v1.2 (ID: REF-2026-001)\n\
    \      관련 문서\n               채용 AI 시스템 사용 가이드 v1.3 (ID: REF-2026-002)\n\n\n투명성\
    \ 및 설명가능성 확보를 위한 인공지능 모델 정보는 아래와 같다.\n\n 인공지능 모델명                영상 분석 AI 모델 \
    \                      버전   v1.0\n       목적                       영상에서 얼굴·시선·자세·행동\
    \ 특징 추출\n      모델 유형                  시계열 분류 모델(영상 분석) 및 행동 특징 추출\n          \
    \    1) 얼굴 검출/정렬: CNN 기반 얼굴 검출 및 랜드마크 추정\n              2) 행동/상태 추정: Vision Transformer\
    \ 기반 헹동 특징 임베딩 추출 및 다중 클래스\n      알고리즘\n                분류(예: 면접 중 자리비움, 외부자료\
    \ 검색의심 부정행위 등)\n              3) 시계열 통합: LSTM, Temporal CNN 기반 프레임 시퀀스 요약\n  \
    \            1) 결과 제공 시 참고 지표로써 소통 능력, 적합성 지표 등 제공\n 설명가능성 확보\n              2)\
    \ 사용 가이드를 통해 결과 해석 방법(지표 해석, 임계값 등) 및 금지 사용례 등 고지\n       방안\n              3)\
    \ 모델 주목 영역 시각화(Grad-CAM 기법 활용)\n               채용 AI 시스템 개요서 v1.2 (ID: REF-2026-001)\n\
    \      관련 문서\n               채용 AI 시스템 사용 가이드 v1.3 (ID: REF-2026-002)\n\n\n\n\
    \n                                                                       95"
