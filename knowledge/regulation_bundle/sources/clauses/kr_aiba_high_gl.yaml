- id: KR-AIBA-HIGH-GL:PAGE-047-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.47 · 3-2   인공지능 운영 단계
  text: "3-2   인공지능 운영 단계\n\n3-2-1. 모니터링 및 대응                                    \
    \              개발사업자   이용사업자\n\n     목표     인공지능 운영 중 발생할 수 있는 문제를 지속적으로 모니터링\
    \ 할 수 있는 기술적 기반을 마련하고, 안전\n            제약(사전설정된 목적·범위) 등의 대응 절차를 마련해야 함.\n   \
    \  설명     개발사업자는 문제를 지속적으로 모니터링 할 수 있는 기술적 기반을 마련하기 위해 노력해야 함.\n           -\
    \ 모니터링 결과가 저장되고 분석 가능하게 구성되도록 노력해야 함.\n            이용사업자는 인공지능이 설계된 기능 외의 사용으로\
    \ 확장되지 않도록, 안전 제약을 설정하고 대응 절차를\n            마련해야 함.\n            모니터링 및 대응 결과는\
    \ 1-1-5의 위험관리체계 개선에 이용할 수 있음.\n     참고     韓 신뢰할 수 있는 인공지능 개발안내서\n          \
    \ - 요구사항 13. 인공지능 시스템의 안전 모드 구현 및 문제발생 알림 절차 수립\n           - 세부요구사항 13-1. 공격,\
    \ 성능 저하 및 사회적 이슈 등의 문제 발생 시 대응 가능한 안전 모드를\n             적용하는가?\n           - 세부요구사항\
    \ 13-2. 인공지능 시스템에서 문제가 발생할 경우, 시스템은 이를 운영자에게 전달하는\n             기능을 수행하는가?\n \
    \           美 NIST AI RMF\n           - GOVERN 1.5: 위험관리 프로세스가 효과적으로 작동하도록 모니터링\
    \ 주기 및 조직의 역할 정의\n           - MANAGE 4: 인공지능 위험 대응 및 개선을 위해 모니터링, 사고 대응 등 지속적\
    \ 개선 활동\n            수립·이행·문서화\n            EU AI ACT\n           - 제26조제5항:\
    \ 운영 중 발생가능한 위험 대응을 위해 모니터링 수행 및 이상 발생 시 즉시 보고, 사용 중단\n           - 제72조: 지속적\
    \ 요구사항 준수 확인을 위해 모니터링 체계 수립 및 운영\n                                           \
    \                                사업자 구분\n 자가점검       인공지능 작동을 지속적으로 모니터링 하고 있는가?\
    \                                     이용\n            모니터링 결과가 저장되고 분석 가능하게 구성되어\
    \ 있는가?                               개발 이용\n            오류·부작용 발생 시 수동 또는 자동으로\
    \ 대응할 수 있는 체계가 마련되어 있는가?                 개발 이용\n            위험 상황 발생 시 담당자의 대응\
    \ 지침이 마련되어 있는가?                                이용\n\n      사례       AIOps(Artificial\
    \ Intelligence for IT Operations)\nAIOps(Artificial Intelligence for IT Operations)는\
    \ 인공지능과 머신러닝 기술을 IT 운영에 적용하여 시스템 성능을\n모니터링하고, 문제를 자동으로 감지·분석·해결하는 기술을 의미함. IT\
    \ 인프라가 복잡해지고 데이터가 폭발적으로\n증가하면서, 기존의 수동적인 운영 방식으로는 빠르게 대응하기 어려운 문제들을 AIOps가 자동화하고\
    \ 지능적으로\n처리해주는 것이 핵심.\n\n\n주요 구성 요소\n 데이터 수집(Data ingestion): 다양한 IT 자원에서 발생하는\
    \ 로그, 지표, 트레이스 등을 수집.\n 머신러닝 분석: 이상 탐지, 패턴 인식, 상관 분석 등을 수행.\n 자동화된 대응(Auto-remediation):\
    \ 문제 해결을 위한 경고 알림, 스크립트 실행, 작업 자동화 등 수행.\n\n\nAIOps의 장점\n 운영 효율 향상: 반복적인 수작업을\
    \ 자동화하여 운영 인력의 부담 감소.\n\n\n46"
