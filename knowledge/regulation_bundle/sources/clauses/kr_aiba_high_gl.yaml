- id: KR-AIBA-HIGH-GL:PAGE-037-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.37 · AI가 최종 결과 도출에 활용한      흉부 X-ray 이미지 내에서 특정 영역의 비정상적인 음영 패턴이
  text: "AI가 최종 결과 도출에 활용한      흉부 X-ray 이미지 내에서 특정 영역의 비정상적인 음영 패턴이\n     판단 근거\
    \    주요 기준, 패턴, 특징을 충분히     주요 근거로 활용되었으며, 이는 학습된 폐렴 관련 패턴과 90%\n            \
    \  명시                      이상의 연관성을 보입니다.\n      학습용     AI 모델 개발에 사용된 학습용   \
    \   Med-AI는 비식별화된 다수의 흉부 X-ray 이미지 및 관련 진료\n      데이터     데이터의 출처, 종류, 수량   \
    \     기록 수십만건을 학습하여 개발되었으며, 보다 자세한 내용은\n      개요      등을 설명                  \
    \ 홈페이지의 학습용데이터 정보를 참고해 주십시오.\n                                     본 진단 결과는 의료진의\
    \ 판단을 보조하기 위한 참고 정보입니다.\n                                     최종적인 의학적 결정은 전문\
    \ 의료진이 환자의 전체 임상 정보를\n      기술적     AI의 오류 가능성, 한계, 잠재적\n                    \
    \                 종합적으로 검토하여 내려야 합니다. 학습용데이터에 충분히\n      한계      위험 등을 고지\n  \
    \                                   포함되지 않은 희귀 질병 또는 비정형적 증상에 대해서는 진단\n      \
    \                               정확도가 낮을 수 있습니다.\n\n\n\n\n2. 주요 설명 요청에 대한 대응 시나리오\
    \ 및 답변 예시\n① AI의 결정 근거에 대한 설명 요청\n 이용자의 요청 내용: 인공지능이 환자에게 특정 질병 가능성을 높게 제시했는데,\
    \ 다른 검사 결과와 차이가 있습니다.\n     AI가 내린 결정의 근거를 설명해 주세요.\n 사업자 대응 절차\n- 요청 접수: 고객센터\
    \ 또는 회사 대표 번호를 통해 문의 접수.\n- 데이터 추출: 해당 진단 건의 AI 분석 데이터(원본 이미지, AI 분석 로그 등)을 추출하고\
    \ 보안 서버에 저장.\n- 내부 검토: AI 개발팀과 협의하여 AI가 해당 진단 결과를 도출한 주요 근거(Grad CAM, Attention\
    \ Map 등) 확인.\n- 설명보고서 작성: AI의 판단 근거 및 기술적 한계를 명확히 담아 설명 보고서 작성 .\n\n\n답변예시: <Med-AI\
    \ 진단 결과 신뢰성 설명 보고서>\n 접수번호: EX-2025-MM-DD-001\n 안녕하세요, ○○○님. 문의하신 Med-AI의 진단\
    \ 결과 신뢰성에 대해 상세히 답변드립니다.\n     진단 근거: Med-AI는 첨부된 흉부 X-ray 이미지 내의 비정형적 음영 패턴을\
    \ 주요 근거로 해당 결과를 도출했습니다.\n     이는 Med-AI가 학습한 폐암 확진 환자 데이터에서 공통적으로 발견되는 패턴과 높은\
    \ 유사성을 보였습니다.\n 기술적 역할 및 한계: Med-AI는 의료진의 진단을 보조하는 도구이며, 최종 진단을 대체하지 않습니다. AI는\
    \ 학습에\n     포함되지 않은 희귀 질병 또는 비정형적 증상에 대해 정확도가 낮아질 수 있는 기술적 한계를 가집니다. 다른 검사\n \
    \    결과와 차이가 있는 경우, AI의 분석 결과를 참고하되 환자의 개별적인 임상 정보와 종합하여 최종 판단을 내려주시는\n     것이\
    \ 중요합니다.\n\n\n② 학습용데이터의 투명성 및 편향성\n 이용자의 요청 내용: 귀사의 AI 제품·서비스의 학습용데이터에 대한 정보가\
    \ 필요합니다. 특정 인구 집단에 편향된\n     데이터로 학습되었을 가능성은 없나요?\n 사업자 대응 절차\n- 요청 접수: 홈페이지\
    \ 내 ‘결과 설명 요청’ 또는 회사 대표 번호를 통해 문의 접수\n- 데이터 정보 추출: AI 모델 학습에 사용된 데이터셋의 출처, 구성(인종,\
    \ 성별, 연령대 등), 수량 전처리 과정 등에 대한\n     정보를 추출\n- 보고서 작성: 데이터의 다양성 확보 노력과 함께 잠재적인\
    \ 편향성 위험을 투명하게 고지하는 보고서 작성\n\n\n\n36"
