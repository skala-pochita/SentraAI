- id: KR-AIBA-HIGH-GL:PAGE-056-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.56 · 4-1-2. 사람의 개입 방법                                         개발사업자           이용사업자
  text: "4-1-2. 사람의 개입 방법                                         개발사업자          \
    \ 이용사업자\n\n 목표      사람이 인공지능 동작에 개입할 수 있는 방법을 수립해야 함.\n 설명      개발 및 이용사업자는\
    \ 인공지능의 비정상 작동 시 적용할 수 있는 사람의 개입 방법을 마련해야 함.\n        - 사림의 개입 여부를 판단할 수 있도록 ‘오류\
    \ 탐지’ 기능이 마련되고, 이에 따라 사람이 직접 결과를 검증 및\n          수정해 보완할 수 있도록 해야 함.\n       \
    \ - 사람의 개입을 위해 인공지능을 즉각 중단할 수 있는 ‘비상정지’와 관련된 기능을 고려할 수 있음.\n 참고      韓 신뢰할 수\
    \ 있는 인공지능 개발안내서\n        - 요구사항 13. 인공지능 시스템의 안전 모드 구현 및 문제발생 알림 절차 수립\n     \
    \   - 세부요구사항 13-1. 공격, 성능 저하 및 사회적 이슈 등의 문제 발생 시 대응 가능한 안전 모드를\n          적용하는가?\n\
    \         美 NIST AI RMF\n        - GOVERN 1.7: 안전한 인공지능 시스템 폐기를 위해 관련 절차를 수립·이행\n\
    \        - MANAGE 2.4: 목적 외 결과에 대한 대응을 위해 인공지능 시스템 대체, 해제 또는 비활성화 메커니즘 마련\n  \
    \       EU AI ACT\n        - 제14조제4항제e호: 사람이 직접 제어할 수 있도록 중단 기능 등의 개입 절차를 포함하여\
    \ 시스템 구성\n                                                                   \
    \         사업자 구분\n자가점검     인공지능 시스템의 문제 (공격, 성능 저하 및 사회적 이슈 등) 발생시 사람이 직접 시스템을\
    \               개발 이용\n          제어하고 복구 할 수 있는 방법을 제공하고 있는가?\n\n   사례       Amazon\
    \ HITL(Human-in-the-loop) 절차\n미국 국가 보건 서비스(National Health Service, Business Services\
    \ Authority)는 Amazon A2I(Amazon\nAugmented AI)를 활용해 Human-in-the-Loop(HITL) 절차를\
    \ 도입함. 매월 약 5,400만 건에 달하는 종이 기반\n처방전과 다양한 문서에서 텍스트 및 구조화된 데이터를 자동으로 추출하고, 신뢰도가\
    \ 일정 기준 이하인 문서에\n대해서는 사람 검토자가 직접 내용을 확인하고 수정할 수 있도록 설계된 시스템을 운영하여 효율성이 향상됨.\n\n\
    \n\n\n                                                                       \
    \              55"
