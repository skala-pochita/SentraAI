- id: KR-AIBA-HIGH-GL:PAGE-035-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.35 · 2-3   설명 방안의 수립 및 시행
  text: "2-3   설명 방안의 수립 및 시행\n\n2-3-1. 설명 방안의 주요 내용 수립                          \
    \                   이용사업자\n\n     목표     2-1 및 2-2 에서 수립된 내용을 근거로 이용자가 요구하는 사항을\
    \ 설명하는 방안을 수립해야 함.\n     설명     이용사업자는 이용자를 대상으로 주요 내용을 설명할 때 인공지능이 내린 결정의 근거,\
    \ 인공지능의 특성\n            및 한계, 그리고 데이터의 활용 방식 등을 주요 설명 대상으로 제시해야 하며, 다음의 사항들을 고려할\
    \ 수\n            있음.\n           - 인공지능 공급자 정보: 명칭, 공인대리인, 연락처 등.\n          \
    \ - 인공지능의 일반 정보: 제품·서비스 목적, 기반 모델, 모델 명칭 등.\n           - 인공지능 도출한 결과 및 주요 기준:\
    \ 사업자의 투명성 및 설명가능성 확보 조치 (예: 적용된 XAI 기법) 등\n           - 알려진 제한 사항 또는 불확실성.\n\
    \           - 설명 수준: 실질적으로 권리에 영향을 미치는 결과에 대해서는 결정별로, 영향이 적은 출력에 대해서는\n      \
    \      코호트 또는 시스템 수준으로 설명 등.\n           - 설명 근거: 구조화된 추론 코드, 추론 요소(factor) 목록,\
    \ 재현가능한 추적 기록 등.\n           - 학습데이터 개요: 2-1-1의 내용 중 공개 가능한 사항.\n           \
    \ 이용사업자는 이용자를 대상으로 설명 방안을 수립하기 위해 아래 육하원칙을 고려할 수 있음.\n           - 누가: 오·남용하지\
    \ 않고 공식적인 절차를 통해 설명을 요청한 이용자에게 이용사업자가.\n           - 언제: 관련법 또는 이용사업자의 내규에 따라\
    \ (예: 서면 통지를 받은 60일 이내).\n           - 어디서: 인공지능에서 이용자가 설명을 요청한 기능 또는 모듈.\n  \
    \         - 무엇을: 개발사업자가 수립한 인공지능의 도출결과, 이에 활용된 주요 기준, 학습용 데이터의 개요 중\n        \
    \     공개가 가능한 사항.\n           - 어떻게: 전담부서 연락처 공개 등 이용자가 접근하기 용이한 방법으로 (세부 내용은\
    \ 2-3-2 참고).\n           - 왜: 이용사업자로서의 책무사항 수행을 위해.\n     참고     韓 신뢰할 수 있는 인공지능\
    \ 개발안내서\n           - 요구사항 11. 인공지능 모델 명세 및 추론 결과에 대한 설명 제공\n            美 NIST\
    \ AI RMF\n           - MEASURE 2.9: 책임 있는 인공지능 시스템 사용을 위해 인공지능 해석 기준 및 설명의 문서화\
    \ 및\n            접근성 확보\n            EU AI ACT\n           - 제13조제3항제b호의7: 인공지능\
    \ 출력 결과의 올바른 해석과 활용을 위해 이용자에게 필요한 정보 제공\n           - 제50조: 인공지능에 의해 생성된 콘텐츠 및\
    \ 상호작용 대상을 명확히 고지\n                                                          \
    \          사업자 구분\n 자가점검       설명 방안의 주요 내용을 수립하기 위해 내부적인 검토를 수행하였는가?       \
    \            이용\n            설명 방안을 수립하기 전에 관련된 육하원칙을 고려하였는가?               \
    \          이용\n\n\n\n\n34"
