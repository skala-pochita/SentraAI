    \ 특화 교육   ㈜기업B   분기별 1회\n                                      스템의 능력과 기술적 한계\
    \ 등에 대한 심화 교육 제공\n 인공지능 리터러시                            책임 있는 인공지능 활용을 위해 이해관계자에게\
