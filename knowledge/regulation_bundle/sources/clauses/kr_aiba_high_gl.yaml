- id: KR-AIBA-HIGH-GL:PAGE-024-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.24 · 1-1-5. 위험관리정책 개선                                 개발사업자        이용사업자
  text: "1-1-5. 위험관리정책 개선                                 개발사업자        이용사업자\n\n 목표\
    \     인공지능 수명주기 동안 위험관리정책을 조직 내외부 변화에 대응시키고 지속적으로 개선해야 함.\n 설명     개발 및 이용사업자는\
    \ 위험 처리 방안이 적용된 이후에 파급효과를 재평가함으로써 위험 요소가 실제로\n        제거, 방지, 완화되었는지 확인하고, 이에\
    \ 대한 피드백을 위험관리체계 개선에 사용해야 함.\n       - 이는 3-2-1의 모니터링 및 대응과 밀접하며, 대응 결과를 위험관리정책의\
    \ 개선에 이용할 수 있음.\n 참고     韓 신뢰할 수 있는 인공지능 개발안내서\n       - 요구사항 01. 인공지능 시스템의 위험\
    \ 관리 계획 및 수행\n       - 세부요구사항 01-2 위험 요소를 제거 및 방지하거나 영향을 완화하기 위한 방안을 마련하였는가?\n\
    \        美 NIST AI RMF\n       - MANAGE 1.1: 인공지능 시스템의 목적 달성 여부 판단을 위해 개발 또는\
    \ 배포 진행 여부를 결정\n       - MANAGE 4: 인공지능 위험 대응 및 개선을 위해 모니터링, 사고 대응 등 지속적 개선 활동\
    \ 수립·이행·문서화\n       - MANAGE 4.2 인공지능 시스템의 지속적인 개선을 위한 프로세스 정립 및 운영\n       \
    \ EU AI ACT\n       - 제9조제2항: 고위험 인공지능의 수명주기 동안 반복적 위험 관리 절차 및 정기 검토 절차 정의\n \
    \      - 제9조제6항: 고위험 인공지능이 의도된 목적대로 작동하는지 확인하기 위한 정기 테스트 설계\n                \
    \                                                 사업자 구분\n자가점검    위험 처리 방안 적용\
    \ 후, 해당 방안의 파급효과를 재평가하고 있는가?                  개발 이용\n        위험 처리 방안에 대한 피드백을\
    \ 위험관리정책 개선에 사용하고 있는가?                  개발 이용\n\n  사례       카카오 그룹의 책임있는 AI를 위한\
    \ 가이드라인\n카카오 그룹은 인공지능 기술 발전과 이에 따른 새로운 위험 요소에 대응하기 위해, AI 윤리원칙을 계층화하여 정비하고,\n\
    가이드라인과 체크리스트를 고도화하였음.\n\n\n\n\n                            (좌: 개정 전, 우: 개정 후)\n\
    \n\n\n\n                                                                     \
    \     23"
