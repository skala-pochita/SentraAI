- id: KR-AIBA-HIGH-GL:PAGE-059-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.59 · 3.5 안전성·신뢰성 확보를 위한 조치의 내용을 확인할 수 있는 문
  text: "3.5 안전성·신뢰성 확보를 위한 조치의 내용을 확인할 수 있는 문\n서의 작성과 보관\n\n관련 기술고시 조문\n제8조(문서의 작성ㆍ보관)\
    \ ① 사업자는 제4조부터 제7조까지의 사항을 문서로 작성하여 관리하여야 한다.\n② 사업자는 제1항에 따른 문서(이하 “안전신뢰문서”라 한다)를\
    \ 주기적으로 점검하고 최신의 기술, 방법 등이 적용될\n수 있도록 관리하여야 한다.\n③ 사업자는 안전신뢰문서에 포함된 각 조항의 내용을\
    \ 하나의 문서로 통합하여 작성하고 관리할 수 있다.\n\n\n\n타 법령의 유사 조치사항\n      법령          조항     \
    \                          내용\n 전자문서 및                      전자문서법은 문서의 진본성과 보존\
    \ 요건을 중심으로 전자문서의 법적 효력을\n              제 5 조 ( 전자문서\n     전자거래               \
    \     제도화한다. 이는 인공지능 기본법이 고영향 인공지능의 안전성과 신뢰성 확보\n              의 보관)\n      기본법\
    \                    조치를 문서로 기록 및 관리함함으로써 이를 강화하려는 취지와 부합한다.\n               \
    \              정보통신망 이용촉진 및 정보보호 등에 관한 법률 제64조는 정보통신 서비스\n                   \
    \          의 안전성과 신뢰성 확보를 위해 문서화 및 관리 의무를 규정하고, 과학기술정\n     정보통신망\n          \
    \                   보통신부장관에게 문서 열람을 요청할 수 있는 권한을 부여하고 있다. 인공지\n 이용촉진 및       제\
    \ 64 조 ( 자료의\n                             능 서비스 역시 정보통신 서비스의 한 유형이므로, 이러한 안전성과\
    \ 신뢰성 확\n정보보호 등에       제출 등)\n                             보 조치는 인공지능에도 동일하게 적용될\
    \ 수 있다. 특히 인공지능 기본법은 주\n     관한 법률\n                             기적인 점검, 기술의 최신화\
    \ 반영, 문서의 체계적 관리 등 사전 예방적 조치를\n                             중심으로 안전성과 신뢰성을 확보하는\
    \ 데 중점을 둔다.\n\n\n주요 내용\n본 절의 사업자 책무사항 주요 내용을 주제별로 분류하면 아래와 같다. 본 책무는 인공지능사업자에\
    \ 대하여 추가적\n인 안전성·신뢰성 확보 조치에 대한 의무를 부여하는 것은 아니며, 새로운 조치의무를 부과하기 위해서는 인공지능\n기본법\
    \ 제34조제1항제6호에 따라 위원회의 심의·의결 절차를 거쳐야 한다.\n\n               책무사항               \
    \           주제                소주제\n5. 안전성·신뢰성 확보를 위한 조치의 내용을\n               \
    \                      5-1. 문서화 및 관리 방안   5-1-1. 문서화 공통사항\n      확인할 수 있는 문서의\
    \ 작성과 보관\n\n\n오픈소스 모델 고려사항\n오픈소스 모델을 활용하는 사업자는 직접 모델을 개발하는 사업자와 아래와 같은 차이가 있다.\n\
    \n 소주제 번호                      직접 개발                      오픈소스 모델\n          \
    \                                     외부에서 제공된 모델 정보와 사업자가 추가로\n             모든\
    \ 문서가 사내 보안 표준에 따라 일관된 체\n     5-1-1                                     작성한 내용이\
    \ 서로 모순되지 않도록 일관성을\n             계로 관리되기 용이함.\n                              \
    \                 유지하는 것이 중요함.\n\n\n\n\n58"
