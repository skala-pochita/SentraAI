- id: KR-AIBA-HIGH-GL:PAGE-036-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.36 · 사례        인공지능 제품·서비스의 설명 매뉴얼 수립 및 대응(예시)
  text: "사례        인공지능 제품·서비스의 설명 매뉴얼 수립 및 대응(예시)\n1. ‘의료 AI 제품·서비스’의 설명 매뉴얼\n① 목적\n\
     인공지능에 대한 이용자의 이해와 신뢰 증진 및 의사 결정의 투명성 확보.\n 설명 요청에 대한 신속하고 일관된 대응을 위한 내부 운영\
    \ 절차를 마련하고, 인공지능 기본법에 따른 고영향 AI\n 사업자의 책무 이행을 지원.\n\n\n② 적용 범위\n ‘의료 AI 제품·서비스’에\
    \ 대한 주요 이용자 설명 요청 건.\n 인공지능의 결과물에 대한 설명, 기술적 한계 문의, 학습 데이터 관련 질의 등 인공지능의 주요 내용에\
    \ 대한 핵심\n 유형의 설명 요청을 포함.\n\n\n③ 담당 조직 및 역할\n 고객지원부 및 인공지능 제품·서비스부 (필요 시 경영지원팀,\
    \ 법률/윤리팀 등 타 부서에 자문 또는 업무 협조 가능).\n- 인공지능 제품·서비스부: AI개발팀, AI데이터팀, AI기획팀으로 구성된\
    \ 인공지능 제품·서비스 전담 조직.\n- 고객지원팀: CS전담팀.\n 책임자: 인공지능 제품·서비스부장 또는 이에 준하는 담당자.\n\
    \ 실무 담당자: 인공지능 제품·서비스부 및 고객지원팀 소속 직원(요청 접수, 보고서 작성, 문의 대응 등).\n\n\n④ 설명 요청 대응\
    \ 절차\n\n       단계            담당                         주요 활동\n              \
    \                  고객센터 또는 전화 문의를 통한 인공지능 설명 요청 접수\n  요청 접수 및           CS전담팀\n\
    \                                해당 요청을 ‘고영향 AI 설명요청’으로 분류하고, 인공지능\n   초기 분류\
    \           실무 담당자\n                                 제품·서비스부 실무 담당자에게 전송\n   \
    \                인공지능         이용자가 요청한 정보에 대한 응답을 포함하여 설명자료 초안 작성\n   상세 자료\n\
    \                제품·서비스부 실무      이용자가 이해하기 쉬운 자유형식(보고서, 메일 등)으로 설명하기\n  준비 및\
    \ 협의\n                    담당자         위해 노력\n                 법률/윤리팀 및\n     \
    \              인공지능         작성한 설명자료는 인공지능 제품·서비스부의 내부 검토를 거침\n설명자료 최종 검토\n \
    \               제품·서비스부 실무      영업비밀보호를 위해 법률팀에게 협조를 요청할 수 있음\n             \
    \       담당자\n                   CS전담팀        최종 설명자료를 메일, 전화 등을 통해 설명제공을 요청한\n\
    \  이용자에 전달\n                  실무 담당자         이용자에게 전달\n                    CS전담팀\
    \       이용자로부터 설명 내용의 이해도, 만족도 등에 대한 피드백을\n 사후 관리 및 개선\n                   실무\
    \ 담당자       수집\n\n⑤ 설명 보고서 작성 가이드라인\n\n   항목             작성내용                \
    \           예시\n                                흉부 X-ray 이미지를 분석하여 폐렴 징후를 분류하고\
    \ 의료진의\n제품·서비스      제품·서비스 목적, 기반 모델\n                                진단 과정을 보조합니다.\n\
    \  개요        등 제품·서비스 일반 내용\n                                기반 모델: 비전 기반의 딥러닝\
    \ 모델 활용\n            AI가 도출한 최종 결과 및     AI 분석 결과, 환자에게 섬유화 진행 패턴이 발견되어, 폐렴\n\
    \ 결과 요약\n            핵심 근거를 간결하게 요약      가능성은 90% 이상인 것으로 분석되었습니다.\n\n\n     \
    \                                                                  35"
