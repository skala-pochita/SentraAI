- id: KR-AIBA-HIGH-GL:PAGE-040-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.40 · 2-3-2. 설명 방안의 시행                                                   이용사업자
  text: "2-3-2. 설명 방안의 시행                                                   이용사업자\n\
    \n 목표         수립된 설명 방안을 근거로 이용자에게 이를 전달해야 함.\n 설명         이용사업자는 이용자를 대상으로\
    \ 설명 방안을 시행하기 위해 아래 절차를 고려할 수 있음.\n           - 이용자 요청사항 파악: 이용자가 설명을 필요로 하는 부분을\
    \ 파악하고 기존 FAQ 등에 있는지 파악.\n           - 설명자료 작성 및 검토: 이용자 눈높이에 맞춰 콘텐츠를 작성하기 위해\
    \ 용어를 통일하고 이미지와 도식을\n            활용하며, 작성 후 관련 부서에게 검토를 요청.\n           - 설명 방안\
    \ 선정: 이메일, Q&A게시판, 홈페이지 공지 등.\n           - 전달: 선정된 설명 방안을 통해 이용자에게 전달.\n    \
    \       - 개선: 이용자 피드백 및 제품·서비스 갱신에 따라 설명 내부 자료를 최신 상태로 유지.\n 참고         韓 신뢰할\
    \ 수 있는 인공지능 개발안내서\n           - 요구사항 11. 인공지능 모델 명세 및 추론 결과에 대한 설명 제공\n      \
    \      美 NIST AI RMF\n           - MEASURE 2.9: 책임 있는 인공지능 시스템 사용을 위해 인공지능 해석\
    \ 기준 및 설명의 문서화 및\n            접근성 확보\n            EU AI ACT\n           - 제13조제3항제b호의7:\
    \ 인공지능 출력 결과의 올바른 해석과 활용을 위해 이용자에게 필요한 정보 제공\n           - 제50조: 인공지능에 의해 생성된\
    \ 콘텐츠 및 상호작용 대상을 명확히 고지\n                                                    \
    \                  사업자 구분\n자가점검        설명 방안을 시행하기 위한 절차가 마련되어 있고 이를 따라서 시행하였는가?\
    \                    이용\n            최신 정보는 지속적으로 갱신 및 제공되고 있는가?            \
    \                      이용\n\n   사례          이용자에게 설명 방안 시행 절차 및 예시\n수립된 설명 방안이\
    \ 실제 제품·서비스에 성공적으로 적용되고, 이용자에게 효과적으로 전달되기 위해 아래의 절차와\n내용으로 시행할 수 있음.\n\n     \
    \ 절차                     주요 활동                         사례\n                설명\
    \ 방안에 맞춰 제품·서비스 인터페이스에 AI 챗봇의 초기 화면에 \"저는 AI 챗봇입니다. 부정확한\n UI/UX 적용\n        \
    \        설명 요소를 직접 구현                  정보를 제공할 수 있습니다.\"라는 문구를 표시\n\n        \
    \        FAQ, 가이드 문서, 블로그 글 등 상세 설명 \"AI 추천 시스템, 어떻게 작동하나요?\"와 같은 제목의\n 콘텐츠 제작\n\
    \                콘텐츠를 제작하고 배포                  블로그 게시글을 통해 원리를 쉽게 설명\n\n     \
    \           개발, 마케팅, 고객 지원 등 관련 팀에 설명 고객 지원팀 교육: \"고객이 'AI가 왜 이런 결과를\n 내부 교육 시행\
    \ 방안의 중요성을 교육하고, 질의응답 대응 냈나요?'라고 물을 때, 어떤 근거를 바탕으로 답변해야\n                매뉴얼 공유\
    \                        하는가?\"에 대한 매뉴얼을 제공\n\n 피드백 수집 및 이용자로부터             설명에\
    \     대한   피드백을 설명 팝업 하단에 \"이 설명이 도움이 되었나요?\n      분석        정기적으로 수집하고 분석하여 개선점\
    \ 모색 (예/아니오)\" 버튼을 추가하여 유용성 평가 및 개선\n\n                                      \
    \        AI 모델의 학습 데이터가 갱신되면, \"이 챗봇은\n   정기적          AI 모델의 업데이트나 새로운 기능이 추가될\n\
    \                                              2024년 9월까지의 데이터를 기반으로 합니다.\"와\n\
    \  업데이트          때마다 설명 내용과 방식 최신화"
