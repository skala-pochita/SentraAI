- id: KR-AIBA-HIGH-GL:PAGE-103-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.103 · 모니터링 및 대응 활동
  text: "모니터링 및 대응 활동\n이용자 보호를 위한 모니터링 및 대응 활동은 아래와 같다.\n\n  활동 내용               \
    \        설명                            기록문서\n                                \
    \                       품질 기록 로그\n 품질 경고 및\n           입력 데이터 품질 저하 시, 운영 담당자에게\
    \ 경고 및 알림이 발생함       (서버명: tf-korea_01)\n      알림\n                          \
    \                             (폴더명: ai_qa-log)\n                             \
    \                          접근 탐지 로그\n           데이터접근 이상징후(대량 다운로드, 비인가 접속)을\
    \ 탐지하고 계정\n  접근 탐지                                                (서버명: tf-korea_01)\n\
    \           잠금·접근 차단 등 대응 수행\n                                               \
    \        (폴더명: ai_acs-log)\n                                                 \
    \      모델 버전 관리대장\n                                                       (ID:\
    \ RM-REF-0003)\n           이용자 피드백 반영, AI 모델 업데이트, UI/UX 업데이트 등 업데이    시스템 버전\
    \ 관리대장\n정기 업데이트\n           트 사항 정기 업데이트(분기별 1회)                        (ID: RM-REF-0004)\n\
    \                                                       데이터 관리대장\n          \
    \                                             (ID: RM-REF-0005)\n\n\n        \
    \                  모니터링 및 대응 체계 설명\n 1) 품질 경고 및 알림\n 입력 데이터 품질 저하 감지 시 운영 담당자에게\
    \ 경고·알림을 즉시 전파하고, 품질 임계값 기준에 따라 결과\n 제공 제한 또는 재검토 절차를 수행한다. 반복 발생 항목은 원인 분석을 통해\
    \ 입력 가이드·설정값을 개선하며,\n 품질 저하 이력과 조치 결과는 처리 대장에 기록·관리한다.\n\n\n 2) 접근 탐지(이상징후 탐지\
    \ 및 차단)\n 데이터 접근 이상징후(대량 다운로드, 비인가 접속 등) 발생 여부를 상시 점검하고, 이상 탐지 시 계정 잠금,\n 접근 차단\
    \ 등 즉시 대응을 수행한다. 접근 권한은 역할 기반으로 최소화하고 변경·부여 이력을 관리하며, 접속\n 로그는 보관·점검하여 사고 발생 시\
    \ 추적 가능하도록 관리한다.\n\n\n 3) 정기 업데이트\n 이용자 피드백과 운영 이슈를 반영하여 분기 1회 업데이트 계획을 수립하고,\
    \ 모델 성능 개선, 기능 보완,\n UI/UX 개선 항목을 우선순위로 적용한다. 배포 전 시험·평가 및 승인 절차를 통해 안정성을 확인하며,\
    \ 배포 후\n 모니터링을 통해 이상 발생 시 개선 또는 롤백 조치를 수행한다.\n\n\n\n\n102"
