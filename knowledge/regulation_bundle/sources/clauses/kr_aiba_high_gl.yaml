- id: KR-AIBA-HIGH-GL:PAGE-004-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.4 · 고영향 인공지능사업자
  text: "고영향 인공지능사업자\n1장\n        책무 이행 목적\n\n1.1 가이드라인 목적\n\n최근 인공지능의 발전과 함께, 의료,\
    \ 금융, 교육, 공공행정 등 다양한 분야에서 고영향 인공지능이 도입되고 있으며,\n이에 따라 인공지능의 신뢰성 확보와 윤리적 문제 해결이\
    \ 필수적인 정책 과제로 떠오르고 있다. 특히, 인공지능 기\n본법 제34조는 고영향 인공지능사업자에게 위험관리, 설명가능성, 이용자 보호,\
    \ 인간 감독, 문서화 등의 책임을 부과\n하고 있다. 본 가이드라인은 인공지능 기본법 제34조 및 관련 시행령·고시를 설명하여 고영향 인공지능의\
    \ 안전성과\n신뢰성을 확보하고, 이를 통해 인공지능 기술이 사회 전반에 걸쳐 책임감 있고 지속 가능한 방식으로 활용될 수 있\n도록 하기\
    \ 위해 마련되었다.\n\n\n본 가이드라인의 목적은 다음과 같이 정리될 수 있다.\n\n\n첫째, 고영향 인공지능사업자가 준수해야 할 안전성과\
    \ 신뢰성 확보 기준을 제시함으로써, 법·제도의 실효성을 강화하\n는 것이다. 즉, 가이드라인 자체는 법적 구속력은 없으나 법상 의무 이행을\
    \ 지원하기 위한 목적으로 제작되었다. 인\n공지능 기본법 제34조에서 규정하는 사업자의 책무는 개념적 수준에서 제시되어 있어, 실제 인공지능\
    \ 제품·서비스를\n개발·운영하는 기업 및 기관들이 이를 어떻게 적용해야 하는지에 대한 구체적인 지침이 필요한 상황이다. 본 가이드\n라인은\
    \ 고영향 인공지능의 안전성·신뢰성을 보장하기 위한 구체적인 기준과 절차를 제공함으로써, 사업자들이 이를\n효과적으로 이행할 수 있도록 돕고,\
    \ 정부의 규제 이행을 지원하는 도구로 활용될 수 있도록 한다.\n\n\n둘째, 인공지능이 신뢰할 수 있고 안전한 방식으로 운영될 수 있도록\
    \ 기술적 원칙을 소개하는 것이다. 인공지능은\n대량의 데이터를 분석하고 의사결정을 자동화하는 과정에서 투명성 부족, 설명 불가능성 등의 문제를\
    \ 초래할 가능성\n이 있다. 이러한 문제들은 사회적 불평등을 심화시키거나, 인공지능에 대한 신뢰 저하로 이어질 수 있다. 따라서 본\n가이드라인은\
    \ 인공지능의 안전성과 신뢰성을 확보하기 위한 원칙과 기술적·제도적 구현 방안을 소개하여, 인공지능이\n신뢰받을 수 있도록 지원하는 것을 목적으로\
    \ 한다.\n\n\n결론적으로, 본 가이드라인은 고영향 인공지능 사업자가 안전성과 신뢰성을 확보할 수 있도록 실효성있는 안내를 제\n공함으로써,\
    \ 인공지능 기술이 윤리적이고 책임감 있는 방식으로 발전할 수 있도록 지원하는 것을 최우선적인 목표로\n한다. 이를 통해 국내 인공지능 산업이\
    \ 글로벌 경쟁력을 갖추고 지속 가능한 방식으로 성장할 수 있도록 돕는 동시\n에, 인공지능 기술이 사회적 신뢰를 확보하며 널리 확산될 수\
    \ 있는 환경을 조성할 것이다.\n\n\n\n\n                                                  \
    \             3"
