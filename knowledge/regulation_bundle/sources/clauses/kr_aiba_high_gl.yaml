    \ 불편함이 있었나요?”(Yes/No)    VoC 통계 리포트\n서비스 피드백\n           및 기타 의견(주관식) 입력 기능을\
    \ 제공하여 즉시 피드백 수집          (ID: RM-REF-0006)\n                                \
    \                       고객사 설문 결과서\n 고객사 정기    이용사업자를 대상으로 사용성, 결과 신뢰도 운영상 불편사항을\
    \ 정기        (폴더명: voc_results)\n   설문      설문 및 인터뷰로 점검                      \
    \          개선 조치 이력\n                                                       (ID:\
    \ RM-REF-0006)\n  위험관리     외부 전문가 및 경영진이 참여하는 위험관리 위원회를 통해 주요 리        위원회 회의록\n\
    \ 위원회 운영    스크, 공정성 이슈, 개선 필요사항 검토 (연 2회)               (ID: RM-REF-0008)\n\n\n\
    이용자 권리 보장 활동\n이용자 보호를 위한 권리 보장 활동은 아래와 같다.\n\n 활동 내용                        설명\
    \                             기록문서\n                                         \
    \              개인정보 처리방침\n개인정보 활용    AI 학습 및 운영에 사용되는 개인정보의 활용 내역, 목적, 기간, 범\
    \     (ID: REG-2026-002)\n 내역 사전     위 등을 제품·서비스 이용 시작 전 사전에 명확히 고지하고, 필요한   \
    \    개인정보 수집·이용\n 명확 고지     경우 상세 동의를 받음                                동의서\n\
    \                                                       (ID: REG-2026-002)\n \
    \                                                      이의제기 처리 절차서\n설명 요구 및\n\
    \           이용자에게 AI 도출 결과에 대한 설명 요구 권리를 부여하며, 이의       (ID: SOP-2026-002)\n 이의\
    \ 제기\n           제기 시 인간 전문가의 재검토를 받을 수 있는 명확한 절차를 보장        고객 이의제기 처리 이력\n\
    \ 권리 부여\n                                                       (ID: RM-REF-0006)\n\
    안전한 사용을                                                채용 AI 시스템 사용\n       \
    \    시스템 기능 설명, AI 도출 결과의 올바른 활용 범위, 금지 사용례\n 위한 정책                          \
    \                       가이드 v1.3\n           (단독 탈락 근거 금지) 등을 명시한 사용 가이드 제공\n\
    마련 및 안내                                                (ID: REF-2026-002)\n  \
    \                                                     개인정보 처리 대장\n          \
    \                                             (ID: RM-REF-0009)\n 정보주체 권리   학습데이터에\
    \ 사용된 개인정보에 대해 열람·정정·삭제·처리정지 등을 요\n                                          \
    \             처리 결과 통지서\n대응 체계 운영   청할 수 있도록 접수 채널을 마련하고 법정 기한 내 처리 절차 운영\n \
    \                                                      (서버명: tf-korea_02)\n  \
