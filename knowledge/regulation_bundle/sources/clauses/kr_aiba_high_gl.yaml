  heading: PDF p.73 · 4       이용자 보호
  text: "4       이용자 보호\n\n\n데이터 수집 및 관리 활동\n이용자 보호를 위한 데이터 관리 활동은 아래와 같다 (학습데이터 개요에\
    \ 대한 내용은 2절 참조).\n\n 데이터셋 ID        법적 준수 요구사항                         수집 목적\n\
    \                                 사용자 개인의 선호도와 행동 패턴(구매 기록, 시청 이력, 클릭 로\n D2005001\
    \         개인정보 포함\n                                 그)을 분석하여 맞춤형 상품/콘텐츠 추천\n \
    \             저작권 보호를 받는 창작물\n D2005002                        감성 분석 모델 훈련\n \
    \              (라이선스 ID: XXXX)\n\n\n\n\n                       데이터 유출 및 오용 방지를\
    \ 위한 기술 적용 설명\n예1) 당사 AI 모델 학습 데이터에 포함된 고객의 고유 식별 정보(이름, 주민등록번호)는 수집 즉시 '개인정보\n\
    비식별 조치 가이드라인 (ID: XXXX)'에 따라 가명처리를 적용하여 원본 정보와 분리 보관합니다. 가명처리는\n암호화 해시 함수(Cryptographic\
    \ Hash Function)를 이용하여 원본 값을 복원할 수 없도록 변환하는 방식으로\n이루어지며, 이를 통해 특정 개인을 식별할 수 없는\
    \ 가명정보 상태에서 AI 학습이 진행됩니다. 원본 식별자와\n가명정보의 연결 정보는 별도의 보안 구역에 분리 저장 및 접근 통제되어 데이터\
    \ 유출 시에도 개인정보의 오용\n위험을 최소화합니다.\n\n\n예2) 당사(위탁사)는 AI 학습 데이터의 유출 및 오용 방지를 위해 개인정보가\
    \ 포함된 데이터 처리 업무를 외부에\n위탁하는 경우, 해당 수탁사(외주 업체)가 ISMS-P인증을 획득했는지 필수적으로 확인하고 있습니다.\
    \ 인증이\n확인된 수탁사에 대해서만 계약을 체결하며, 계약 시 데이터의 처리 목적, 기술적/관리적 보호 조치 이행\n사항(암호화, 접근 통제\
    \ 등)을 개인정보보호법에 근거하여 명확히 문서화합니다 (ID: XXXX). 또한, 계약 기간\n동안 수탁사의 보호 조치 이행 여부를 정기적으로\
    \ 점검 및 감사하여, 데이터 처리 과정 전반에 걸친 유출 및\n오용 위험을 법적/기술적으로 관리하고 있습니다.\n\n\n\n\n인공지능의\
    \ 안전성 및 견고성 확보 활동\n이용자 보호를 위한 안전성 및 견고성 확보 활동은 아래와 같다.\n\n     활동 내용         \
    \               설명                         기록문서\n              AI 모델의 출력값이 사전에\
    \ 정의된 안전 임계값(Safety Threshold)\n 제어권 이양       을 지속적으로 초과하거나, 외부 감시 시스템(인간 모니터링\
    \ 또는 보\n              조 AI)이 통제 불능 상태를 감지했을 때 제어권을 인간에게 넘김\n              모델이\
    \ 미세한 노이즈에도 강건하게 예측할 수 있도록 학습하여, 실\n 적대적 훈련\n              제 공격에 대한 견고성을 높임\n\n\
    \n\n\n72"
