- id: KR-AIBA-HIGH-GL:PAGE-039-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.39 · 사례      Notion Labs의 AI 설명 사례
  text: "사례      Notion Labs의 AI 설명 사례\n Notion AI는 사용자가 생산성을 높이기 위해 인공지능을 직접 활용하는\
    \ 도구임.\n Notion AI는 사용자가 콘텐츠를 생성하거나 수정할 때, AI가 생성한 결과물에 대해 명확한 설명과 책임 한계를 고지\n\
    \ - 작동 방식 설명: 도움말 센터를 통해 ‘Notion AI는 사용자가 입력한 텍스트, 페이지에 있는 기존 콘텐츠, 연결된 웹\n   \
    \  검색 결과 등을 바탕으로 작동한다’고 명시하여 AI가 무엇을 기반으로 결과를 도출하는지 설명\n - 기술적 한계 고지: ‘Notion\
    \ AI는 최근 6~12개월 내 발생한 사건에 대해 학습되어 있지 않을 수 있으므로, 부정확하거나\n     오래된 내용을 담고 있을 수 있다’고\
    \ 명확히 경고하여 AI의 한계를 투명하게 밝히고, 사용자가 AI 결과물을 그대로\n     신뢰하지 않도록 유도\n 사용자가 필요한 시점에\
    \ 즉각적으로 설명을 제공하는 인라인(In-line) 방식을 채택하고 있으며, 사용자가 별도의\n     페이지나 매뉴얼을 찾아볼 필요 없이,\
    \ AI 기능 사용 직후에 관련 정보를 바로 얻을 수 있도록 설계됨\n - 결과 생성 직후: AI가 텍스트를 생성하거나 요약한 후, 해당 내용\
    \ 아래에 ‘AI가 생성한 콘텐츠’임을 명시\n - 사용자 질의 시: 사용자가 AI 결과물에 대해 추가 질문을 하면, 시스템 내에서 바로 대화를\
    \ 이어나가며 답변을 보완하여\n     AI가 제공한 결과에 대한 궁금증을 즉시 해결\n 사용자가 AI의 전반적인 작동 원리를 심층적으로\
    \ 이해할 수 있도록 공식 문서와 블로그를 통해 다양한 정보를 제공\n - 보안 및 개인정보 보호: ‘Notion AI 보안 및 개인정보 보호\
    \ 관행’ 페이지를 통해 고객 데이터가 AI 모델 학습에\n     사용되지 않는다는 점을 명확히 설명하여 이용자의 불안감을 해소하고 신뢰를\
    \ 확보\n - 공개 블로그: 노션 블로그에 AI 모델 개발 배경, 기술적 의사결정 과정 등을 담은 글을 게시하여, 단순히 기능적\n   \
    \  설명뿐만 아니라 기술 철학을 공유하며 투명성을 강화\n\n\n\n\n                                ▲ Notion\
    \ AI의 FAQ 페이지 운영 사례\n\n\n\n\n38"
