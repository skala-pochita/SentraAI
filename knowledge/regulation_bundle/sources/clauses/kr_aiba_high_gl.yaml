- id: KR-AIBA-HIGH-GL:PAGE-013-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.13 · 1.4 FAQ
  text: "1.4 FAQ\n\nQ '고영향 인공지능'에 해당하는지 여부가 불분명할 때는 어떻게 확인해야 하나?\nA    사업자는 ‘고영향 인공지능\
    \ 판단 가이드라인’(한국지능정보사회진흥원)을 통해 스스로 사전에 검토해야 하며, 판\n     단이 어려운 경우 과학기술정보통신부 장관에게\
    \ 확인을 요청할 수 있다.\n\n\nQ 고영향 인공지능의 확인 요청은 의무사항인가?\nA 이는 의무가 아닌 사업자의 선택 사항이다. 사업자가\
    \ 스스로 고영향 인공지능이라고 판단하면 별도의 확인 절차\n     없이 책무를 이행하면 된다.\n\n\nQ '인공지능 개발사업자'와 '인공지능\
    \ 이용사업자'는 어떻게 다른가?\nA    '개발사업자'는 인공지능을 개발하여 제공하는 자이며, '이용사업자'는 제공받은 인공지능을 이용하여\
    \ 제품 또는\n     서비스를 제공하는 자이다. 하나의 기업이 두 가지 지위를 동시에 가질 수도 있다.\n\n\nQ 일정 규모 이상의 해외\
    \ 사업자는 어떤 의무가 추가되나?\nA 국내에 주소나 영업소가 없는 해외 사업자 중 매출액이나 이용자 수가 일정 기준(예: 매출 1조원 이상\
    \ 등)을 넘\n     는 경우, 책무 이행 지원 등을 위한 '국내대리인'을 지정해야 한다.\n\n\nQ 개발사업자로부터 시스템을 구매해\
    \ 단순히 운영만 하는데도 위험관리 계획을 세워야 하나?\nA 이용사업자도 운영 위험관리 계획을 수립해야 한다. 다만, 개발사업자가 이미 위험관리\
    \ 조치를 완료한 시스템을\n     도입했고 중대한 기능 변경을 초래하지 않았다면, 개발사업자의 조치 내용을 자신의 계획으로 준용할 수 있다.\n\
    \n\nQ 위험관리를 위한 별도의 전담 조직을 반드시 새로 만들어야 하나?\nA    사업자의 규모 및 역량을 고려하여 기존 조직이나 인력이\
    \ 겸임할 수 있다. 다만, 개발 부서와 분리된 독립성을\n     확보하는 것이 권장된다\n\n\nQ '설명 방안' 책무를 위해 AI의 모든\
    \ 판단 근거를 설명해야 하나?\nA    기술적으로 가능한 범위에서 이행하면 된다. 실질적으로 이용자의 권리에 영향을 미치는 중대한 결과를\
    \ 상세히\n     설명하고, 영향이 적은 출력에 대해서는 시스템 수준의 일반적인 설명을 제공하는 등 차등을 둘 수 있다.\n\n\nQ 홈페이지에\
    \ 책무 이행 내용을 게시할 때 영업비밀이 유출될까 우려된다.\nA 시행령에 따르면 「부정경쟁방지 및 영업비밀보호에 관한 법률」에 따른 영업비밀에\
    \ 해당하는 사항은 홈페이지 게\n     시에서 제외할 수 있다. 따라서 기술적 사양보다는 관리 체계와 이용자 권리 보호 절차 위주로 공개하면\
    \ 된다.\n\n\n\n\n12"
