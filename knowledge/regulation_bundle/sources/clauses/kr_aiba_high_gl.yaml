- id: KR-AIBA-HIGH-GL:PAGE-018-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.18 · 정보통신망의 안정성 및 정보의 신뢰성 확보를 위한 보호조치를 요
  text: "정보통신망의 안정성 및 정보의 신뢰성 확보를 위한 보호조치를 요\n                             구하며, 이는\
    \ 인공지능이 안정적으로 기능하고 신뢰할 수 있는 정보\n              제45조(정보통신망의    를 제공해야 한다는 인공지능 사업자\
    \ 책무의 기본적인 전제와 부합\n               안정성 확보 등)     한다. 단, 정보통신망법의 위험은 전자적 침해행위 방지,\
    \ 불법 유\n                             출·위조·변조·삭제 방지 등 주로 사이버 보안 및 정보 유출에 초점\n \
    \ 정보통신망\n                             을 맞춘 위험 관리이다.\n  이용촉진 및\n              \
    \               인공지능 사업자 책무의 '상설 위험관리기구(조직) 운영' 중 위험관\n 정보보호 등에\n            \
    \                 리 조직체계 구성 및 담당인력 지정과 직접적인 유사성을 가진다.\n  관한 법률\n             \
    \                그러나 정보보호 최고책임자가 주로 정보보안 전문가의 역할을 수\n              제45조의3(정보보호\n\
    \                             행하는 것과 달리, 인공지능 위험관리조직의 책임자 및 담당 인력은\n         \
    \     최고책임자의 지정 등)\n                             기술적 전문성 외에 윤리, 법률, 사회과학적 지식 등\
    \ 다양한 분야의\n                             이해를 바탕으로 인공지능의 복합적인 위험을 평가하고 대응할 수\n \
    \                            있는 역량이 요구된다.\n                             개인정보가\
    \ 분실·도난·유출·위조·변조 또는 훼손되지 않도록 안전성\n                             확보에 필요한 기술적·관리적\
    \ 및 물리적 조치를 요구하며, 제31조\n                             는 이를 총괄할 개인정보 보호책임자를 지정하도록\
    \ 한다. 이는 고영\n              제29조(안전조치의무)   향 인공지능 사업자 책무의 '위험관리체계 구축'과 '상설 위험관리기\n\
    \                             구 운영'과 매우 흡사하다. 단, 개인정보 보호법의 위험은 개인정보\n 개인정보 보호법\
    \                    침해에 국한되므로, 개인의 식별 가능 정보와 관련된 유출, 오용,\n                  \
    \           남용 등 프라이버시 침해 위험이 주된 대상이다.\n                             개인정보 보호책임자가\
    \ 업무를 독립적으로 수행할 수 있도록 보장\n               제31조(개인정보     해야 한다는 조항(제31조 제6항)은 인공지능\
    \ 위험관리기구의 독립\n              보호책임자의 지정 등)   성 및 객관성 확보를 위한 중요한 시사점을 제공한다. 단, 개인정보\n\
    \                             보호책임자의 책임은 주로 개인정보 보호에 한정된다.\n\n\n주요 내용\n본 절의 사업자\
    \ 책무사항 주요 내용을 주제별로 분류하면 아래와 같다.\n\n   책무사항              주제                   \
    \        소주제\n                                  1-1-1. 위험관리 계획의 수립\n         \
    \                         1-1-2. 위험 식별\n              1-1. 위험관리정책 수립 및\n     \
    \                             1-1-3. 위험 분석 및 평가\n              이행\n 1. 위험관리방안의\
    \                       1-1-4. 위험 처리\n   수립·운영                          1-1-5.\
    \ 위험관리정책 개선\n                                  1-2-1. 위험관리 조직체계 구성\n         \
    \     1-2. 위험관리 조직체계 수립\n                                  1-2-2. 정보의 제공\n   \
    \           및 운영\n                                  1-2-3. 유관 조직과의 협력"
