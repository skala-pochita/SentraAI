- id: KR-AIBA-HIGH-GL:PAGE-053-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.53 · 3.4 고영향 인공지능에 대한 사람의 관리·감독
  text: "3.4 고영향 인공지능에 대한 사람의 관리·감독\n\n관련 기술고시 조문\n제7조(사람의 관리·감독) ① 사업자는 고영향 인공지능\
    \ 개발 과정에서 사람의 관리ㆍ감독을 위하여 다음 각 호의 사\n항을 이행하여야 한다.\n 1. 사람이 인공지능 동작에 개입할 수 있는 기준\
    \ 확립\n 2. 긴급 정지 기능 등 사람이 즉각적으로 인공지능을 정지하거나 작동을 변경할 수 있는 개입 방법 마련\n② 사업자는 고영향 인공지능\
    \ 운영 과정에서 사람의 관리·감독을 위해 다음 각 호의 사항을 이행하여야 한다.\n 1. 성능저하 및 오류 발생에 대한 정기적인 점검계획\
    \ 및 방안 마련\n 2. 인공지능의 범위 및 수행능력에 대한 이해도를 향상시키기 위한 교육 및 훈련 제공\n\n\n\n타 법령의 유사 조치사항\n\
    \        법령                조항                            내용\n                \
    \                      기계적 또는 자동화된 시스템으로 인한 위험을 사전에 감지하\n                 제53조(고용노동부장관의\
    \ 시\n     산업안전보건법                          고, 사람의 개입을 통해 사고를 예방하려는 점에서 유사한 보\n\
    \                 정조치 등)\n                                      호 원칙을 따른다.\n\n\
    \n주요 내용\n본 절의 사업자 책무사항 주요 내용을 주제별로 분류하면 아래와 같다.\n\n     책무사항                 주제\
    \                              소주제\n\n     4. 고영향                            4-1-1.\
    \ 사람의 개입 기준\n               4-1. 인공지능 개발 단계\n     인공지능에                      \
