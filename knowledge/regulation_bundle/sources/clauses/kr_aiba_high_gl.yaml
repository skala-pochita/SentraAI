  heading: PDF p.90 · 1         문서 소개
  text: "1         문서 소개\n본 문서는 『채용 AI 시스템 (AI-Career)』과 관련된 사업자책무 이행사항을 관리하기 위한 안전신뢰문서이다.\n\
    \n\n\n용어 정의\n본 문서에서 사용되는 용어는 다음과 같다.\n\n        용어                           \
    \       정의\n       참고 지표         AI가 산출한 점수·등급·추천 결과 중 채용 의사결정의 근거 정보로 제공되는 지표.\n\
    \   최종 의사결정           채용 여부·단계 통과 여부를 결정하는 행위\n   안전 임계값\n                   \
    \  편향·품질 저하 등 위험 징후를 판단하기 위해 사전에 설정한 기준값\n(Safety Threshold)\n       품질 경고   \
    \      입력 데이터 품질이 기준 미달로 판단될 때 사용자에게 제공되는 알림 기능\n       이의제기          지원자 또는 고객사가\
    \ AI 도출 결과에 대해 설명 요청·재검토를 요구하는 행위\n       근거 문장         AI가 평가 참고를 위해 중요하다고 판단한\
    \ 지원자 답변 텍스트 구간\n       근거 구간         AI가 평가 참고를 위해 중요하다고 판단한 면접 영상 구간\n\n\n적용\
    \ 문서\n본 문서는 아래의 문서에 적용된다.\n\n        ID                문서종류                  \
    \       문서명\n REG-2026-003             내부규정                  AI 신뢰성 관리 규정 v1.0\n\
    \ SOP-2026-001             절차서                  AI 시스템 운영 절차서 v1.0\n SOP-2026-002\
    \             절차서               AI 시스템 이슈 대응 절차서 v1.0\n  REF-2026-001        \
    \     기타                  채용 AI 시스템 개요서 v1.2\n  REF-2026-002             기타  \
    \             채용 AI 시스템 사용 가이드 v1.3\n  SLA-2026-001             기타           \
    \       SLA 표준 계약서(AI-Career)\n  RM-PL-0001               기타                 \
    \      위험관리계획서\n  RM-PL-0002               기타                    인공지능 시험 계획서\n\
    \  RM-REF-0001              기타                        위험관리대장\n  RM-REF-0002  \
    \            기타                    공정성/편향성 관리 대장\n  RM-REF-0003              기타\
    \                     모델 버전 관리대장\n  RM-REF-0004              기타              \
    \      시스템 버전 관리대장\n  RM-REF-0005              기타                      데이터 관리\
    \ 대장\n  RM-REF-0006              기타                   시스템 운영·모니터링 대장\n  RM-REF-0007\
    \              기타                    인공지능 시험 결과서\n  RM-REF-0008              기타\
    \                  위험관리 위원회 활동 보고서\n  RM-REF-0009              기타            \
    \         개인정보 처리 대장\n\n\n\n\n                                               \
    \                        89"
