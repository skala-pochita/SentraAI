  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.14 · Q 개인정보가 포함된 데이터를 학습에 써도 되나?
  text: "Q 개인정보가 포함된 데이터를 학습에 써도 되나?\nA   적법한 동의를 받거나 가명처리 등 개인정보 보호법에 따른 조치를 취한 후\
    \ 사용해야 하며, 데이터의 보유 기\n    간과 파기 절차도 수립해야 한다.\n\n\nQ 이용자가 인공지능의 결정에 대해 이의를 제기하면\
    \ 어떤 절차를 거쳐야 하나?\nA   이용사업자는 이용자가 이의를 제기하거나 설명을 요구할 수 있는 절차를 수립해야 한다. 이 때 사람 전문가가\n\
    \    해당 결정을 재검토하거나, AI 분석 로그 등을 바탕으로 판단 근거를 안내하는 등의 대응 프로세스가 필요하다.\n\n\nQ '사람의\
    \ 관리·감독'이란 사람이 24시간 감시해야 한다는 뜻인가?\nA 위험 수준에 따라 상시 개입 또는 예외적 개입 등 적절한 수준을 정하면 된다.\n\
    \nQ 사람의 관리·감독을 위해 반드시 인공지능 안전 전문 인력을 새로 고용해야 하나?\nA   사업자의 규모와 역량을 고려하여 기존 조직\
    \ 내에서 담당 인력을 지정하거나 겸임 인력을 두는 것도 가능하다.\n    중요한 것은 이상 상태 발생 시 즉각 개입할 수 있는 권한과 기준이\
    \ 명확히 정의되어 있는가이다.\n\n\nQ 작성한 '안전신뢰문서'와 이행 근거 자료는 얼마나 오랫동안 보관해야 하나?\nA 인공지능사업자는\
    \ 법 제34조제1항 각 호의 조치를 이행하고 그 근거를 문서로 작성하여 5년간 보관해야 한다.\n\nQ 문서는 어떤 양식으로 작성해야 하나?\n\
    A   '안전신뢰문서' 표준 양식을 참고하되, 기업의 상황에 맞게 조정할 수 있다. 기존 사내 문서 및 관리 시스템이\n    내용을 충족하면\
    \ 이를 인용하는 것도 가능하다.\n\n\n\n\n                                                 \
    \              13"
