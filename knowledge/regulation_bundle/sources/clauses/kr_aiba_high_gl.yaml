- id: KR-AIBA-HIGH-GL:PAGE-057-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.57 · 4-2   인공지능 운영 단계
  text: "4-2   인공지능 운영 단계\n\n4-2-1. 정기적 점검                                       \
    \     개발사업자   이용사업자\n\n     목표     인공지능의 성능저하 및 오류 발생을 예방할 수 있도록 정기적인 점검 계획 및\
    \ 방안을 마련해야 함.\n     설명     개발 및 이용사업자는 인공지능에 발생할 수 있는 문제를 예방할 수 있도록 정기적인 점검 계획\
    \ 및 방안을\n            수립해야 함.\n           - 정기적 점검의 목적 (예: 성능 최적화, 보안 패치, 백업 및\
    \ 복구, 하드웨어 및 네트워크 안정성 유지)에\n            따라 점검 담당자 및 점검 주기를 마련할 수 있음.\n       \
    \    - 점검 중 발견한 문제를 관리하기 위한 절차 또는 점검표를 마련할 수 있음.\n     참고     韓 신뢰할 수 있는 인공지능\
    \ 개발안내서\n           - 요구사항 13. 인공지능 시스템의 안전 모드 구현 및 문제발생 알림 절차 수립\n          \
    \ - 세부요구사항 13-2. 인공지능 시스템에서 문제가 발생할 경우, 시스템은 이를 운영자에게 전달하는\n             기능을 수행하는가?\n\
    \            美 NIST AI RMF\n           - MEASURE 2.6: 인공지능 시스템 배포 이후 식별된 위험에\
    \ 대해 정기적으로 재평가\n            EU AI ACT\n           - 제14조제3항제b호: 위험 수준에 맞는 통제\
    \ 방안을 위해 배포자가 구현하기 적절한 통제 방안 적용\n           - 제14조제4항제a호: 위험 통제를 위해 사용자가 인공지능\
    \ 시스템의 기능 및 한계를 이해하고 점검할 수\n            있도록 구성\n                             \
    \                                     사업자 구분\n 자가점검       정기적 점검 목적에 따라 점검 담당자\
    \ 및 점검 주기가 적절히 수립되어 있는가?          개발 이용\n            점검 중 발견한 문제를 관리하기 위한 절차\
    \ 또는 점검표가 존재하는가?               개발 이용\n\n      사례       Linkedin-AlerTiger: 인공지능\
    \ 모델 상태 모니터링 시스템\nLinkedIn은 자사 인공지능 모델 상태를 실시간으로 모니터링하기 위해 AlerTiger라는 딥러닝 기반\
    \ MLOps 시스템을\n개발함. 이 시스템은 입력 데이터와 출력 결과의 이상 징후를 탐지하고, 이용자에게 알림을 제공하여 모델의 성능 저하나\n\
    오류를 조기에 감지할 수 있도록 지원함.\n\n\n\n\n56"
