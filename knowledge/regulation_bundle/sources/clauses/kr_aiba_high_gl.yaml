- id: KR-AIBA-HIGH-GL:PAGE-021-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.21 · 1-1-2. 위험 식별                                       개발사업자         이용사업자
  text: "1-1-2. 위험 식별                                       개발사업자         이용사업자\n\n\
    \     목표     사람의 생명, 신체의 안전 및 기본권에 중대한 영향을 미칠 수 있는 위험을 식별해야 함.\n     설명    \
    \ 개발사업자는 인공지능의 설계, 데이터 수집, 모델 학습, 테스트 등 개발 전 과정에서 발생 가능한 사람의\n            생명,\
    \ 신체의 안전 및 기본권에 대한 잠재적 위험을 식별하기 위해 노력해야 함.\n            이용사업자는 개발사업자로부터 제공받은\
    \ 정보를 바탕으로, 실제 환경에서 인공지능이 이용될 때 발생할\n            수 있는 사람의 생명, 신체의 안전 및 기본권에 대한\
    \ 위험을 식별하고, 관련 데이터(사고 신고, 불만 사항,\n            수리 내역 등)를 통해 지속적으로 갱신하기 위해 노력해야\
    \ 함.\n     참고     韓 신뢰할 수 있는 인공지능 개발안내서\n           - 요구사항 01. 인공지능 시스템에 대한 위험관리\
    \ 계획 및 수행\n           - 세부요구사항 01-1. 인공지능 시스템 수명주기에 걸쳐 나타날 수 있는 위험 요소를 분석하였는가?\n\
    \            美 NIST AI RMF\n           - MEASURE 3.1: 인공지능 시스템 배포에 따른 위험관리를 위해\
    \ 정기적인 위험 식별 및 추적 체계 구축\n            EU AI ACT\n           - 제9조제2항제a호: 인공지능\
    \ 수명주기 동안 위험 식별분석 및 정기적인 검토갱신\n                                            \
    \                      사업자 구분\n 자가점검       인공지능 개발 과정에서 발생 가능한 위험을 식별하고 있는가?\
    \                      개발\n            인공지능 운영 과정에서 발생 가능한 위험을 식별하고 운영 데이터를 통해\
    \ 관련 내용을         이용\n            지속적으로 갱신하기 위해 노력하고 있는가?\n\n      사례       위험요소\
    \ 예시\nOECD에서는 생성형 인공지능에 대해 아래와 같은 위험 요소를 명시함.\n 인공지능 \"환각\" 또는 설득력 있지만 부정확한 출력\n\
     허위 및 오해의 소지가 있는 콘텐츠\n 지적재산권 침해\n 직업 및 노동 시장 변화 (예: 자동화에 따른 일자리 대체 및 노동시장 내\
    \ 불균형 심화 가능성)\n 에너지 소비와 환경 (예: 생성형 AI 모델 학습 및 추론 시 높은 에너지 소비로 인한 환경 부담 증가)\n\
     편견, 고정관념 증폭 및 개인 정보 보호 문제\n 잠재적인 미래 위험 및 우려 사항\n\n\n\n\n20"
