- id: KR-AIBA-HIGH-GL:PAGE-023-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.23 · 1-1-4. 위험 처리                                        개발사업자         이용사업자
  text: "1-1-4. 위험 처리                                        개발사업자         이용사업자\n\
    \n     목표     위험 분석 및 평가 결과에 따라 위험 요소별로 위험을 처리하는 적절한 조치를 채택해야 함.\n     설명   \
    \  개발 및 이용사업자는 이전에 분석 및 평가된 위험 요소별로 인명 피해 및 사고를 방지하거나 부정적\n            영향을 최소화하기\
    \ 위한 적절한 처리 방안을 마련하고 실행해야 함.\n           - 마련된 방안을 통해 위험이 실제로 처리되었는지를 모니터링하고,\
    \ 잔여 위험이 존재하는 경우, 해당 잔여\n            위험이 허용할 수 있는 수준이 되도록 노력해야 함.\n          \
    \ - 적절한 위험 처리를 위해 ｢인공지능 기본법｣ 제24조에 따라 구축 및 운영되는 인공지능 실증기반 이용\n            등을 고려할\
    \ 수 있음.\n            개발사업자는 개발 중 발생한 위험을 처리하고, 필요 시 처리 결과를 확인할 수 있도록 관련 정보를\n\
    \            이용사업자에게 제공해야 함.\n            이용사업자는 운영 중 발생할 수 있는 위험에 대해 별도의 처리\
    \ 계획을 마련해야 함.\n     참고     韓 신뢰할 수 있는 인공지능 개발안내서\n           - 요구사항 01. 인공지능\
    \ 시스템에 대한 위험관리 계획 및 수행\n           - 세부요구사항 01-2 위험 요소를 제거 및 방지하거나 영향을 완화하기 위한\
    \ 방안을 마련하였는가?\n            美 NIST AI RMF\n           - MANAGE 1.3: 위험 우선순위 기반의\
    \ 대응 방안 개발 및 위험처리 옵션 정의\n            EU AI ACT\n           - 제9조제2항제d호: 식별한 위험에\
    \ 대한 적절하고 구체적인 대응 방안 수립\n           - 제9조제5항: 위험 처리 이후 남아있는 위험에 대한 식별 및 관리 방안\
    \ 수립 및 적용\n                                                                  \
    \ 사업자 구분\n 자가점검       위험별로 제거, 완화, 모니터링, 수용 등 처리 방안을 명확히 수립하고 실행하고 있는가?     개발\
    \ 이용\n            처리된 위험에 잔여 위험이 존재하는 경우 이는 허용할 수 있는 수준인가?              개발 이용\n\
    \            개발 중 처리한 위험에 대한 기록을 보유하여 필요 시 관계자에게 제공할 수 있는가?          개발\n   \
    \         운영 중 발생할 수 있는 위험에 대한 처리 계획(예: 사용 제한, 알림 등)이 존재하는가?      이용\n\n    \
    \  사례       위험처리 방안 예시\n 제거(elimination): 위험을 발생시키는 활동을 시작하거나 계속하지 않기로 결정하여 위험\
    \ 혹은 위험의 원천을 제거.\n     (예: 특정 기능이나 시스템을 제거, 특정 장치 도입.)\n 완화(mitigation): 위험의\
    \ 발생 가능성 또는 결과를 변경하여 위험을 완화. (예: 모델의 해석 가능성을 높이기 위해\n     새로운 알고리즘 도입.)\n 모니터링(monitoring):\
    \ 모든 위험을 완전히 제거하거나 완화하기 어려운 경우, 위험을 타 기관과 공유하거나\n     지속적으로 지켜보면서 피드백을 제공하여 위험을\
    \ 모니터링하며, 재정적 손실에 대비하기 위해 보험이나 계약을\n     활용하는 방법도 포함. (예: 계약 또는 보험 구매, 배포 이후에도\
    \ 지속적으로 시스템 모니터링, 위험 요소 감지.)\n 수용(acceptance): 경미한 위험에 적용되며, 기회를 추구하기 위해 정보를\
    \ 기반으로 위험을 방치하여 위험을 수용.\n     (예: 위험이 있지만 신제품·서비스 출시.)\n\n\n\n\n22"
  condition: high_impact_ai
  assessable: true
