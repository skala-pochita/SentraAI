  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.32 · 2-1   인공지능이 도출한 최종결과 및 기준에 대한 근거 마련
  text: "2-1   인공지능이 도출한 최종결과 및 기준에 대한 근거 마련\n\n2-1-1. 투명성 및 설명가능성 확보            \
    \                            개발사업자\n\n 목표     인공지능의 투명성 및 설명가능성을 확보하고, 가능한 범위에서\
    \ 설명가능성을 높이기 위한 다양한 기술적\n        조치를 마련해야 함.\n 설명     개발사업자는 인공지능의 주요 작동원리, 기능\
    \ 및 한계를 문서화하여 투명성 확보에 기여해야 함.\n       - 학습 구조, 알고리즘 구조, 인공지능 모델 등을 포함할 수 있음.\n\
    \       - 시스템 아키텍처 또는 알고리즘이 조정된 경우 문서화된 자료를 수정할 수 있음.\n        개발사업자는 기술적·인력적으로\
    \ 가능한 범위에서 이용자가 이해하기 쉽도록 내용을 기재해야 하고,\n        시각화 도구 또는 요약보고서 등 보조 수단을 활용할 수\
    \ 있음.\n 참고     韓 신뢰할 수 있는 인공지능 개발안내서\n       - 요구사항 11. 인공지능 모델 명세 및 추론 결과에 대한\
    \ 설명 제공\n       - 세부요구사항 11-1. 인공지능 모델의 명세를 투명하게 제공하는가?\n        美 NIST AI RMF\n\
    \       - GOVERN 1.4: 인공지능 수명주기 전반의 문서화 정책 수립\n       - MAP 2.1: 인공지능 시스템의 목적,\
    \ 기술 사양, 성능 기준을 명확히 정의하고 문서화\n       - MEASURE 2.9: 책임 있는 인공지능 시스템 사용을 위해 인공지능\
    \ 모델 설명을 문서화하고, 출력 해석\n        기준 정의\n        EU AI ACT\n       - 제13조제1항: 고위험\
    \ 인공지능 시스템 배포자는 이용자가 시스템 출력을 해석하고 활용할 수 있도록 설계\n        및 개발\n               \
    \                                               사업자 구분\n자가점검    인공지능의 주요 작동원리,\
    \ 기능 및 한계를 문서화하여 인공지능의 투명성을 확보하는데         개발\n        기여하고 있는가?\n        설명 가능성을\
    \ 확보하기 위한 기술적 조치나 대안 조치를 적용하고 있는가?               개발\n\n\n\n\n                \
    \                                                       31"
  condition: high_impact_ai
  assessable: true
  evidence_scope: finding
