- id: KR-AIBA-HIGH-GL:PAGE-100-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.100 · 설명방안의 수립 및 시행
  text: "설명방안의 수립 및 시행\n   설명 목적      인공지능 시스템에 대한 이용자의 이해와 신뢰 증진 및 의사 결정의 투명성 확보\n\
    \              채용 AI 시스템의 이용자 설명 요청 건에 대해 AI 결과(참고 지표)와 핵심 근거를 간결\n   설명 범위\n\
    \              히 제공하며, 시스템의 한계 및 금지 사용 예시를 함께 안내\n              고객만족팀(고객사 이의제기\
    \ 및 설명 요청 응대, 처리 현황 및 고객 피드백 관리)\n 담당 조직 및 역할\n              ※ 필요시 AI서비스운영팀, AI연구개발팀,\
    \ 데이터거버넌스팀 등 관련 부서 협조 必\n   설명 방안      이용자 email 전달 혹은 유선 상담 (설명 자료는 이메일 제공)\n\
    \               요청   접수:   고객센터   이메일(contact@xxcareer.com)   또는   회사   대표\n\
    \               번호(0XX-1234-5678)를 통해 문의 접수\n               데이터 추출: 해당 건의 입력\
    \ 데이터 품질 지표, AI 결과 리포트(답변 텍스트 요약, 근거\n               문장 하이라이트, 참고 지표별 영상 내 근거\
    \ 구간)를 추출\n               내부 검토: AI서비스운영팀이 품질 저하 여부(조명/잡음/누락 등) 점검 및 필요시\n  \
    \             AI연구개발팀과 협의하여 결과 적정성 재확인\n   설명 절차\n               설명자료 작성: AI\
    \ 출력의 의미, 참고 지표의 한계, 주요 근거(요약, 문장 하이라이트, 영상\n               내 근거 구간), 재검토 결과 및\
    \ 권고 조치를 포함하여 설명 자료 작성\n               결과 통지: 이용자에게 이메일을 통해 설명 자료 제공 및 후속 조치\
    \ 안내(재평가, 내부 수기\n               검토 진행 사항 등)\n               기록 및 개선 반영: 설명 요청·이의제기\
    \ 사례를 고객 이의제기 처리 이력(ID:\n               RM-REF-0006)에 기록\n\n\n\n\n           \
    \                                                              99"
