- id: KR-AIBA-HIGH-GL:PAGE-009-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: 'PDF p.9 ·  제9조: (제7항) 실환경 적용 가능성 검증을 위한 실환경 기반 시험 절차 정의'
  text: " 제9조: (제7항) 실환경 적용 가능성 검증을 위한 실환경 기반 시험 절차 정의\n            제10조: 학습데이터의\
    \ 품질 확보를 위한 적정성, 공정성, 대표성 기반의 데이터셋 구축\n            제13조: 인공지능 시스템의 의도된 목적, 성능,\
    \ 위험 등을 포함한 명확한 사용 지침 제공\n            제15조: 정확도 및 견고성을 위해 측정 방법 및 복원력 확보 방안 정의\n\
    \            제26조: (제5항) 운영 중 발생가능한 위험 대응을 위해 모니터링 수행 및 이상 발생 시 즉시 보고, 사용 중단\n\
    \                 (제6항) 고위험 인공지능의 추적성 및 책임성 확보를 위해 목적에 맞는 시스템 로그를 최소\n       \
    \          6개월간 보관\n     EU     제43조: 인공지능 시스템의 안전성 및 규제 준수를 위해 적합성 평가 절차 수행\n\
    \            제60조: 실사용 적합성 검증을 위한 테스트 수행\n            제72조: 지속적 요구사항 준수 확인을\
    \ 위해 모니터링 체계 수립 및 운영\n                 (제2항) 지속적 요구사항 준수 확인을 위해 모니터링 운영\n    \
    \        제86조: 영향받는 자에게 인공지능 결정에 대한 이해를 위한 설명 제공\n            전문(recital) 10:\
    \ 데이터 수집처리 시 개인정보보호를 위해 관련 법규 준수 및 데이터 주체의 권리 보장 정의\n            전문(recital)\
    \ 27: 인공지능 시스템은 안전성, 투명성, 다양성 등을 고려하여 설계\n            전문(recital) 171: 영향받는 자의\
    \ 권리 보장을 위해 인공지능의 결정에 대한 설명 제공\n\n\n제4호. 고영향 인공지능에 대한 사람의 관리·감독\n\n    참조문서  \
    \                                 설명\n            13: 인공지능 시스템의 안전 모드 구현 및 문제발생\
    \ 알림 절차 수립\n            13-1: 공격, 성능 저하 및 사회적 이슈 등의 문제 발생 시 대응 가능한 안전 모드를 적용하는가?\n\
    \     韓\n            13-2: 인공지능 시스템에서 문제가 발생할 경우, 시스템은 이를 운영자에게 전달하는 기능을\n  \
    \          수행하는가?\n            GOVERN 1.7: 안전한 인공지능 시스템 폐기를 위해 관련 절차를 수립·이행\n\
    \            GOVERN 4.3: 인공지능 테스트 및 사고 대응 정보 공유\n            MAP 3.5: 거버넌스 정책에\
    \ 따른 감독 프로세스 정의, 평가, 문서화 수행\n     美      MEASURE 2.6: 인공지능 시스템 배포 이후 식별된 위험에\
    \ 대해 정기적으로 재평가\n            MEASURE 3.3: 이용자 피드백 전달 프로세스 구축 및 인공지능 시스템 평가 지표\
    \ 마련\n            MEASURE 4.1: 인공지능 위험 식별을 위해 상황별 측정 방법을 외부관계자와 협의 및 접근 방식 문서화\
    \ 수행\n            MANAGE 2.4: 목적 외 결과에 대한 대응을 위해 인공지능 시스템 대체, 해제 또는 비활성화 메커니즘\
    \ 마련\n            제4조: 책임 있는 인공지능 활용을 위해 이해관계자에게 인공지능 리터러시 교육 운영\n          \
    \  제14조: (제1항) 시스템 이용 중 사람이 통제할 수 있는 방안을 고려하여 인공지능 시스템을 설계개발\n             \
    \    (제3항제b호) 위험 수준에 맞는 통제 방안을 위해 배포자가 구현하기 적절한 통제 방안 적용\n     EU\n          \
    \       (제4항제a호) 위험 통제를 위해 사용자가 인공지능 시스템의 기능 및 한계를 이해하고 점검할 수\n              \
    \   있도록 구성\n                 (제4항제e호) 사람이 직접 제어할 수 있도록 중단 기능 등의 개입 절차를 포함하여 시스템\
    \ 구성\n\n\n\n\n8"
