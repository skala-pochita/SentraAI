  heading: PDF p.97 · 인공지능 모델명              음성 인식 AI 모델                       버전   v1.0
  text: "인공지능 모델명              음성 인식 AI 모델                       버전   v1.0\n     \
    \  목적                           면접 영상의 음성을 텍스트로 변환\n      모델 유형              \
    \             Seq2Seq 기반 음성인식 모델\n                1) 특징 추출: Mel-spectrogram 또는\
    \ Wav2Vec 기반 표현 생성\n      알고리즘\n                2) 음성 인식 및 텍스트 변환: Attention 기반\
    \ Seq2Seq 모델\n                1) 변환 텍스트의 오류 가능성 고지 및 원문 음성 재확인 기능 제공\n     설명가능성\
    \ 확보\n                2) STT 신뢰도 점수(Confidence score) 제공\n       방안\n        \
    \        3) 오디오 입력 품질 저하 시 품질 경고 문구 제공\n                 채용 AI 시스템 개요서 v1.2 (ID:\
    \ REF-2026-001)\n      관련 문서\n                 채용 AI 시스템 사용 가이드 v1.3 (ID: REF-2026-002)\n\
    \n\n\n     인공지능 모델명              텍스트 분석 AI 모델                      버전   v1.0\n\
    \       목적                       답변 텍스트를 분석하여 지원자의 역량 평가\n      모델 유형        \
    \                  Transformers 기반 LLM 모델\n                1) 임베딩 생성:\n      \
    \          ① 이력서·자기소개서의 텍스트 데이터를 입력으로 받아 Transformers 기반 문장 임\n      알고리즘    \
    \     베딩 생성\n                ② STT변환 텍스트 데이터를 입력으로 받아 Transformers 기반 문장 임베딩 생성\n\
    \                2) 근거 문장 검색: RAG 기반으로 역량 검사 결과에 대한 근거 문장 제공\n               \
    \ 1) 분석 결과의 평가 근거 문장 키워드 및 하이라이트 제공\n     설명가능성 확보\n                2) 사용 가이드를\
    \ 통해 점수 산정 로직 안내\n       방안\n                3) 집단별 결과 편차 점검(성별·연령 등) 및 결과 보고서\
    \ 제공\n                 채용 AI 시스템 개요서 v1.2 (ID: REF-2026-001)\n      관련 문서\n \
    \                채용 AI 시스템 사용 가이드 v1.3 (ID: REF-2026-002)\n\n\n\n\n96"
