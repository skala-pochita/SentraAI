- id: KR-AIBA-HIGH-GL:PAGE-048-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: 'PDF p.48 ·  문제 탐지 및 대응 속도 개선: 이상 징후를 조기에 감지하고 빠르게 대응 가능.'
  text: " 문제 탐지 및 대응 속도 개선: 이상 징후를 조기에 감지하고 빠르게 대응 가능.\n 정확도 향상: 방대한 로그·데이터를 분석해\
    \ 노이즈(허위 경고)를 줄이고 진짜 문제를 식별.\n 안정성 강화: 예측 분석을 통해 장애를 사전에 예방.\n IT 자산 최적화: 비효율적인\
    \ 리소스 사용을 분석하고 조정 가능.\n\n\nAIOps의 단점\n 도입 비용 및 복잡성: 초기 구축 비용이 높고, 통합 작업이 복잡할\
    \ 수 있음.\n 데이터 품질 의존도 높음: 잘못된 데이터가 들어가면 오탐이나 대응 실패 가능성 증가.\n 기술적 전문성 필요: 머신러닝\
    \ 모델의 튜닝과 해석에 대한 전문 지식 필요.\n 기존 시스템과의 충돌 가능성: 레거시 시스템과의 연계나 운영 방식 변화에 대한 저항 발생\
    \ 가능.\n 완전한 자동화는 아직 어려움: 예외 상황에서는 여전히 사람의 개입이 필요함.\n\n\n\n\n                \
    \                                          47"
