- id: KR-AIBA-HIGH-GL:PAGE-046-01
  source: KR-AIBA-HIGH-GL
  source_sha256: a88b7a8f14cae8588398cee507581aca17410762f8a401a48ff0b1219c05d183
  file_sha256: cbbd8a304563f879b2a584860481255cfb7b7e2d990fb13916404e306eea104e
  heading: PDF p.46 · 3-1-3. 시험 및 평가                                   개발사업자           이용사업자
  text: "3-1-3. 시험 및 평가                                   개발사업자           이용사업자\n\n\
    \ 목표      이용자 보호를 위해 위험 기반의 지속적인 시험 및 평가를 수행해야 함.\n 설명      개발 및 이용사업자는 인공지능의\
    \ 기술적 특성, 배치 환경을 고려하여 알려져 있거나 합리적으로 예측\n         가능한 위험에 대해 시험 및 평가해야 함.\n   \
    \     - 테스트케이스에 실제 환경에서 발생할 수 있는 다양하고 예외적인 상황을 포함시킬 수 있음.\n        - 객관성 확보를 위한\
    \ 외부 전문가 또는 기관의 검증 절차 도입을 고려할 수 있음.\n         개발 및 이용사업자는 시험 결과를 평가하여 이용자 보호와\
    \ 관련된 잠재적 위험을 관리해야 함.\n        - 이는 1-1-3의 위험 평가와 밀접하며, 평가 결과를 위험 개선과 이용자 보호에\
    \ 이용할 수 있음.\n        - A영역에서 개발 및 이용사업자는 실제 영향을 받는 이용자를 대상으로 참여형 평가를 수행해야 함.\n\
    \        - B영역에서 개발 및 이용사업자는 최종적으로 영향받는 자의 권익 보호를 목적으로 평가를 수행하기 위해\n         노력해야\
    \ 함.\n 참고      韓 신뢰할 수 있는 인공지능 개발안내서\n        - 요구사항 03. 인공지능 시스템의 신뢰성 테스트 계획\
    \ 수립\n        - 세부요구사항 03-1. 인공지능 시스템의 특성을 고려한 테스트 환경을 설계하였는가?\n         美 NIST\
    \ AI RMF\n        - GOVERN 4.3: 인공지능 테스트 및 사고 대응 강화를 위해 정보 공유를 포함한 조직적 수행 기준 정의\n\
    \        - MEASURE 1.2: 이용자 의견을 반영한 인공지능 측정 지표의 적정성 및 통제 수단 효과성을 정기적\n       \
    \    평가갱신\n        - MANAGE 2.3: 인공지능 시스템의 오작동 위험에 대응하기 위한 위험 식별 및 문서화 수행\n \
    \        EU AI ACT\n        - 제9조제7항: 실환경 적용 가능성 검증을 위한 실환경 기반 시험 절차 정의\n   \
    \     - 제43조: 인공지능 시스템의 안전성 및 규제 준수를 위해 적합성 평가 절차 수행\n        - 제60조: 실사용 적합성\
    \ 검증을 위한 테스트 수행\n                                                            \
    \      사업자 구분\n자가점검     테스트 케이스가 인공지능의 기술적 특성과 배치환경을 고려하고, 필요 시 다양하고        \
    \    개발 이용\n         예외적인 상황을 포함하고 있는가?\n         검증의 객관성 확보를 위해 내부 검증체계 운영 또는\
    \ 외부 전문기관 및 인력 활용을           개발 이용\n         고려하고 있는가?\n         시험평가 결과가 위험성\
    \ 평가로 이어지고 이를 이해관계자에게 공유하고 있는가?              개발 이용\n\n   사례       인공지능 시스템 시험\
    \ 지침\nISO/IEC TS 42119-2:2025는 인공지능 시스템의 시험에 대한 지침과 개요를 제공하는 기술 사양(Technical\n\
    Specification)이며, 기존 소프트웨어 시험 표준인 ISO/IEC/IEEE 29119 시리즈를 인공지능 시스템에 적용하는\n방법을\
    \ 설명함.\n 위험 기반 접근 방식: 인공지능 시스템과 관련된 위험을 식별하고, 이러한 위험을 기반으로 적절한 시험 방법, 접근\n 방식\
    \ 및 기술을 정의.\n 기존 표준 확장: 기존 소프트웨어 시험 프레임워크(ISO/IEC/IEEE 29119)를 대체하는 것이 아니라, 데이터\
    \ 중심\n 모델, 확률적 추론, 지속적 학습 등 AI의 고유한 문제와 도전에 맞게 확장하고 적용하는 방법을 제시.\n AI 수명주기 전반의\
    \ 시험: 인공지능 시스템 전체 수명주기 동안 필요한 시험 활동을 다룸.\n 신뢰성 및 안전성 검증: 인공지능 기술의 안전성과 신뢰성에 대한\
    \ 요구사항을 충족하기 위해, 데이터 품질 시험, 모델\n 테스트, 편향성 검증, 적대적 시험 등을 포함.\n\n\n\n          \
    \                                                                 45"
