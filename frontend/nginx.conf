server {
  client_max_body_size 21m;
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # OWASP Secure Headers. location 안에 add_header 를 두면 이 값이 상속되지 않으므로 server 에만 둔다.
  # style-src 'unsafe-inline': Vue 템플릿의 정적 style 속성용 (스크립트는 'self' 만 허용)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /llm/ {
    proxy_pass http://llm-proxy:8400/;
    proxy_read_timeout 120s;
    client_max_body_size 128k;
  }
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header X-Forwarded-Host $http_host;   # 로컬 모드 API 의 Host 검사용 (api/local_mode.py)
    proxy_buffering off;          # SSE
    proxy_read_timeout 3600s;
    # API 가 붙인 같은 헤더는 숨기고 위 server 값만 내보낸다 (중복 방지)
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
  }
  location / { try_files $uri $uri/ /index.html; }
}
