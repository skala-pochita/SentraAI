# sentraai CLI 배포: v* 태그를 push 하면
#  1) 서버 이미지 3개를 arm64·amd64 로 빌드해 비밀값 검사 후 GHCR 에 올리고
#  2) CLI 를 npm pack 해서 GitHub Release 에 첨부한다.
# 태그는 cli/package.json 의 version 과 같아야 한다 (예: 0.1.0 → v0.1.0).
# main 머지 전 시험: 브랜치에서 version 을 0.1.0-rc.1 로 바꾸고 v0.1.0-rc.1 태그를 push 하면 Pre-release 로 올라간다.
# 첫 배포 뒤 GHCR 패키지 3개를 Public 으로 바꿔야 로그인 없이 받을 수 있다.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
          - name: target-agent
            context: .
            file: targets/target-agent/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: 태그와 CLI 버전 일치 확인
        run: |
          v="v$(node -p "require('./cli/package.json').version")"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "태그 $GITHUB_REF_NAME 와 cli/package.json 버전 $v 가 다릅니다"; exit 1; }
          echo "VERSION=${v#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 검사용 빌드 (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: 이미지 비밀값 검사
        run: sh scripts/scan_image_secrets.sh scan/${{ matrix.name }}:ci

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드·push (arm64 + amd64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sentraai-${{ matrix.name }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=SentraAI ${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}

  cli:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 테스트·패키징
        working-directory: cli
        run: |
          npm test
          npm pack
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/sentraai-${ver}.tgz"
          # 0.1.0-rc.1 처럼 '-' 가 붙은 버전은 테스트용 Pre-release 로 올린다 (main 머지 전 브랜치에서 시험)
          case "$ver" in *-*) pre="--prerelease" ;; *) pre="" ;; esac
          gh release create "$GITHUB_REF_NAME" "cli/sentraai-${ver}.tgz" $pre \
            --title "sentraai ${GITHUB_REF_NAME}" \
            --notes "설치: \`npm install -g ${url}\`  (필요: Node 22.13+, Docker Desktop)"
