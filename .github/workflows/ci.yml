name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: auditor
          POSTGRES_PASSWORD: auditor
          POSTGRES_DB: auditor
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auditor -d auditor"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      OPENAI_API_KEY: ''
      TEST_DATABASE_URL: postgresql+asyncpg://auditor:auditor@localhost:5432/auditor_test
      DATABASE_URL: postgresql+asyncpg://auditor:auditor@localhost:5432/auditor
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.21
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy core harness mcp_servers
      - run: uv run alembic upgrade head
      - name: Unit and PostgreSQL integration tests
        run: uv run pytest -q -rs

  frontend-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - run: npm test
        working-directory: cli

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: backend/Dockerfile
          - name: target-agent
            context: .
            file: targets/target-agent/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          push: false
          tags: sentraai-qa/${{ matrix.name }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}
      - name: Verify image contains no local credentials
        run: sh scripts/scan_image_secrets.sh sentraai-qa/${{ matrix.name }}:ci
