id: SEC-INFO-001
name: Stack trace included in error responses
category: INFO_EXPOSURE
default_severity: LOW
target: code
file_globs: ["**/application*.yml", "**/application*.yaml"]
detector: yaml_path
paths: ["server.error.include-stacktrace"]
equals: always
needs_llm_review: false
references: ["OWASP-A05:2021", "CWE-209"]
fix_hint: "server.error.include-stacktrace: never"
