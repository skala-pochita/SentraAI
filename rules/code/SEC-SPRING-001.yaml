id: SEC-SPRING-001
name: permitAll on any request
category: SECCONFIG_PERMIT_ALL
default_severity: CRITICAL
target: code
file_globs: ["**/*.java", "**/*.kt"]
require_also: "SecurityFilterChain|HttpSecurity|WebSecurityConfigurerAdapter|ServerHttpSecurity"  # 이름이 아니라 내용으로 보안 설정 파일 선택 (SP4)
detector: regex
multiline: true
pattern: 'anyRequest\(\)\s*\.\s*permitAll\(\)'
needs_llm_review: true
references: ["OWASP-A01:2021", "CWE-284"]
fix_hint: "anyRequest().authenticated() 로 바꾸고, 공개 경로만 requestMatchers 로 명시"
