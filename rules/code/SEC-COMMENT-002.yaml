id: SEC-COMMENT-002
name: Internal IP or hostname in comment
category: COMMENT_SENSITIVE
default_severity: MEDIUM
target: code
file_globs: ["**/*.java", "**/*.kt", "**/*.yml", "**/*.yaml", "**/*.properties"]
detector: regex
comment_only: true
patterns:
  - '\b10\.\d{1,3}\.\d{1,3}\.\d{1,3}\b'
  - '\b172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}\b'
  - '\b192\.168\.\d{1,3}\.\d{1,3}\b'
  - '\b[a-z0-9\-]+\.(?:internal|corp|local|intra)\b'
needs_llm_review: false
references: ["OWASP-A05:2021", "CWE-615"]
fix_hint: "주석에서 내부 인프라 정보를 제거하고 운영 문서(접근 통제된 위키)로 이동"
