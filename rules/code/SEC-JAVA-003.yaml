id: SEC-JAVA-003
name: OS command built from variables
category: COMMAND_INJECTION
default_severity: CRITICAL
target: code
file_globs: ["**/*.java", "**/*.kt"]
detector: regex
multiline: true
patterns:
  - 'Runtime\.getRuntime\(\)\s*\.\s*exec\(\s*(?!")'          # exec(변수)
  - 'Runtime\.getRuntime\(\)\s*\.\s*exec\(\s*"[^"]*"\s*\+'    # exec("..." + x)
  - 'new\s+ProcessBuilder\([^;]*"\s*\+\s*[a-z_]'              # new ProcessBuilder("sh", "-c", "..." + x)
  - 'new\s+ProcessBuilder\([^;]*"(?:sh|bash|cmd(?:\.exe)?)"\s*,\s*"[-/]c"\s*,\s*[a-z_]'
needs_llm_review: true
references: ["OWASP-A03:2021", "CWE-78"]
fix_hint: "셸을 거치지 않고 인자 배열로 실행하고, 입력은 허용 목록으로 검증"
