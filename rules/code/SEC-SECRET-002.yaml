id: SEC-SECRET-002
name: High-entropy string assigned to secret-like variable
category: HARDCODED_SECRET
default_severity: HIGH
target: code
file_globs: ["**/*.java", "**/*.kt", "**/*.properties"]
detector: entropy
min_entropy: 4.0
min_length: 20
name_pattern: '(?i)(key|secret|token)'
suppressed_by: [SEC-SECRET-001]
needs_llm_review: true
references: ["OWASP-A07:2021", "CWE-798"]
fix_hint: "비밀값을 코드에서 제거하고 @Value(\"${...}\") + Vault/환경변수로 주입"
