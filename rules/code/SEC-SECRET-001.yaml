id: SEC-SECRET-001
name: Known secret token formats
category: SECRET_LEAK
default_severity: CRITICAL
target: code
file_globs: ["**/*"]
exclude_globs: ["**/*.md"]
detector: regex
patterns:
  - 'sk-(?:proj-)?[A-Za-z0-9_\-]{20,}'
  - 'sk_live_[A-Za-z0-9]{8,}'
  - 'AKIA[0-9A-Z]{16}'
  - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
  - 'eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}'
needs_llm_review: false
references: ["OWASP-A07:2021", "CWE-798"]
fix_hint: "키를 즉시 폐기·재발급하고 Vault/환경변수로 주입. 레포 이력에서도 제거(git filter-repo)"
