id: SEC-SECRET-004
name: Sensitive file committed to repository
category: SECRET_LEAK
default_severity: CRITICAL
target: code
file_globs: ["**/*"]
detector: python
check: sensitive_file_present
params:
  names: [".env", "*.pem", "*.p12", "*.jks", "*.key"]
suppressed_by: [SEC-SECRET-001]
needs_llm_review: false
references: ["OWASP-A05:2021", "CWE-538"]
fix_hint: ".gitignore 에 추가하고 레포 이력에서 제거, 포함된 키는 폐기"
