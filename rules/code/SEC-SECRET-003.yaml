id: SEC-SECRET-003
name: Plaintext password/secret in YAML config
category: HARDCODED_CREDENTIAL
default_severity: HIGH
target: code
file_globs: ["**/*.yml", "**/*.yaml"]
detector: yaml_path
paths: ["*.password", "*.secret", "password", "secret"]
plaintext_only: true
needs_llm_review: false
references: ["OWASP-A07:2021", "CWE-798", "CWE-259"]
fix_hint: "password: ${DB_PASSWORD} 처럼 환경변수 플레이스홀더로 바꾸고 값은 Vault 에서 주입"
