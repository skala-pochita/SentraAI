id: SEC-LOG-001
name: Sensitive value written to log
category: SENSITIVE_LOGGING
default_severity: MEDIUM
target: code
file_globs: ["**/*.java", "**/*.kt", "**/*.py"]
detector: regex
ignore_case: true
patterns:
  - 'log\.(?:info|debug|warn|error|trace)\(.*(?:password|token|secret)'
  - '(?:logger|logging|_log|log)\.(?:info|debug|warning|error|exception|critical)\(.*(?:password|passwd|token|secret|api_key)'   # Python (PY1)
  - '\bprint\(.*\b(?:password|passwd|secret|api_key)\b'   # Python print 로 비밀 출력
needs_llm_review: false
references: ["OWASP-A09:2021", "CWE-532"]
fix_hint: "비밀번호·토큰은 로그에서 제거하거나 마스킹"
