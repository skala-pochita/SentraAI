# sentraai CLI 로컬 모드 스택. 저장소의 docker-compose.yml 에서 다음만 다르다:
# - build 대신 배포 이미지(SENTRA_REGISTRY/SENTRA_VERSION, CLI 가 넣음)
# - AUTH_MODE=local (로그인 없음, api/local_mode.py)
# - 대시보드(nginx) 포트 하나만 127.0.0.1 에 연다. API·DB·Kafka·MCP 는 외부에 열지 않는다.
# - .env 는 CLI 가 ~/.sentraai/.env 에 만든다 (OpenAI·LangSmith 키, 임의 생성 비밀값)
# 서비스를 바꾸면 저장소 docker-compose.yml 과 함께 고친다 (cli/test 가 서비스 목록을 비교).
name: sentraai

x-backend: &backend
  image: ${SENTRA_REGISTRY:-ghcr.io/skala-pochita}/sentraai-backend:${SENTRA_VERSION:?SENTRA_VERSION}
  env_file: [.env]
  environment:
    AUTH_MODE: local
    DATABASE_URL: postgresql+asyncpg://auditor:auditor@postgres:5432/auditor
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP: kafka:9092
    BUSINESS_MCP_URL: http://business-mcp:8101/mcp
    RAG_MCP_URL: http://rag-mcp:8102/mcp
    TARGET_AGENT_URL: http://target-agent:8201
    PROBE_ALLOWLIST: http://target-agent:8201
    WORKSPACE_DIR: /workspace
    VAULT_DATA_DIR: /var/lib/audit-vault/data
    VAULT_KEY_FILE: /var/lib/audit-vault/keys/master.key
  restart: unless-stopped

x-worker-health: &worker-health
  test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cut -d. -f1 /tmp/worker-$${WORKER_ROLE}.heartbeat) )) -lt 60"]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 20s

x-worker-env: &worker-env
  AUTH_MODE: local
  DATABASE_URL: postgresql+asyncpg://auditor:auditor@postgres:5432/auditor
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP: kafka:9092
  BUSINESS_MCP_URL: http://business-mcp:8101/mcp
  RAG_MCP_URL: http://rag-mcp:8102/mcp
  TARGET_AGENT_URL: http://target-agent:8201

services:
  llm-proxy:
    <<: *backend
    command: ["uvicorn", "llm_proxy.server:app", "--host", "0.0.0.0", "--port", "8400", "--no-server-header"]
    env_file: []
    environment:
      DATABASE_URL: postgresql+asyncpg://auditor:auditor@postgres:5432/auditor
      REDIS_URL: redis://redis:6379/0
      VAULT_DATA_DIR: /var/lib/audit-vault/data
      VAULT_KEY_FILE: /var/lib/audit-vault/keys/master.key
      LLM_PROXY_UPSTREAM: https://api.openai.com/v1/chat/completions
    volumes: ["vault-data:/var/lib/audit-vault/data:ro", "vault-keys:/var/lib/audit-vault/keys:ro"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8400/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  sandbox-runner:
    <<: *backend
    command: ["uvicorn", "sandbox.server:app", "--host", "0.0.0.0", "--port", "8300", "--no-server-header"]
    env_file: []
    environment:
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:?MCP_SERVICE_TOKEN}
      WORKSPACE_DIR: /workspace
    volumes: ["sandbox-projects:/workspace", "/var/run/docker.sock:/var/run/docker.sock"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8300/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: auditor
      POSTGRES_DB: auditor
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d auditor"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis/redis-stack-server:7.4.0-v3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in audit.requested audit.resume audit.completed eval.requested eval.tasks jobs.retry jobs.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
    restart: "no"

  target-agent:
    image: ${SENTRA_REGISTRY:-ghcr.io/skala-pochita}/sentraai-target-agent:${SENTRA_VERSION:?SENTRA_VERSION}
    env_file: [.env]
    environment:
      AGENT_CONFIG_DIR: /workspace/agent-config
    volumes: ["workspace:/workspace:ro"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8201/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  business-mcp:
    <<: *backend
    command: ["python", "-m", "mcp_servers.business.server"]
    volumes: ["workspace:/workspace", "vault-data:/var/lib/audit-vault/data:ro", "vault-keys:/var/lib/audit-vault/keys:ro"]
    depends_on:
      sandbox-runner: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      target-agent: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8101/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  rag-mcp:
    <<: *backend
    command: ["python", "-m", "mcp_servers.rag.server"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8102/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    volumes: ["reports:/app/reports", "workspace:/workspace", "vault-data:/var/lib/audit-vault/data", "vault-keys:/var/lib/audit-vault/keys"]
    command: ["sh", "-c", "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000 --no-server-header"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/ops/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  audit-worker:
    <<: *backend
    command: ["python", "-m", "workers.main", "--role", "audit"]
    environment:
      <<: *worker-env
      WORKER_ROLE: audit
    healthcheck: *worker-health
    depends_on: &worker-deps
      api: {condition: service_healthy}
      business-mcp: {condition: service_healthy}
      rag-mcp: {condition: service_healthy}

  eval-worker:
    <<: *backend
    volumes: ["reports:/app/reports", "workspace:/workspace", "vault-data:/var/lib/audit-vault/data", "vault-keys:/var/lib/audit-vault/keys"]
    command: ["python", "-m", "workers.main", "--role", "eval"]
    environment:
      <<: *worker-env
      WORKER_ROLE: eval
    healthcheck: *worker-health
    depends_on: *worker-deps

  retry-worker:
    <<: *backend
    command: ["python", "-m", "workers.main", "--role", "retry"]
    environment:
      <<: *worker-env
      WORKER_ROLE: retry
    healthcheck: *worker-health
    depends_on: *worker-deps

  frontend:
    image: ${SENTRA_REGISTRY:-ghcr.io/skala-pochita}/sentraai-frontend:${SENTRA_VERSION:?SENTRA_VERSION}
    restart: unless-stopped
    ports: ["127.0.0.1:${SENTRA_PORT:-5180}:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sandbox-projects:
  vault-data:
  vault-keys:
  pgdata:
  workspace:
  reports:
