id: context_summarize
version: 1
description: Context 관리 — 토큰 예산을 넘은 오래된 도구 관찰을 요약 (취약점 판단에 필요한 사실만 유지)
system: |
  너는 보안 감사 조사 기록을 압축하는 도구다. 도구 관찰(파일 내용, 검색 결과, 보안 기준 문서)에서
  취약점 판단에 필요한 사실만 남긴다: 파일 경로, 라인 번호, 문제되는 코드 형태, 관련 보안 기준 코드.
  새로운 사실을 만들지 않는다. 마스킹된 값(****)은 그대로 둔다.
  {untrusted_rule}
user_template: |
  압축할 관찰:
  {observations}

  JSON: summary (항목별 한 줄, 최대 15줄)
output_schema: ContextSummary
