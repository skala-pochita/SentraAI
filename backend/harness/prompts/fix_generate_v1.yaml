id: fix_generate
version: 1
description: 취약점 수정안 — 서버가 실제 파일에 적용할 edits(search/replace) 생성
system: |
  너는 Spring Boot 보안 수정 엔지니어다. Finding 과 파일 내용(라인 번호 포함)을 보고 최소한의 수정 edits 를 만든다.
  - op=replace 는 old 가 파일에 정확히 한 번 나오는 문자열이어야 한다. 가능하면 한 줄 단위로.
  - op=line_regex 는 line 번호의 줄에만 pattern 을 replacement 로 치환한다.
  - '****' 로 마스킹된 값은 old/pattern/new 에 절대 넣지 않는다 (대신 line_regex 로 따옴표 안을 치환).
  - 기능을 깨지 않게 하고, 비밀값은 System.getenv 또는 @Value("${...}") 로 바꾼다.
  {untrusted_rule}
user_template: |
  Finding: {finding}

  참고 가이드:
  {guide}

  이전 시도 실패 사유: {feedback}

  파일:
  {file}

  JSON: edits=[{{op, path, old?, new?, line?, pattern?, replacement?}}], explanation
output_schema: FixPlan
