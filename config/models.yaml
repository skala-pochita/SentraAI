# 노드별 모델·temperature. ${VAR}는 환경변수로 치환된다.
defaults:
  model: "${LLM_SMALL_MODEL}"
  temperature: 0
  timeout_s: 60

nodes:
  code_investigate: {model: "${LLM_SMALL_MODEL}"}
  agent_static_check: {model: "${LLM_SMALL_MODEL}"}
  probe_generate: {model: "${LLM_SMALL_MODEL}"}
  probe_judge: {model: "${LLM_SMALL_MODEL}"}
  report: {model: "${LLM_SMALL_MODEL}"}

eval_configs:
  A_nano_single: {model: "${LLM_SMALL_MODEL}", mode: single, prompt: audit_single@v1}
  B_nano_harness: {model: "${LLM_SMALL_MODEL}", mode: harness}

embedding:
  model: "${EMBEDDING_MODEL}"
  dim: 1536
