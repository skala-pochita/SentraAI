# H8 예산 제어 한도
audit:
  max_tokens: 400000
  max_cost_usd: 2.0
react:
  max_steps: 6
  # Harness Agent Loop (강의 표 6-3): LLM 8턴, 작업 120초, 같은 도구 3회
  max_llm_turns: 8
  max_seconds: 120
  max_same_tool_calls: 3
  tool_result_max_chars: 8000   # Tools: 도구 결과는 잘라서 넘긴다
  context_tokens: 6000          # Context: 관찰 누적이 넘으면 오래된 관찰을 요약
  max_tokens_per_file: 12000
  risky_file_top_k: 8
  risky_name_keywords: [Config, Client, Security, Payment, Auth]
probe:
  max_adaptive_per_round: 4
  max_rounds: 2
  attempts: 3
  concurrency: 3
fix:
  max_retries: 3
mcp:
  call_timeout_s: 30
  inline_retries_s: [0.5, 2.0]
reliability:
  circuit_fail_threshold: 5
  circuit_open_s: 60
# Agent·Cloud 감사 (기획서 6장). A/B 구성에 동일하게 적용한다.
cloud_audit:
  max_llm_turns: 8            # 논리적 LLM 의사결정 호출 상한 (같은 턴의 429/503 재시도는 provider_request_count)
  max_active_seconds: 120     # 승인 대기 제외 활성 실행 누적
  min_remaining_for_collect_s: 30   # 이 이하면 추가 collect/repair 생략
  max_same_tool_calls: 3
  provider_retries: 2         # 429/503 최초 요청 뒤 최대 2회
  retry_backoff_s: [1.0, 2.0] # Retry-After 없을 때
  repair_rounds: 1
  tool_result_max_chars: 8000
  max_output_tokens: 4000
  max_cost_usd: 0.5
