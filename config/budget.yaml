# H8 예산 제어 한도
audit:
  max_tokens: 400000
  max_cost_usd: 2.0
  reserve_output_tokens: 2000   # LLM 호출 전 예약하는 출력 토큰 예상치 (병렬 호출 예산 초과 방지)
react:
  max_steps: 6
  concurrency: 4                # 동시에 조사하는 파일 수 (B1)
  # Harness Agent Loop (강의 표 6-3): LLM 8턴, 작업 120초, 같은 도구 3회
  max_llm_turns: 8
  max_seconds: 120
  max_same_tool_calls: 3
  tool_result_max_chars: 8000   # Tools: 도구 결과는 잘라서 넘긴다
  context_tokens: 6000          # Context: 관찰 누적이 넘으면 오래된 관찰을 요약
  max_tokens_per_file: 12000      # 파일당 도구 결과(관찰) 토큰
  max_llm_tokens_per_file: 60000  # 파일당 LLM 입력+출력 토큰 (H8)
  final_grace_s: 30               # 한도 도달 후 마지막 final 요청 유예
  risky_file_top_k: 8
  risky_name_keywords: [Config, Client, Security, Payment, Auth, Controller, Service, Repository, engine, tools, main, permissions]
probe:
  max_adaptive_per_round: 4
  max_rounds: 2
  attempts: 3
  concurrency: 3
  judge_concurrency: 4          # LLM 판정 동시 실행 수 (B4)
  attempt_concurrency: 3        # probe 1개의 시도 동시 실행 수 (B5)
fix:
  max_retries: 3
mcp:
  call_timeout_s: 30
  inline_retries_s: [0.5, 2.0]
reliability:
  circuit_fail_threshold: 5
  circuit_open_s: 60
